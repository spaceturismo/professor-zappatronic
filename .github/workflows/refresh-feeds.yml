name: Refresh Game and YouTube Updates
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/refresh-feeds.ps1
      - name: Build readable catalogs
        shell: bash
        run: node scripts/build-readable.cjs
      - name: Publish readable feeds
        shell: bash
        run: |
          git add game-updates.json youtube-updates.json index.html catalog.html catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh game and YouTube updates"
          git push
      - name: Rebuild GitHub Pages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/pages/builds" -Headers $headers