/* rounded box: sphere mapped onto a box with radius r on every edge */
Geo.prototype.rbox=function(cx,cy,cz,w,h,d,r,seg){seg=seg||4;r=Math.min(r,w/2-0.001,h/2-0.001,d/2-0.001);const ix=w/2-r,iy=h/2-r,iz=d/2-r,base=this.p.length/3,rows=seg*2,cols=seg*4;
  const sg=v=>v>1e-6?1:v<-1e-6?-1:0;
  for(let j=0;j<=rows;j++){const ph=j/rows*Math.PI;for(let i=0;i<=cols;i++){const th=i/cols*TAU,nx=Math.sin(ph)*Math.cos(th),ny=Math.cos(ph),nz=Math.sin(ph)*Math.sin(th);
    const x=cx+sg(nx)*ix+nx*r,y=cy+sg(ny)*iy+ny*r,z=cz+sg(nz)*iz+nz*r;this.v(x,y,z,nx,ny,nz,(x+z)*0.8,y*0.8);}}
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=base+j*(cols+1)+i,b=a+cols+1;this.i.push(a,b,a+1,b,b+1,a+1);}return this;};
/* tapered box (car cabins, lamp shades): bottom w0*d0 at y0, top w1*d1 at y0+h shifted dz */
Geo.prototype.taper=function(cx,y0,cz,w0,d0,w1,d1,h,dz){const B=[[-w0/2,y0,-d0/2],[w0/2,y0,-d0/2],[w0/2,y0,d0/2],[-w0/2,y0,d0/2]],Tp=[[-w1/2,y0+h,-d1/2+dz],[w1/2,y0+h,-d1/2+dz],[w1/2,y0+h,d1/2+dz],[-w1/2,y0+h,d1/2+dz]];
  const q=(a,b,c,d)=>{const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[d[0]-a[0],d[1]-a[1],d[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(...n)||1;n=n.map(x=>x/l);
    const P2=p=>[p[0]+cx,p[1],p[2]+cz];const i0=this.v(...P2(a),...n,0,0),i1=this.v(...P2(b),...n,1,0),i2=this.v(...P2(c),...n,1,1),i3=this.v(...P2(d),...n,0,1);this.i.push(i0,i1,i2,i0,i2,i3);};
  q(B[0],B[1],Tp[1],Tp[0]);q(B[1],B[2],Tp[2],Tp[1]);q(B[2],B[3],Tp[3],Tp[2]);q(B[3],B[0],Tp[0],Tp[3]);q(Tp[0],Tp[1],Tp[2],Tp[3]);return this;};

function segBox(ax,az,bx,bz,b){let t0=0,t1=1;const dx=bx-ax,dz=bz-az;
  for(const[p,d,lo,hi]of[[ax,dx,b.x1,b.x2],[az,dz,b.z1,b.z2]]){if(Math.abs(d)<1e-9){if(p<lo||p>hi)return false;}else{let ta=(lo-p)/d,tb=(hi-p)/d;if(ta>tb){const q=ta;ta=tb;tb=q;}t0=Math.max(t0,ta);t1=Math.min(t1,tb);if(t0>t1)return false;}}return true;}

  for(const c of COLL)if(test(c))return false;for(const c of LOSX)if(test(c))return false;if(G&&!G.room6&&test(R6BOX))return false;if(G&&!G.staffOpen&&test(STAFFBOX))return false;return true;}

  if(sceneT>1.2){if(save.checkpoint)btn(440,480,400,50,'RETRY FROM '+save.checkpoint.label,()=>resumeCheckpoint());btn(540,546,200,44,'MENU',()=>{G=null;setScene('menu');});}}
const ENDINGS={
  closed:{title:'CASE CLOSED',col:'#9fe0b0',body:['The hatch gives. You come up into the back room with your hands shaking and the camera still raised, and nothing follows you up the ladder.','At 6:00 AM the neon over the Starlite flickers twice and settles on a word it hasn\'t shown in sixty years: VACANCY.','Six doors stand open on the walkway. The cold has gone out of every room. Dolores, Harold, Ruth and Abel, Gus, Marisol, Leonard — six names in your notebook, each one crossed out gently.','Monarch\'s vans arrive by noon. They find a dead machine, an empty ledger, and nothing worth keeping.','In your pocket is the Room 7 key. You don\'t remember taking it with you. Site 2 is closed. Site 3 is "acquisition pending."']},
  open:{title:'CASE OPEN',col:'#e8c070',body:['You drive out with the sign buzzing NO VACANCY in the mirror.','Whatever is still checked in at the Starlite will be there tomorrow night, and the night after, for forty dollars a tour.','Brew trusted you with this. The case stays open.']},
  dawn:{title:'CHECKED IN',col:'#d84a3a',body:['6:00 AM. The sun comes up over Route 66, and you are still inside.','The Night Manager finds you at the desk, where he always finds the late ones. He turns the register around and holds out the pen.','You don\'t remember signing it. You remember the key he gives you: ROOM 7.']},
};
function drawEnding(){const c=ctx,e=ENDINGS[G.ending];c.fillStyle='#050406';c.fillRect(0,0,1280,720);txt(c,e.title,640,150,56,e.col,'center');
  let y=230;const n=Math.floor(sceneT*60);let used=0;for(const b of e.body){const s=b.slice(0,Math.max(0,n-used));used+=b.length;y=para(s,300,y,680,17,INK,25)+14;if(n<used)break;}
  if(G.ending==='open')txt(c,freedCount()+' of 6 guests laid to rest',640,y+20,14,DIM,'center');
  if(n>used+30){if(G.ending==='dawn'&&save.checkpoint)btn(440,580,400,46,'RETRY FROM '+save.checkpoint.label,()=>resumeCheckpoint());btn(540,640,200,44,'MENU',()=>{G=null;setScene('menu');});}
  else button(0,0,1280,720,()=>{sceneT=99;});}

/* ============================== MAIN ============================== */
let last=performance.now(),glOK=false,glErr='';
resize();
try{glOK=initGL();if(glOK){initGhostGL();initFX();initSparkle();buildWorld();setupInter();}}catch(e){glOK=false;glErr=String(e&&e.message||e);console.error(e);}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;sceneT+=dt;CLOUD.toast=Math.max(0,CLOUD.toast-dt);
  update(dt);
  if(glOK&&(scene==='menu'||scene==='play'||scene==='pause'||scene==='scare'))render3D(dt);
  else if(glOK){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,glc.width,glc.height);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,uic.width,uic.height);ctx.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);
  uiCur=[];
  if(!glOK){ctx.fillStyle='#000';ctx.fillRect(0,0,1280,720);txt(ctx,'WebGL is not available in this browser.',640,330,22,'#c66','center');txt(ctx,glErr.slice(0,100),640,370,12,'#777','center',false);}
  else switch(scene){
    case'menu':drawMenu();break;case'intro':drawIntro();break;
    case'play':drawHUD();if(G.fadeT>0){ctx.fillStyle=`rgba(0,0,0,${clamp(G.fadeT>1.2?(4.2-G.fadeT)/2:G.fadeT/1.2,0,1)})`;ctx.fillRect(0,0,1280,720);}if(G.phone)drawPhone();if(G.nb)drawNotebook();if(G.dialog)drawDialog();if(G.reader)drawReader();drawCursor();break;
    case'pause':drawPause();break;case'scare':drawScare();break;case'over':drawOver();break;case'ending':drawEnding();break;}
  uiPrev=uiCur;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg={sim:n=>{for(let i=0;i<n&&scene==='play';i++){sceneT+=0.05;update(0.05);}return scene;},G:()=>G,scene:()=>scene,set:s=>setScene(s),
  tp:(x,y,z,yaw,pitch)=>{Object.assign(G.p,{x,y,z,yaw:yaw||0,pitch:pitch||0,vx:0,vz:0});},give:k=>{G.got[k]=true;G.inv.push(k);},read:k=>{G.read[k]=true;},
  photo:()=>takePhoto(),warn:t=>startWarn(t||0.1),free:i=>freeSpirit(i),dialog:i=>openDialog(i),answer:(k,n)=>{G.dialog.item=k;answer(n);},hide:i=>enterHide(HIDES[i]),
  nm:()=>G.nm,inter:()=>G.interNear&&G.interNear.label(),use:()=>G.interNear&&G.interNear.act(),key:(c,v)=>{keys[c]=v;if(v)onKey(c);},new:()=>newCase(),begin:()=>beginShift(),kill:w=>killBy(w)};

function drawEMF(){const g=G,c=ctx,x=980,y=500,r=emfRead();panel(x,y,270,150,0.85);txt(c,'EMF READER · NIGHT MANAGER',x+16,y+18,11,DIM);
  const cols=['#3f6','#9f3','#fd2','#f80','#f22'];let n=0;
  if(r.d!=null)n=clamp(Math.ceil((30-r.d)/6),1,5);else if(r.warn)n=Math.floor(Math.random()*4);
  for(let i=0;i<5;i++){const on=i<n;c.fillStyle=on?cols[i]:'rgba(255,255,255,0.08)';if(on){c.shadowColor=cols[i];c.shadowBlur=14;}c.beginPath();c.arc(x+40+i*48,y+52,14,0,TAU);c.fill();c.shadowBlur=0;}
  let label='NO SIGNAL',col=DIM;
  if(r.d!=null){const dd=Math.max(1,Math.round(r.d*(1+(Math.random()-0.5)*0.08)));label='≈ '+dd+' m AWAY';col=r.d<6?(blink(150)?'#f44':'#a22'):r.d<14?'#f80':'#dc6';}
  else if(r.warn){label='SPIKING — HE\'S COMING';col=blink(200)?'#fd2':'#a80';}else if(r.other){label='FAINT — '+r.other;col='#9a9';}
  txt(c,label,x+135,y+100,20,col,'center');txt(c,'closer = faster clicks',x+135,y+130,11,DIM,'center',false);}
function saveOnLeave(){try{if(G&&(scene==='play'||scene==='pause')&&safeToSave())checkpoint();}catch(e){}}
window.addEventListener('pagehide',saveOnLeave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveOnLeave();});
