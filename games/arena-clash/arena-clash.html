function cycle(d){if(P&&!paused){setW(P,(P.wi+d+W.length)%W.length)}}
const cv=rd.domElement;let lock=false,cy=0,cp=.35,stopT=0,rb=null;
const DB={fwd:"KeyW",back:"KeyS",left:"KeyA",right:"KeyD",atk:"M0",heavy:"KeyF",blk:"M2",roll:"Space",lock:"KeyQ",wn:"BracketRight",wp:"BracketLeft"};
const NM={fwd:"Forward",back:"Back",left:"Left",right:"Right",atk:"Light attack",heavy:"Heavy attack",blk:"Block",roll:"Roll",lock:"Lock-on",wn:"Next weapon",wp:"Prev weapon"};
let B={...DB};try{Object.assign(B,JSON.parse(localStorage.kb||"{}"))}catch(e){}
const nm=c=>c[0]=="M"&&c.length==2?"Mouse"+(+c[1]+1):c.replace("Key","");
function kbui(){const d=$("kb");d.innerHTML="";for(const a in NM){const b=document.createElement("button");b.className="kbtn";b.textContent=NM[a]+": "+nm(B[a]);b.onclick=()=>{rb=a;b.textContent=NM[a]+": press…"};d.appendChild(b)}}
function press(c){
  if(rb){if(c!="Escape"){B[rb]=c;try{localStorage.kb=JSON.stringify(B)}catch(e){}}rb=null;kbui();return}
  K[c]=1;if(paused||!P||P.dead)return;
  if(c==B.atk)attack(0);if(c==B.heavy)attack(1);
  if(c==B.roll&&P.roll<=0&&P.at<0){const m=pmove();P.roll=.35;P.rdx=m[0]||-fw.x;P.rdz=m[1]||-fw.z}
  if(c==B.lock)lock=!lock;if(c==B.wn)cycle(1);if(c==B.wp)cycle(-1);
}
function pause(){if(paused||!P)return;paused=true;$("msg").textContent="Paused";$("rsm").style.display=P.dead?"none":"block";$("menu").style.display="flex";document.exitPointerLock&&document.exitPointerLock()}
addEventListener("keydown",e=>{if(!e.repeat)press(e.code);if(e.code=="Space")e.preventDefault();if(e.code=="Escape")pause()});
addEventListener("keyup",e=>K[e.code]=0);
addEventListener("mousedown",e=>{if(rb||document.pointerLockElement==cv)press("M"+e.button);else if(e.target==cv&&!paused)cv.requestPointerLock()});
addEventListener("mouseup",e=>K["M"+e.button]=0);
addEventListener("mousemove",e=>{if(document.pointerLockElement==cv&&!paused){cy-=e.movementX*.003;cp=Math.max(-.2,Math.min(1.2,cp+e.movementY*.003))}});
addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("pointerlockchange",()=>{if(!document.pointerLockElement)pause()});
function pmove(){
  const f=(K[B.fwd]?1:0)-(K[B.back]?1:0),r=(K[B.right]?1:0)-(K[B.left]?1:0);
  let x=fw.x*f-fw.z*r,z=fw.z*f+fw.x*r;const l=Math.hypot(x,z);return l?[x/l,z/l]:[0,0];
}
// menu
const ws=$("ws"),ms=$("ms");
function fill(q){ws.innerHTML="";W.forEach((w,i)=>{if(!q||w.n.toLowerCase().includes(q)){const o=document.createElement("option");o.value=i;o.textContent=w.n+" (dmg "+w.d+", reach "+w.r+")";ws.appendChild(o)}})}
fill("");MP.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=n;ms.appendChild(o)});
$("q").oninput=e=>fill(e.target.value.toLowerCase());$("go").onclick=start;kbui();
$("rsm").onclick=()=>{paused=false;$("menu").style.display="none";cv.requestPointerLock()};
// loop
let last=performance.now();
build(0);
function loop(t){
  requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1000);last=t;if(stopT>0){stopT-=dt;dt*=.05}
  if(P&&!paused){
    const live=E.filter(e=>!e.dead).sort((a,b)=>Math.hypot(a.x-P.x,a.z-P.z)-Math.hypot(b.x-P.x,b.z-P.z)),tg=live[0];
    const ad=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
    cy+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*2.2*dt;
    if(lock&&!tg)lock=false;
    if(lock)cy+=ad(Math.atan2(tg.x-P.x,tg.z-P.z),cy)*Math.min(1,dt*6);
    fw={x:Math.sin(cy),z:Math.cos(cy)};
    P.blk=!!K[B.blk]&&P.at<0&&!P.dead&&P.stun<=0;
    const m=P.dead?[0,0]:pmove();let want=null;
    if(lock)want=Math.atan2(tg.x-P.x,tg.z-P.z);
    else if(P.at>=0||P.blk){want=cy;const n=live.find(e=>Math.hypot(e.x-P.x,e.z-P.z)<4.5&&Math.abs(ad(Math.atan2(e.x-P.x,e.z-P.z),cy))<1);if(n)want=Math.atan2(n.x-P.x,n.z-P.z)}
    else if(m[0]||m[1])want=Math.atan2(m[0],m[1]);
    if(want!==null&&!P.dead&&P.roll<=0)P.yaw+=ad(want,P.yaw)*Math.min(1,dt*(P.at>=0?20:12));
    upd(P,dt,m[0],m[1],4.2);
    E.forEach(e=>ai(e,dt));
    if(nextT>0&&!E.some(e=>!e.dead)){nextT-=dt;if(nextT<=0){round++;spawnRound()}}
    if(P.dead&&P.dead>1.8)end();
    $("hp").style.width=(P.hp/P.mh*100)+"%";
    $("info").innerHTML="Round "+round+" · Kills "+kills+" · "+P.w.n+" · Enemies "+live.length+(lock?" · LOCK-ON":"");
    const cc=Math.cos(cp)*5.5;
    cam.position.lerp(new THREE.Vector3(P.x-fw.x*cc,1.6+Math.sin(cp)*5.5,P.z-fw.z*cc),.25);cam.lookAt(P.x+fw.x*1.5,1.5,P.z+fw.z*1.5);
  }else if(paused){const a=t/6000;cam.position.set(Math.cos(a)*R*.8,9,Math.sin(a)*R*.8);cam.lookAt(0,1,0)}
  for(let i=sp.length-1;i>=0;i--){const m=sp[i];m.l-=dt;m.v.y-=12*dt;m.position.addScaledVector(m.v,dt);if(m.l<=0){sc.remove(m);sp.splice(i,1)}}
  rd.render(sc,cam);
}
requestAnimationFrame(loop);
</script></body></html>
