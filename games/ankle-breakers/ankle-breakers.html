function startGun(w){
  const P=w.P;P.x=0;P.z=18;P.down=0;P.team=0;P.imm=0;
  for(let i=0;i<5;i++){const c=spawnChaser(w,['rusher','reader','sprinter','pack','rusher'][i]);c.team=c.id+1;c.alive=true;c.speed=19+w.rnd()*3;c.lv=0;c.down=0;c.cd=1+w.rnd();c.sdir=1;ringPlace(w,c,i,5,45,90);}
  w.gun={lv:0,clock:200,kills:0,deaths:0,fireCd:0};
  ev(w,'gunstart',{});
}
function gunHit(w,sh,e){
  const S=w.gun;
  if(e===w.P){e.down=2;S.deaths++;ev(w,'laserhit',{x:e.x,z:e.z,you:true});}
  else{e.down=2;e.state='calm';e.vx=e.vz=0;ev(w,'laserhit',{x:e.x,z:e.z,you:false});}
  if(sh===w.P){
    S.kills++;S.lv++;w.score+=300;ev(w,'gunlevel',{lv:S.lv,name:S.lv<GUNS.length?GUNS[S.lv].n:'DONE'});
    if(S.lv>=GUNS.length&&w.state==='play'){w.won=true;w.score+=1500;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});}
  }else{
    sh.lv++;
    if(sh.lv>=GUNS.length&&w.state==='play'){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});}
  }
}
function gunUpdate(w,dt,inp){
  const S=w.gun,P=w.P;S.clock-=dt;S.fireCd=Math.max(0,S.fireCd-dt);P.pitch=inp&&inp.pitch!==undefined?inp.pitch:0;
  if(P.down>0){P.down-=dt;if(P.down<=0){P.down=0;P.inv=1;}}
  const wp=GUNS[Math.min(S.lv,GUNS.length-1)];
  if(inp&&(inp.use||inp.taunt)&&S.fireCd<=0&&!(P.down>0)&&w.state==='play'){
    S.fireCd=wp.cd;const hs=fireBeams(w,P,true,wp,0);
    for(const h of hs){if(!(h.e.down>0)){gunHit(w,P,h.e);if(w.state!=='play')return;}}
  }
  for(const c of w.C){
    if(c.down>0){c.down-=dt;c.state='calm';c.vx=c.vz=0;if(c.down<=0){c.down=0;c.state='chase';}continue;}
    c.state='chase';
    const foes=(P.down>0?[]:[P]).concat(w.C.filter(o=>o!==c&&!(o.down>0)));
    const tg=aiFight(w,c,dt,foes,GUNS[Math.min(c.lv,GUNS.length-1)],(cc)=>{
      const hs=fireBeams(w,cc,false,GUNS[Math.min(cc.lv,GUNS.length-1)],cc.team);
      for(const h of hs){if(!(h.e.down>0)){gunHit(w,cc,h.e);break;}}
    });
    if(w.state!=='play')return;
    if(!tg){let nt=null,nd=1e9;for(const e of foes){const d=Math.hypot(e.x-c.x,e.z-c.z);if(d<nd){nd=d;nt=e;}}if(nt)steer(w,c,nt.x,nt.z,dt,c.speed);}
  }
  if(w.state==='play'&&S.clock<=0){const top=Math.max(0,...w.C.map(c=>c.lv));w.won=S.lv>=top&&S.lv>0;w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});}
}
/* ----- zombie survival ----- */
function startZomb(w){
  const P=w.P;P.x=0;P.z=18;P.hp=3;P.team=0;P.down=0;
  w.zb={wave:0,toSpawn:0,spawnT:0,between:3,kills:0,hits:0,maxWave:6,fireCd:0,spawned:0};
  ev(w,'zstart',{});
}
function zombSpawn(w){
  const S=w.zb,c=spawnChaser(w,'rusher');ringPlace(w,c,S.spawned++,16,55,95);
  const tank=S.wave>=2&&S.spawned%5===0,fast=S.wave>=3&&S.spawned%4===0;
  c.alive=true;c.team=1;c.zt=tank?'tank':fast?'fast':'norm';c.hpz=tank?3:1;
  c.speed=(tank?9.5:fast?20:12)+Math.min(5,S.wave*.7)+w.rnd()*2;c.mk=tank?0xffd23f:fast?0xff4d4d:0x9be564;
}
function zombUpdate(w,dt,inp){
  const S=w.zb,P=w.P;S.fireCd=Math.max(0,S.fireCd-dt);P.pitch=inp&&inp.pitch!==undefined?inp.pitch:0;
  const alive=w.C.filter(c=>c.alive!==false).length;
  if(S.toSpawn<=0&&alive===0&&w.state==='play'){
    S.between-=dt;
    if(S.between<=0){
      S.wave++;
      if(S.wave>S.maxWave){w.won=true;w.score+=2000+P.hp*500;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});return;}
      S.toSpawn=5+S.wave*4;S.between=4;S.spawnT=0;ev(w,'zwave',{wave:S.wave,n:S.toSpawn});
    }
  }
  if(S.toSpawn>0){S.spawnT-=dt;if(S.spawnT<=0){S.spawnT=.4;S.toSpawn--;zombSpawn(w);}}
  if(inp&&(inp.use||inp.taunt)&&S.fireCd<=0&&w.state==='play'){
    S.fireCd=.22;
    const hs=fireBeams(w,P,true,{cd:.22,pel:1,jit:.015},0);
    for(const h of hs){
      const z=h.e;if(z.alive===false)continue;
      z.hpz--;ev(w,'laserhit',{x:z.x,z:z.z,you:false});
      if(z.hpz<=0){
        z.alive=false;z.dead=true;S.kills++;
        const head=(h.y-(z.y||0))>1.5;
        const tot=award(w,'zkill',[[head?'Headshot':'Zombie',head?250:100]].concat(z.zt==='tank'?[['Tank',200]]:[]),z.x,z.z,{});
        ev(w,'zkill',{x:z.x,z:z.z,head,total:tot});
      }
    }
  }
  for(const c of w.C){
    if(c.alive===false)continue;
    if(c.state==='tumble'){c.t+=dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.1,dt);c.vz*=Math.pow(.1,dt);if(c.t>1.2)c.state='chase';continue;}
    c.state='chase';
    const lp=leadPt(w,c,P,c.speed);
    if(c.zt==='fast')botDash(w,c,dt,lp[0],lp[1],6,14);
    steer(w,c,lp[0],lp[1],dt,c.speed);
    const d=Math.hypot(P.x-c.x,P.z-c.z);
    if(d<1.5&&P.inv<=0&&P.y<1.2&&w.state==='play'){
      P.hp--;P.inv=1.8;S.hits++;w.combo=0;const l=d||1;P.vx+=(P.x-c.x)/l*16;P.vz+=(P.z-c.z)/l*16;
      c.state='tumble';c.t=0;c.vx=(c.x-P.x)/l*8;c.vz=(c.z-P.z)/l*8;
      ev(w,'zhit',{x:P.x,z:P.z,hp:P.hp});
      if(P.hp<=0){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});return;}
    }
  }
  w.C=w.C.filter(c=>!c.dead);
}
/* ----- battle royale ----- */
function startBr(w){
  const P=w.P;P.x=0;P.z=18;P.hp=3;P.team=0;P.down=0;
  for(let i=0;i<11;i++){const c=spawnChaser(w,['rusher','reader','sprinter','pack'][i%4]);c.team=c.id+1;c.alive=true;c.speed=19+w.rnd()*3;c.hp=3;c.cd=1+w.rnd()*2;c.sdir=1;c.zT=0;c.wpT=0;
    const a=i/11*Math.PI*2+w.rnd(),r=60+w.rnd()*130;c.x=Math.cos(a)*r;c.z=Math.sin(a)*r;const q=freeSpot(w.M,c.x,c.z);c.x=q[0];c.z=q[1];c.vx=c.vz=0;}
  const ca=w.rnd()*Math.PI*2,cr=w.rnd()*50;
  w.br={R:230,cx:Math.cos(ca)*cr,cz:Math.sin(ca)*cr,t:0,left:11,kills:0,fireCd:0,zT:0,place:12};
  ev(w,'brstart',{});
}
function brDamage(w,sh,e){
  const S=w.br;
  if(e===w.P){
    e.hp--;e.inv=.5;ev(w,'laserhit',{x:e.x,z:e.z,you:true});
    if(e.hp<=0&&w.state==='play'){S.place=S.left+1;w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});}
  }else{
    e.hp--;ev(w,'laserhit',{x:e.x,z:e.z,you:false});
    if(e.hp<=0&&e.alive!==false){
      e.alive=false;e.dead=true;S.left--;
      if(sh===w.P){S.kills++;w.score+=500;}
      ev(w,'brout',{x:e.x,z:e.z,left:S.left,you:sh===w.P});
    }
  }
}
function brUpdate(w,dt,inp){
  const S=w.br,P=w.P;S.t+=dt;S.fireCd=Math.max(0,S.fireCd-dt);P.pitch=inp&&inp.pitch!==undefined?inp.pitch:0;
  S.R=Math.max(14,230-S.t*1.45);
  const wp={cd:.5,pel:1,spr:0,jit:0,ac:1};
  if(inp&&(inp.use||inp.taunt)&&S.fireCd<=0&&w.state==='play'){
    S.fireCd=.45;const hs=fireBeams(w,P,true,wp,0);
    for(const h of hs){brDamage(w,P,h.e);if(w.state!=='play')return;}
  }
  // zone damage
  const outP=Math.hypot(P.x-S.cx,P.z-S.cz)>S.R;
  if(outP){S.zT+=dt;if(S.zT>=2.2){S.zT=0;P.hp--;ev(w,'zonehit',{x:P.x,z:P.z});if(P.hp<=0&&w.state==='play'){S.place=S.left+1;w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});return;}}}else S.zT=0;
  for(const c of w.C){
    if(c.alive===false)continue;
    c.state='chase';
    const out=Math.hypot(c.x-S.cx,c.z-S.cz)>S.R;
    if(out){c.zT+=dt;if(c.zT>=2.2){c.zT=0;brDamage(w,null,c);if(c.alive===false)continue;}}else c.zT=0;
    const foes=[P].concat(w.C.filter(o=>o!==c&&o.alive!==false));
    const tg=aiFight(w,c,dt,foes,wp,(cc)=>{
      const hs=fireBeams(w,cc,false,wp,cc.team);
      for(const h of hs){brDamage(w,cc,h.e);break;}
    });
    if(w.state!=='play')return;
    if(!tg){
      if(out||Math.hypot(c.x-S.cx,c.z-S.cz)>S.R*.75){steer(w,c,S.cx,S.cz,dt,c.speed);}
      else{c.wpT-=dt;if(c.wpT<=0||c.wx===undefined){c.wpT=4+w.rnd()*4;const a=w.rnd()*Math.PI*2,r=w.rnd()*S.R*.6;c.wx=S.cx+Math.cos(a)*r;c.wz=S.cz+Math.sin(a)*r;}steer(w,c,c.wx,c.wz,dt,c.speed*.8);}
    }
  }
  w.C=w.C.filter(c=>!c.dead);
  if(w.state==='play'){w.score+=dt*5;if(S.left<=0){S.place=1;w.won=true;w.score+=3000;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});}}
}
/* ----- target range ----- */
function startRange(w){
  const P=w.P;P.x=0;P.z=18;P.team=0;
  for(let i=0;i<7;i++){
    const c=spawnChaser(w,'reader');ringPlace(w,c,i,7,22,85);c.alive=true;c.team=1;c.mk=0xff4d4d;c.sp=5+w.rnd()*7;c.ph=w.rnd()*6;c.pd=w.rnd()*Math.PI;c.bx=c.x;c.bz=c.z;c.amp=8+w.rnd()*10;c.down=0;
  }
  w.rg={clock:60,hits:0,shots:0,heads:0,fireCd:0,best:0};
  ev(w,'rgstart',{});
}
function rangeUpdate(w,dt,inp){
  const S=w.rg,P=w.P;S.clock-=dt;S.fireCd=Math.max(0,S.fireCd-dt);P.pitch=inp&&inp.pitch!==undefined?inp.pitch:0;
  for(const c of w.C){
    if(c.down>0){c.down-=dt;c.mk=0x555a66;if(c.down<=0){c.mk=0xff4d4d;}continue;}
    const t=w.t*c.sp/ c.amp+c.ph;
    const nx=c.bx+Math.cos(c.pd)*Math.sin(t)*c.amp,nz=c.bz+Math.sin(c.pd)*Math.sin(t)*c.amp;
    c.vx=(nx-c.x)/Math.max(dt,1e-3);c.vz=(nz-c.z)/Math.max(dt,1e-3);
    if(Math.hypot(c.vx,c.vz)>40){c.vx=c.vz=0;}
    c.x=nx;c.z=nz;c.fx=P.x-c.x;c.fz=P.z-c.z;const l=Math.hypot(c.fx,c.fz)||1;c.fx/=l;c.fz/=l;
    pushOut(w.M,c,CR,-1e9,false);
  }
  if(inp&&(inp.use||inp.taunt)&&S.fireCd<=0&&w.state==='play'){
    S.fireCd=.35;S.shots++;
    const hs=fireBeams(w,P,true,{cd:.35,pel:1,jit:0},0);
    if(hs.length){
      const h=hs[0],c=h.e,head=(h.y-(c.y||0))>1.5;
      S.hits++;if(head)S.heads++;
      const items=[[head?'Headshot':'Hit',head?300:100]];
      if(h.t>70)items.push(['Sniper',400]);else if(h.t>40)items.push(['Long shot',200]);
      if(P.spd>18)items.push(['On the run',150]);
      if(!P.ground)items.push(['Airborne',150]);
      if(Math.hypot(c.vx,c.vz)>7)items.push(['Moving target',100]);
      const tot=award(w,'rghit',items,c.x,c.z,{});
      if(h.t>S.best)S.best=h.t;
      c.down=1.6;ev(w,'rghit',{x:c.x,z:c.z,head,total:tot,d:Math.round(h.t)});
    }else{w.combo=0;ev(w,'rgmiss',{});}
  }
  if(w.state==='play'&&S.clock<=0){w.won=w.score>=15000;w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});}
}
/* ----- seek (role swap) ----- */
function startSeek(w){
  const tall=w.M.boxes.filter(o=>o.h>2.4&&o.kind!=='stair');
  const P=w.P;
  for(let i=0;i<5;i++){
    const c=spawnChaser(w,['rusher','reader','sprinter','pack','rusher'][i]);
    const o=tall[Math.floor(w.rnd()*tall.length)];
    const sx=w.rnd()<.5?-1:1,sz=w.rnd()<.5?-1:1;
    let x=o.x+sx*(o.hx+2.2),z=o.z+sz*(o.hz+2.2);
    if(contact(w.M,x,z,CR+.4,-1e9)||Math.hypot(x-P.x,z-P.z)<60){const q=freeSpot(w.M,x,z);x=q[0];z=q[1];}
    c.x=x;c.z=z;c.alive=true;c.speed=24;c.sch=w.rnd()*.3;c.spot=false;c.vx=c.vz=0;c.state='calm';
  }
  w.seek={clock:100,found:0,total:5};
  ev(w,'seekmode',{});
}
function seekUpdate(w,dt){
  const S=w.seek,P=w.P;
  S.clock-=dt;
  for(const c of w.C){
    if(c.state==='quit'){c.y+=c.vy*dt;c.t+=dt;if(c.t>1.5)c.dead=true;continue;}
    if(c.alive===false)continue;
    const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz)||1;
    c.sch-=dt;
    if(c.sch<=0){c.sch=.2;const v=d<40&&los(w.M,P.x,P.z,c.x,c.z);if(v&&!c.spot){ev(w,'hiderfled',{id:c.id,x:c.x,z:c.z});}c.spot=v||(c.spot&&d<60);}
    if(c.spot){c.state='flee';const ft=fleeTarget(w,c,P.x,P.z,dt);botDash(w,c,dt,ft[0],ft[1],1,99);steer(w,c,ft[0],ft[1],dt,c.speed);}
    else{c.state='calm';c.vx=c.vz=0;}
    if(d<2.4){
      c.alive=false;c.state='quit';c.t=0;c.vy=12;c.vx=c.vz=0;S.found++;
      const b=400+Math.round(S.clock*4);w.score+=b;
      ev(w,'hiderfound',{id:c.id,name:c.name,x:c.x,z:c.z,n:S.found,bonus:b});
    }
  }
  w.C=w.C.filter(c=>!c.dead);
  if(w.state==='play'&&(S.found>=S.total||S.clock<=0)){
    w.won=S.found>=S.total;if(w.won)w.score+=800;
    w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});
  }
}

/* ----- hide and seek ----- */
function los(M,x0,z0,x1,z1){
  const dx=x1-x0,dz=z1-z0,d=Math.hypot(dx,dz),n=Math.max(1,Math.ceil(d/1.5));
  for(let i=1;i<n;i++){
    const x=x0+dx*i/n,z=z0+dz*i/n,lst=M.grid[cellIdx(x)*GN+cellIdx(z)];
    for(let k=0;k<lst.length;k++){
      const o=lst[k];if(o.h<2.4)continue;
      if(o.t===1){if(Math.hypot(x-o.x,z-o.z)<o.r)return false;}
      else if(Math.abs(x-o.x)<o.hx&&Math.abs(z-o.z)<o.hz)return false;
    }
  }
  return true;
}
function startHide(w){
  for(let i=0;i<4;i++){
    const c=spawnChaser(w,'reader');c.alive=true;c.speed=26;c.sch=w.rnd()*.3;c.lost=99;c.lx=0;c.lz=0;c.wx=c.x;c.wz=c.z;c.wpT=0;c.vis=false;
  }
  w.hide={phase:'hide',t:14,seen:0,quiet:0,quietPaid:false};
  ev(w,'hidestart',{});
}
function hideUpdate(w,dt){
  const H=w.hide,P=w.P;
  H.t-=dt;
  if(H.phase==='hide'){
    for(const c of w.C){c.vx=c.vz=0;c.state='calm';}
    if(H.t<=0){H.phase='seek';H.t=100;ev(w,'seekstart',{});}
    return;
  }
  w.score+=dt*8;
  let seen=0;
  for(const c of w.C){
    c.sch-=dt;
    if(c.sch<=0){
      c.sch=.18+w.rnd()*.08;
      const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz)||1;
      const front=(c.fx*dx+c.fz*dz)/d>-.25;
      c.vis=d<90&&(d<16||front)&&los(w.M,c.x,c.z,P.x,P.z);
      if(c.vis&&c.lost>2){ev(w,'spotted',{id:c.id,x:c.x,z:c.z});for(const o of w.C)if(o!==c){o.lx=P.x;o.lz=P.z;o.lost=Math.min(o.lost,1);}}
    }
    if(c.vis){
      seen++;c.lost=0;c.lx=P.x;c.lz=P.z;c.state='chase';c.tier=1;
      const lead=.15;
      botDash(w,c,dt,P.x,P.z,5,13);
      steer(w,c,P.x+P.vx*lead,P.z+P.vz*lead,dt,c.speed);
      if(Math.hypot(P.x-c.x,P.z-c.z)<1.9&&P.dashT<=0&&P.y<1.2){
        w.won=false;w.state='dead';w.deadT=0;ev(w,'caught',{name:c.name});ev(w,'dead',{});return;
      }
    }else{
      c.lost+=dt;c.tier=0;
      if(c.lost<8&&(c.lx||c.lz)){
        c.state='chase';steer(w,c,c.lx,c.lz,dt,c.speed*.9);
        if(Math.hypot(c.lx-c.x,c.lz-c.z)<4){c.lx=c.x+(w.rnd()-.5)*50;c.lz=c.z+(w.rnd()-.5)*50;}
      }else{
        c.state='calm';c.wpT-=dt;
        if(c.wpT<=0||Math.hypot(c.wx-c.x,c.wz-c.z)<4){c.wpT=6;c.wx=Math.max(-HALF+10,Math.min(HALF-10,c.x+(w.rnd()-.5)*160));c.wz=Math.max(-HALF+10,Math.min(HALF-10,c.z+(w.rnd()-.5)*160));}
        steer(w,c,c.wx,c.wz,dt,c.speed*.55);
      }
    }
  }
  H.seen=seen;
  if(seen===0){H.quiet+=dt;if(H.quiet>6&&!H.quietPaid){H.quietPaid=true;w.score+=400;ev(w,'lostthem',{});}}
  else{H.quiet=0;H.quietPaid=false;}
  if(H.t<=0){w.won=true;w.score+=1000;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});}
}

/* ----- parkour ----- */
function genParkour(seed){
  const r=mulberry((seed||3)+11),boxes=[],plats=[];
  const N=22;let x=0,z=268,h=.8;
  for(let i=0;i<N;i++){
    const size=i===0?14:i===N-1?18:6+r()*3,hx=size/2,hz=size/2;
    plats.push({i,x,z,hx,hz,h});
    boxes.push({x,z,hx,hz,h,kind:'plat',tint:i%5===0?4:i%4});
    const nhz=(i===N-2?18:7)/2,gap=5+r()*7+Math.min(4,i*.25);
    z-=hz+gap+nhz;
    x=Math.max(-100,Math.min(100,x+(r()-.5)*40));
    h=Math.max(.8,Math.min(22,h+(r()*2.8-1.1)));
  }
  const M={boxes,cyls:[],pads:[],cells:[],grid:null,plats};
  const g=new Array(GN*GN);for(let i=0;i<g.length;i++)g[i]=[];

/* ----- uno no mercy ----- */
const UCOL=['R','Y','G','B'],UDRAW={'+2':2,'+4':4,'w+rev4':4,'w+6':6,'w+10':10};
const ULAB={skip:'Skip',skipall:'Skip All',rev:'Reverse',discard:'Discard All','w+rev4':'Wild Rev +4','w+6':'Wild +6','w+10':'Wild +10',roul:'Roulette'};
function unoLabel(c){return ULAB[c.v]||c.v;}
function unoShuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function unoNew(seed){
  const r=mulberry(seed||1),deck=[];
  for(const c of UCOL)for(let k=0;k<2;k++){for(let d=0;d<=9;d++)deck.push({c,v:String(d)});['+2','+4','skip','skipall','rev','discard'].forEach(v=>deck.push({c,v}));}
  for(let k=0;k<4;k++)['w+rev4','w+6','w+10','roul'].forEach(v=>deck.push({c:'W',v}));
  unoShuffle(deck,r);
  const g={r,deck,disc:[],hands:[],names:['You','Big Gary','Brenda','Coach Dale'],cur:0,dir:1,color:'R',top:null,pend:0,pendMin:0,alive:[true,true,true,true],log:[],winner:null,roul:null};
  for(let i=0;i<4;i++)g.hands.push(deck.splice(0,7));
  let t;for(;;){t=deck.shift();if(t.c!=='W'&&!isNaN(+t.v))break;deck.push(t);}
  g.disc.push(t);g.top=t;g.color=t.c;
  return g;
}
function unoDrawOne(g){
  if(!g.deck.length){if(g.disc.length<2)return null;const top=g.disc.pop();g.deck=unoShuffle(g.disc,g.r);g.disc=[top];}
  return g.deck.shift();
}
function unoCan(g,card){
  if(g.pend>0)return UDRAW[card.v]!==undefined&&UDRAW[card.v]>=g.pendMin;
  return card.c==='W'||card.c===g.color||card.v===g.top.v;
}
function unoAliveN(g){return g.alive.filter(Boolean).length;}
function unoNext(g,from,steps){let i=from;for(let s=0;s<(steps||1);s++){do{i=(i+g.dir+4)%4;}while(!g.alive[i]);}return i;}
function unoElim(g,p){
  if(g.hands[p].length>=25&&g.alive[p]){g.alive[p]=false;g.deck.push(...g.hands[p]);g.hands[p]=[];g.log.push(g.names[p]+' hit 25 cards: ELIMINATED');return true;}
  return false;
}
function unoCheck(g){
  if(g.winner===null&&unoAliveN(g)===1)g.winner=g.alive.indexOf(true);
}
function unoTakeDraw(g,p){
  if(g.pend>0){
    const n=g.pend;
    for(let i=0;i<n;i++){const c=unoDrawOne(g);if(!c)break;g.hands[p].push(c);if(g.hands[p].length>=25)break;}
    g.log.push(g.names[p]+' drew '+n);g.pend=0;g.pendMin=0;unoElim(g,p);g.cur=unoNext(g,p,1);
  }else{
    let k=0,ok=false;
    for(;;){const c=unoDrawOne(g);if(!c)break;g.hands[p].push(c);k++;if(unoCan(g,c)){ok=true;break;}if(g.hands[p].length>=25)break;}
    g.log.push(g.names[p]+' drew '+k);
    if(unoElim(g,p)||!ok)g.cur=unoNext(g,p,1);
  }
  unoCheck(g);
}
function unoPlay(g,p,idx,opt){
  opt=opt||{};
  const hand=g.hands[p],card=hand[idx];
  if(!card||!unoCan(g,card))return false;
  hand.splice(idx,1);g.disc.push(card);g.top=card;
  g.color=card.c==='W'?(opt.color||'R'):card.c;
  g.log.push(g.names[p]+' played '+(card.c==='W'?'':card.c+' ')+unoLabel(card)+(card.c==='W'?' ('+g.color+')':''));
  let skip=0;
  if(UDRAW[card.v]){g.pend+=UDRAW[card.v];g.pendMin=UDRAW[card.v];}
  if(card.v==='w+rev4'||card.v==='rev'){g.dir=-g.dir;if(unoAliveN(g)===2)skip=1;}
  if(card.v==='skip')skip=1;
  if(card.v==='skipall')skip=unoAliveN(g)-1;
  if(card.v==='discard'){for(let i=hand.length-1;i>=0;i--)if(hand[i].c===card.c){g.disc.push(hand[i]);hand.splice(i,1);}}
  if(card.v==='roul')g.roul=g.color;
  if(card.v==='7'&&opt.target!==undefined&&g.alive[opt.target]&&opt.target!==p){
    const t=g.hands[p];g.hands[p]=g.hands[opt.target];g.hands[opt.target]=t;g.log.push(g.names[p]+' swapped hands with '+g.names[opt.target]);
  }
  if(card.v==='0'){
    const idxs=[];let i=p;do{idxs.push(i);i=unoNext(g,i,1);}while(i!==p);
    const old=idxs.map(k=>g.hands[k]);
    idxs.forEach((k,j)=>{g.hands[idxs[(j+1)%idxs.length]]=old[j];});
    g.log.push('Everyone passed their hand');
  }
  if(g.hands[p].length===0){g.winner=p;return true;}
  g.cur=unoNext(g,p,1+skip);
  if(g.roul){
    const q=g.cur;let n=0;
    for(;;){const c=unoDrawOne(g);if(!c)break;g.hands[q].push(c);n++;if(c.c===g.roul||g.hands[q].length>=25)break;}
    g.log.push(g.names[q]+' drew '+n+' for roulette');g.roul=null;unoElim(g,q);g.cur=unoNext(g,q,1);
  }
  unoCheck(g);
  return true;
}
function unoBot(g){
  const p=g.cur,hand=g.hands[p];
  const ok=[];hand.forEach((c,i)=>{if(unoCan(g,c))ok.push(i);});
  if(!ok.length){unoTakeDraw(g,p);return;}
  const counts={R:0,Y:0,G:0,B:0};hand.forEach(c=>{if(c.c!=='W')counts[c.c]++;});
  const opp=g.hands.filter((h,i)=>i!==p&&g.alive[i]).map(h=>h.length);
  const minOpp=Math.min.apply(null,opp);
  let best=ok[0],bs=-99;
  for(const i of ok){
    const c=hand[i];let s=1+g.r()*.5;
    if(UDRAW[c.v])s+=minOpp<=3?4:1.5;
    if(c.v==='skip'||c.v==='skipall'||c.v==='rev')s+=1.5;
    if(c.v==='discard')s+=1.5+counts[c.c]*.4;
    if(c.c==='W')s-=1.2;else s+=counts[c.c]*.15;
    if(s>bs){bs=s;best=i;}
  }
  const c=hand[best];
  let col,target;
  if(c.c==='W')col=UCOL.slice().sort((a,b)=>counts[b]-counts[a])[0];
  if(c.v==='7'){let bt,bl=99;g.hands.forEach((h,i)=>{if(i!==p&&g.alive[i]&&h.length<bl){bl=h.length;bt=i;}});if(bl<hand.length-1)target=bt;}
  unoPlay(g,p,best,{color:col,target});
}

/* ----- basketball no mercy ----- */
const HOOP=[{x:0,z:-52},{x:0,z:52}],BG=22;
function startHoops(w){
  [[-14,26,0],[14,26,0],[-16,-28,1],[0,-32,1],[16,-28,1]].forEach(s=>{
    const c=spawnChaser(w,s[2]?'rusher':'reader');
    c.x=s[0];c.z=s[1];c.team=s[2];c.alive=true;c.speed=20+w.rnd()*3;c.stun=0;c.stunSet=false;c.shoveCd=0;c.shotT=0;
  });
  w.P.x=0;w.P.z=28;w.P.team=0;w.P.imm=0;
  w.ball={x:22,y:1,z:10,vx:0,vy:0,vz:0,h:null,noPick:0,team:0,shooter:null,from:0};
  w.hoops={s:[0,0],clock:150,to:21};
  ev(w,'hoopstart',{});
}
function dropBall(w,e,hard){
  const b=w.ball;
  b.h=null;b.x=e.x;b.y=1.2;b.z=e.z;b.vx=(w.rnd()-.5)*8;b.vz=(w.rnd()-.5)*8;b.vy=hard?7:5;b.noPick=w.t+.45;
  ev(w,'steal',{x:e.x,z:e.z});
}
function shoot(w,e,isP){
  const b=w.ball,team=isP?0:e.team,h=HOOP[team];
  const dx=h.x-e.x,dz=h.z-e.z,d=Math.hypot(dx,dz)||1;
  let sig=.1+d*.011;
  for(const o of w.C){if(o!==e&&o.team!==team&&o.alive!==false&&Math.hypot(o.x-e.x,o.z-e.z)<3.2){sig+=.45;break;}}
  if(isP){
    const fx=-Math.sin(e.yaw),fz=-Math.cos(e.yaw),dot=(fx*dx+fz*dz)/d;
    sig*=1+Math.max(0,1-dot)*1.5;if(!e.ground)sig*=.8;
  }else sig*=1.1;
  const T=.8+d*.02,tx=h.x+(w.rnd()-.5)*2*sig,tz=h.z+(w.rnd()-.5)*2*sig;
  b.x=e.x;b.y=1.9+(e.y||0);b.z=e.z;
  b.vx=(tx-b.x)/T;b.vz=(tz-b.z)/T;b.vy=(3.05-b.y+.5*BG*T*T)/T;
  b.h=null;b.team=team;b.shooter=isP?'p':e.id;b.noPick=w.t+.6;b.from=d;
  ev(w,'shoot',{x:e.x,z:e.z,by:b.shooter,d});
}
function hoopsUpdate(w,dt,inp){
  const P=w.P,b=w.ball,H=w.hoops;
  H.clock-=dt;
  for(const c of w.C){
    if(c.alive===false)continue;
    c.shoveCd=Math.max(0,c.shoveCd-dt);
    if(c.state==='tumble'){
      if(!c.stunSet){c.stunSet=true;c.stun=1.1;c.t=0;if(b.h===c.id)dropBall(w,c,true);}
      c.t+=dt;c.stun-=dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.1,dt);c.vz*=Math.pow(.1,dt);pushOut(w.M,c,CR,-1e9,false);
      if(c.stun<=0){c.state='chase';c.stunSet=false;c.t=0;}
      continue;
    }
    c.state='chase';
    const atk=HOOP[c.team];
    if(b.h===c.id){
      const d=Math.hypot(atk.x-c.x,atk.z-c.z);
      if(d>15)steer(w,c,atk.x,atk.z,dt,c.speed);
      else{c.shotT+=dt;c.vx=c.vz=0;c.fx=(atk.x-c.x)/d;c.fz=(atk.z-c.z)/d;if(c.shotT>.55){c.shotT=0;shoot(w,c,false);}}
    }else if(b.h===null){
      botDash(w,c,dt,b.x,b.z,6,16);
      steer(w,c,b.x,b.z,dt,c.speed);
    }else{
      const hd=b.h==='p'?P:w.C.find(o=>o.id===b.h);
      if(!hd){b.h=null;continue;}
      const ht=b.h==='p'?0:hd.team;
      if(ht===c.team){
        steer(w,c,atk.x+(c.id%3-1)*10,atk.z-Math.sign(atk.z)*12,dt,c.speed*.7);
      }else{
        steer(w,c,hd.x,hd.z,dt,c.speed);
        const d=Math.hypot(hd.x-c.x,hd.z-c.z);
        if(d<1.7&&c.shoveCd<=0){
          c.shoveCd=2.5;
          if(w.rnd()<.6){
            if(b.h==='p'){const l=d||1;P.vx+=(P.x-c.x)/l*16;P.vz+=(P.z-c.z)/l*16;dropBall(w,P);}
            else{hd.state='tumble';hd.vx=(hd.x-c.x)*6;hd.vz=(hd.z-c.z)*6;}
          }
        }
      }
    }
  }
  if(b.h==='p'&&inp&&inp.taunt)shoot(w,P,true);
  // ball
  if(b.h!==null){
    const e=b.h==='p'?P:w.C.find(o=>o.id===b.h);
    if(!e)b.h=null;
    else{const fx=e.fx!==undefined?e.fx:-Math.sin(e.yaw),fz=e.fz!==undefined?e.fz:-Math.cos(e.yaw);b.x=e.x+fx*.5;b.z=e.z+fz*.5;b.y=1.0+Math.abs(Math.sin(w.t*9))*.4+(e.y||0);b.vx=b.vy=b.vz=0;}
  }
  if(b.h===null){
    const py=b.y;
    b.vy-=BG*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    if(b.y<.3){b.y=.3;b.vy=Math.abs(b.vy)<2.5?0:-b.vy*.6;b.vx*=.88;b.vz*=.88;}
    b.x=Math.max(-HALF+1,Math.min(HALF-1,b.x));b.z=Math.max(-HALF+1,Math.min(HALF-1,b.z));
    for(let i=0;i<2;i++){
      const h=HOOP[i];
      if(py>3.05&&b.y<=3.05&&b.vy<0){
        const d=Math.hypot(b.x-h.x,b.z-h.z);
        if(d<.55&&b.team===i&&b.shooter){
          const pts=b.from>22?3:2;
          H.s[i]+=pts;
          ev(w,'basket',{team:i,pts,x:h.x,z:h.z,by:b.shooter,far:b.from>22});
          if(b.shooter==='p'){w.score+=pts*250+(b.from>22?250:0);w.stats.tags++;}
          const pool=w.C.filter(o=>o.alive!==false&&o.team===1-i);
          b.shooter=null;
          if(pool.length)b.h=pool[Math.floor(w.rnd()*pool.length)].id;
        }else if(d<.95){
          b.vy=Math.abs(b.vy)*.5;b.vx=(b.x-h.x)*6;b.vz=(b.z-h.z)*6;ev(w,'rim',{x:h.x,z:h.z});
        }
      }
    }
    if(b.h===null&&w.t>b.noPick&&b.y<2.4&&b.vy<3){
      let best=null,bd=2.1;
      const dP=Math.hypot(P.x-b.x,P.z-b.z);if(dP<bd){bd=dP;best='p';}
      for(const c of w.C){if(c.alive===false||c.state==='tumble')continue;const d=Math.hypot(c.x-b.x,c.z-b.z);if(d<bd){bd=d;best=c.id;}}
      if(best!==null){
        b.h=best;b.team=best==='p'?0:w.C.find(o=>o.id===best).team;b.shooter=null;
        ev(w,'pickup',{by:best});
      }
    }
  }
  if(w.state==='play'&&(H.clock<=0||H.s[0]>=H.to||H.s[1]>=H.to)){
    w.won=H.s[0]>H.s[1];w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});
  }
}

function captionFor(ev){
  const n=ev.name||'Somebody',L=ev.items?ev.items.map(i=>i[0]):[];
  const has=s=>L.some(l=>l.indexOf(s)===0);
  let key=ev.kind;
  if(ev.kind==='ankle'||ev.kind==='juke'){
    if(ev.kind==='ankle'&&!ev.baited&&!ev.back&&!ev.spin&&!ev.air&&!ev.dash)key='ankle';
    else if(ev.baited)key='baited';else if(ev.back)key='nolook';else if(ev.spin)key='spin';else if(ev.air)key='air';else if(ev.dash)key='dash';

function tone(f,d,type,vol,slide){
  if(muted||!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d+.02);
  }catch(e){}
}
function whoosh(d,f0,f1,vol){
  if(muted||!AC)return;

    if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}

    g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);

  }catch(e){}
}

function updateParticles(dt){

/* ---------- entity sync ---------- */
function faceForChaser(c){
  switch(c.state){
    case'trip':case'crash':case'tumble':return'dizzy';
    case'dance':return'smug';
    case'quit':return'rage';
    case'shame':return'cry';
    case'flee':return'scared';
    case'windup':case'lunge':return c.tier>=1?'rage':'angry';
  }
  return c.tier>=2?'rage':c.tier>=1?'angry':'calm';
}
function syncChasers(dt){
  const w=G.w,T=G.t,seen=new Set();
  if(!w)return;
  const P=w.P;
  for(const c of w.C){
    seen.add(c.id);
    let m=CM.get(c.id);
    if(!m){
      m=makeBean(KIND_HUE[c.kind]||HUES[c.hue%6],0xffffff,c.name);m.g.scale.set(1.2,1.2,1.2);scene.add(m.g);CM.set(c.id,m);
      puff(c.x,.5,c.z,14,0xffffff,5,4);
    }
    const sp=Math.hypot(c.vx,c.vz),k=Math.min(1,sp/6);
    m.g.position.set(c.x,c.y,c.z);
    let head=Math.atan2(c.fx,c.fz),tiltX=0,tiltZ=0,bob=0,sy=1,ox=0;
    m.ph+=sp*dt*.9;
    m.fl.position.z=.08+Math.sin(m.ph)*.25*k;m.fr.position.z=.08-Math.sin(m.ph)*.25*k;
    m.al.position.z=-Math.sin(m.ph)*.3*k;m.ar.position.z=Math.sin(m.ph)*.3*k;
    bob=Math.abs(Math.sin(m.ph))*.08*k;
    m.stars.visible=false;m.mat.emissive.setHex(w.mode!=='solo'&&w.holder===c.id?(Math.floor(T*(w.mode==='bomb'?Math.max(4,18-w.fuse):6))%2?0xaa6a00:0x331a00):0x000000);
    switch(c.state){
      case'chase':case'flee':case'shame':tiltX=.18*k;break;
      case'windup':tiltX=-.3;sy=.86;bob=-.05;ox=Math.sin(T*90)*.06;m.mat.emissive.setHex(Math.floor(T*14)%2?0x8a1812:0x3a0a08);break;
      case'lunge':tiltX=.95;bob=.05;break;
      case'trip':tiltX=1.5;bob=-.62;m.stars.visible=true;m.stars.rotation.y=T*8;break;
      case'crash':tiltX=-1.4;bob=-.5;m.stars.visible=true;m.stars.rotation.y=T*8;break;
      case'tumble':tiltX=c.t*13;bob=.5+Math.sin(c.t*9)*.3;m.stars.visible=true;m.stars.rotation.y=T*8;break;
      case'recover':tiltX=Math.sin(T*10)*.15;m.stars.visible=true;m.stars.rotation.y=T*6;break;
      case'dance':bob=Math.abs(Math.sin(T*14))*.3;head+=Math.sin(T*8)*.5;break;
      case'quit':head+=c.t*18;tiltZ=Math.sin(T*20)*.4;break;
    }
    if(w.mode==='sus'&&c.alive===false&&c.state==='trip')m.stars.visible=false;
    m.rot.rotation.set(tiltX,head,tiltZ,'YXZ');
    m.rot.position.set(ox,bob,0);m.rot.scale.set(1,sy,1);
    setFace(m,faceForChaser(c));
    const d=Math.hypot(c.x-P.x,c.z-P.z),f=Math.max(1,d/16);
    const show=d<110&&c.state!=='quit';
    const solo=w.mode==='solo';m.tag.visible=show;m.bar.visible=show&&solo;m.fill.visible=show&&solo;
    if(show){
      m.tag.scale.set(2.4*f,.6*f,1);m.bar.scale.set(1.3*f,.17*f,1);
      m.fill.scale.set(Math.max(.001,1.26*f*c.ego/100),.1*f,1);m.fill.position.x=-.63*f;
      m.tag.position.y=2.8+.5*(f-1);m.bar.position.y=m.fill.position.y=2.4+.4*(f-1);
      m.fill.material.color.setHex(c.ego>60?0x9be564:c.ego>30?0xffd23f:0xff5a36);
    }
    m.sh.position.set(c.x,.03,c.z);const s2=1.2/(1+c.y*.2);m.sh.scale.set(s2,s2,s2);m.sh.visible=c.state!=='quit';
  }
  for(const [id,m] of CM)if(!seen.has(id)){scene.remove(m.g);scene.remove(m.sh);CM.delete(id);}
}

/* ---------- camera ---------- */
let camX=0,camZ=0;
function updateCamera(dt){
  const P=G.w?G.w.P:null;
  if(!P){
    const a=G.t*.1;
    cam.position.set(Math.sin(a)*58,22,Math.cos(a)*58);cam.rotation.set(-.3,a,0,'YXZ');
    cam.fov=62;cam.updateProjectionMatrix();sky.position.copy(cam.position);return;
  }
  const spdK=clamp(P.spd/BOOST,0,1);
  if(P.ground&&P.spd>2)bobT+=dt*(8+P.spd*.35);
  const bob=RM?0:(P.ground?Math.sin(bobT)*.045*Math.min(1,P.spd/16):0);
  landDip*=Math.pow(.001,dt);
  let sx=0,sz=0;
  if(shake>.01){if(!RM){sx=(Math.random()-.5)*shake*.2;sz=(Math.random()-.5)*shake*.2;}shake*=Math.pow(.02,dt);}
  cam.position.set(P.x+sx,P.y+EYE+bob-landDip,P.z+sz);
  const strafe=P.vx*Math.cos(P.yaw)-P.vz*Math.sin(P.yaw);
  const roll=RM?0:clamp(-strafe*.004,-.09,.09);
  cam.rotation.set(look.pitch,look.yaw,roll,'YXZ');
  fovPunch*=Math.pow(.02,dt);
  const target=76+(RM?0:18*Math.pow(spdK,1.5)+fovPunch);
  if(Math.abs(cam.fov-target)>.05){cam.fov+=(target-cam.fov)*Math.min(1,10*dt);cam.updateProjectionMatrix();}
  sky.position.copy(cam.position);
}

    const tcol=TRAILS[PROG.cos.t].c;g.strokeStyle='rgba('+(tcol>>16&255)+','+(tcol>>8&255)+','+(tcol&255)+','+a.toFixed(3)+')';g.lineWidth=2;g.beginPath();

    g.beginPath();g.moveTo(0,-20);g.lineTo(16,14);g.lineTo(0,6);g.lineTo(-16,14);g.closePath();g.fill();g.stroke();g.restore();
    g.fillStyle='#fff';g.font='500 13px "DM Mono",monospace';g.textAlign='center';g.fillText(lab+' '+Math.round(Math.hypot(dx,dz))+' m',cx,cy-ar+34);
  }
  if(w.mode==='park'&&w.park&&w.state==='play'){
    const pl=w.M.plats,q=pl[Math.min(pl.length-1,w.park.on+1)],dx=q.x-P.x,dz=q.z-P.z,a=dx*rx+dz*rz,b=dx*fx+dz*fz,th=Math.atan2(a,b),ar=ringR*1.12;
    g.save();g.translate(cx,cy-ar);g.rotate(th);
    g.fillStyle='#62d0ff';g.strokeStyle='rgba(10,12,18,.9)';g.lineWidth=3;
    g.beginPath();g.moveTo(0,-20);g.lineTo(16,14);g.lineTo(0,6);g.lineTo(-16,14);g.closePath();g.fill();g.stroke();g.restore();
    g.fillStyle='#fff';g.font='500 13px "DM Mono",monospace';g.textAlign='center';g.fillText((q.i===pl.length-1?'FINISH ':'NEXT ')+Math.round(Math.hypot(dx,dz))+' m',cx,cy-ar+34);
  }
  if(w.mode==='koth'&&w.koth&&w.state==='play'){
    const Z=w.koth.zone,dx=Z.x-P.x,dz=Z.z-P.z,a=dx*rx+dz*rz,b=dx*fx+dz*fz,th=Math.atan2(a,b),ar=ringR*1.12;
    const col=w.koth.hold==='you'?'#9be564':w.koth.hold==='contested'?'#ff5a36':'#ffd23f';
    g.save();g.translate(cx,cy-ar);g.rotate(th);

    g.beginPath();g.moveTo(0,-20);g.lineTo(16,14);g.lineTo(0,6);g.lineTo(-16,14);g.closePath();g.fill();g.stroke();g.restore();
    g.fillStyle='#fff';g.font='500 13px "DM Mono",monospace';g.textAlign='center';g.fillText('ZONE '+Math.round(Math.hypot(dx,dz))+' m',cx,cy-ar+34);
  }
  // radar
  const R=Math.min(62,hh*.14),rcx=12+R,rcy=12+R,range=130,sc=R/range;
  g.save();g.beginPath();g.arc(rcx,rcy,R,0,7);g.clip();

/* ---------- clips ---------- */
let pendingClip=null;
function captureClip(info){pendingClip=info;}
function grabThumb(){
  try{
    const src=renderer.domElement,cw=src.width,ch=src.height;
    const c=document.createElement('canvas');c.width=320;c.height=180;const g=c.getContext('2d');
    const sh=Math.min(ch,cw*9/16),sy=(ch-sh)/2;
    g.drawImage(src,0,sy,cw,sh,0,0,320,180);
    return c.toDataURL('image/jpeg',.7);
  }catch(e){return'';}
}
function addClip(info,thumb){
  const cl=Object.assign({thumb,frames:null,t0:G.t-5.5,endAt:G.t+1.2},info);
  G.clips.unshift(cl);
  if(G.clips.length>18)G.clips.pop();
  renderClips();
}
function finalizeClips(force){
  let ch=false;
  for(const cl of G.clips){
    if(cl.frames||(!force&&G.t<cl.endAt))continue;
    const end=Math.min(G.t,cl.endAt);
    cl.frames=REC.filter(f=>f.t>=cl.t0&&f.t<=end);
    if(cl.frames.length<4)cl.frames=null;
    ch=true;
  }
  if(ch)renderClips(G.bestClip);
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function renderClips(best){
  if(best===undefined)best=G.bestClip;else G.bestClip=best;
  fillReel($('reel'),best);if(G.hlBox&&G.hlBox.isConnected)fillReel(G.hlBox,best);
}
function fillReel(box,best){
  box.textContent='';
  $('clipCount').textContent=G.clips.length+(G.clips.length===1?' clip':' clips');
  if(!G.clips.length){box.appendChild(el('p','empty','No clips yet. Break an ankle, hurdle a lunge or tag someone back and it lands here. Getting tagged at the worst moment lands here too.'));return;}
  G.clips.forEach(cl=>{
    const card=el('article','tape'+(best&&cl===best?' best':''));
    const th=el('div','thumb');
    if(cl.thumb){const img=document.createElement('img');img.src=cl.thumb;img.alt=cl.title;th.appendChild(img);}
    th.appendChild(el('span','badge'+(cl.blooper?'':' ok'),cl.label));
    const body=el('div','tbody');
    body.appendChild(el('h3','',cl.title));
    body.appendChild(el('p','','Round '+cl.round+(cl.total?' · +'+cl.total.toLocaleString('en-US'):'')));
    if(cl.frames){const rb=btn('Watch replay',false,()=>openReplay(cl));rb.style.marginTop='4px';body.appendChild(rb);th.style.cursor='pointer';th.addEventListener('click',()=>openReplay(cl));}
    else body.appendChild(el('p','','Saving replay...'));
    card.appendChild(th);card.appendChild(body);box.appendChild(card);
  });
}

        if(e.total>=300)captureClip({title:captionFor(e),label:KIND_LABEL[e.kind]||'CLIP',blooper:false,total:e.total,round:w.round});
        break;}
    }
  }
  w.events.length=0;
}

  else if(w&&w.mode==='ffa'&&w.state==='play'){it.hidden=false;it.textContent=w.holder==='p'?"YOU'RE IT · TAG SOMEONE":'RUN · '+Math.ceil(w.matchT)+'s';}
  else if(w&&w.phase==='it'&&w.state==='play'){it.hidden=false;it.textContent="YOU'RE IT · TAG ANYONE · "+Math.max(0,w.itT).toFixed(1)+'s';}else it.hidden=true;
  if(w){
    const P=w.P,st=$('stam');
    st.style.setProperty('--s',String(P.stamina));st.classList.toggle('low',P.exhausted||P.stamina<.25);
    const set=(k,p)=>{const e=keyEls[k];e.style.setProperty('--p',String(clamp(p,0,1)));e.classList.toggle('cd',p>0);};
    set('dash',P.dashCd/1.2);set('taunt',P.tauntCd/2);set('jump',P.ground?0:1);
  }
}

  $('hint').textContent=(MODES.find(m=>m.key===mode)||MODES[0]).hint;

function stepReplay(dt){

  $('rSeek').value=String(Math.round((RP.t-t0)/(t1-t0||1)*1000));
  let i=0;while(i<fr.length-2&&fr[i+1].t<=RP.t)i++;
  const a=fr[i],b=fr[Math.min(fr.length-1,i+1)],k=b.t>a.t?clamp((RP.t-a.t)/(b.t-a.t),0,1):0;

    const n=bm.get(c.id)||c;

  });

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(renderer){
    G.t+=dt;
    if(G.state==='play'&&G.w){
      if(hitstop>0)hitstop-=dt;
      else{
        const w=G.w;
        let ts=w.state==='dead'?.35:1;
        if(slow>0){slow-=dt;ts=Math.min(ts,.35);}
        acc+=dt*ts;
        let n=0;
        while(acc>=STEPT&&n<5){
          const inp=buildInput();
          if(COARSE&&G.w&&G.w.mode==='sus'&&E.taunt)G.useLatch=!G.useLatch;
          update(w,STEPT,inp);
          E.jump=E.dash=E.taunt=E.report=false;
          handleEvents(w);
          acc-=STEPT;n++;
        }
        if(n===5)acc=0;
        if(G.t-lastRec>=1/30){lastRec=G.t;recSnap(w);}
        finalizeClips(false);
        if(w.mode==='sus'&&w.sus.meeting&&G.state==='play')openMeeting();
        if(w.state==='dead'&&w.deadT>.6&&G.state==='play')endGame();
      }
    }
    if(G.state==='replay')stepReplay(dt);
    updateCamera(dt);
    if(G.w&&(G.state==='play'||G.state==='pause'||G.state==='over'||G.state==='replay'||G.state==='intro'))syncChasers(G.state==='pause'?0:dt);
    syncHoops();syncStations();syncArena();syncOrbs();
    const pp=G.state==='pause'?0:dt;
    updateParticles(pp);
    updateBubbles(pp);
    for(let i=0;i<padMeshes.length;i++){padMeshes[i].position.y=.06+Math.sin(G.t*4+i)*.01;}
    if(G.state!=='replay')updateHud();
    renderer.render(scene,cam);
    drawHud();
    if(pendingClip){const th=grabThumb();addClip(pendingClip,th);pendingClip=null;}
  }
  requestAnimationFrame(frame);
}
function resize(){
  if(!renderer)return;
  const w=Math.max(280,stage.clientWidth),bar=(document.querySelector('.bar')||{}).offsetHeight||48;
  const avail=window.innerHeight-stage.offsetTop-bar-30;
  const h=Math.round(Math.max(w<640?440:400,Math.min(avail,w*1.15)));
  stage.style.height=h+'px';renderer.setSize(w,h,false);
  cam.aspect=w/h;cam.updateProjectionMatrix();resizeHud(w,h);
}

/* ---------- boot ---------- */
$('btnPause').addEventListener('click',()=>{if(G.state==='play'||G.state==='pause')togglePause();});
$('btnSound').addEventListener('click',()=>{
  muted=!muted;ensureAudio();$('btnSound').textContent=muted?'Sound off':'Sound on';$('btnSound').setAttribute('aria-pressed',String(!muted));
});
$('btnAuto').addEventListener('click',()=>{
  SET.auto=!SET.auto;$('btnAuto').textContent=SET.auto?'Auto-sprint on':'Auto-sprint off';$('btnAuto').setAttribute('aria-pressed',String(SET.auto));
});
function boot(){
  setHeartsHud();renderClips();
  $('btnPause').disabled=true;$('itbar').hidden=true;
  $('hint').textContent=COARSE?'Left thumb moves. Right thumb looks.':'WASD move · mouse look · Shift sprint · Space jump · Q dash · E taunt.';
  try{
    if(typeof THREE==='undefined')throw new Error('three missing');
    _p=new THREE.Vector3();
    renderer=new THREE.WebGLRenderer({canvas:cvs,antialias:true});
    renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));
    hctx=hudc.getContext('2d');
    buildWorld(genMap(7));
    resize();
    if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize',resize);
    titleCard();
  }catch(err){
    stage.style.height='320px';
    showCard(c=>{c.appendChild(el('h2','','No 3D here'));c.appendChild(el('p','','This browser could not start WebGL, which the map needs. Try another browser or turn on hardware acceleration.'));});
  }
  requestAnimationFrame(frame);
}
boot();
</script>
