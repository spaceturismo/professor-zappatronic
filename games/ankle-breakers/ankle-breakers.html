<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ankle Breakers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Archivo+Narrow:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Slim HUD strip, the first-person stage with overlaid cards, a hint bar, then a shelf of saved highlights. */
:root{
  --ink:#12141c; --panel:#1b1f2b; --panel-2:#232937; --line:#2d3446;
  --text:#f1f3f8; --muted:#98a1b5;
  --hot:#ff5a36; --sun:#ffd23f; --sky:#62d0ff; --lime:#9be564;
  --display:'Bowlby One',Impact,'Arial Black',sans-serif;
  --body:'Archivo Narrow','Arial Narrow',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--ink);color:var(--text);font:600 16px/1.4 var(--body);
  padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.bar,.hud{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
.wrap>*{min-width:0;max-width:100%}
.hud>*{min-width:0}

.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.brand{margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font:400 clamp(22px,5vw,30px)/1 var(--display);color:var(--sun)}
.brand span{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat{display:grid;gap:4px}
.stat > span{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font:500 18px/1 var(--mono);font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:4px;height:18px;align-items:center}
.hearts svg{width:18px;height:18px;fill:var(--hot)}
.hearts svg.off{fill:none;stroke:var(--line);stroke-width:2}

.stage{position:relative;overflow:hidden;border:1px solid var(--line);background:#9fc6ee;user-select:none;-webkit-user-select:none;outline-offset:3px}
.stage:focus-visible{outline:2px solid var(--sun)}
#gl,#hudc{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:crosshair}
#hudc{pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;font:700 14px/1.2 var(--body);background:#fff;color:#12141c;padding:3px 8px;border-radius:10px;white-space:nowrap;will-change:transform;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bub.pts{background:var(--sun)}
.bub.rage{background:var(--hot);color:#fff}
.bub.me{background:var(--sky)}
.bub.sm{font-size:12px;padding:2px 6px}

.banner{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:min(92%,560px);text-align:center;pointer-events:none;opacity:0}
.b-title{font:400 clamp(22px,5.2vw,40px)/1.05 var(--display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.55);text-wrap:balance}
.b-total{font:500 clamp(16px,3.4vw,22px)/1.2 var(--mono);color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.7)}
.b-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.b-chips span{font:500 12px/1.3 var(--mono);background:rgba(10,12,18,.78);padding:2px 7px;border:1px solid var(--line)}
.b-chips b{color:var(--sun);font-weight:500}

.itbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(255,90,54,.92);color:#fff;font:400 15px/1 var(--display);letter-spacing:.04em;padding:8px 14px;pointer-events:none;white-space:nowrap}
.chat{position:absolute;right:10px;top:10px;width:min(270px,36%);display:grid;gap:3px;pointer-events:none}
.chat p{margin:0;font:500 12px/1.3 var(--mono);background:rgba(10,12,18,.62);color:var(--text);padding:3px 6px;overflow-wrap:anywhere}
.chat p:nth-last-child(n+4){opacity:.5}
.chat p b{font-weight:500;color:var(--sky)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,40,0) 40%,rgba(255,60,40,.6) 100%)}

.abil{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;z-index:3}
.stam{width:120px;height:8px;background:rgba(10,12,18,.7);border:1px solid var(--line);margin:0 6px 8px;position:relative}
.stam i{position:absolute;inset:0;background:var(--lime);transform-origin:left;transform:scaleX(var(--s,1))}
.stam.low i{background:var(--hot)}
.key{position:relative;overflow:hidden;min-width:62px;padding:6px 10px 8px;background:rgba(14,17,25,.84);border:1px solid var(--line);color:var(--text);font:700 13px/1.2 var(--body);text-align:left;cursor:pointer;border-radius:3px;touch-action:none}
.key b{display:block;font:500 10px/1.2 var(--mono);color:var(--muted);letter-spacing:.06em}
.key i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--sun);transform-origin:left;transform:scaleX(var(--p,0))}
.key.cd{opacity:.55}
.key:focus-visible{outline:2px solid var(--sun)}

.touch{position:absolute;top:0;bottom:0;display:none;touch-action:none;z-index:2}
#touchL{left:0;width:50%}
#touchR{right:0;width:50%}
.stick{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border:2px solid rgba(255,255,255,.5);border-radius:50%;display:none;pointer-events:none;z-index:2}
.stick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.7)}
@media (pointer:coarse){
  .touch{display:block}
  .abil{left:auto;right:8px;bottom:8px;transform:none;flex-direction:column-reverse;align-items:flex-end}
  .key{min-width:74px;padding:10px 12px}
  .stam{margin:0 4px 4px}
}

.card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,18,.7);padding:10px;z-index:5}
.card-in{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:14px 16px 14px;display:grid;gap:10px;align-content:start}
.rbar{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(10,12,18,.9);padding:8px 10px;display:grid;gap:6px;border-top:2px solid var(--hot)}
.rbar[hidden]{display:none}
.rtag{font:400 12px/1 var(--display);background:var(--hot);color:#fff;padding:4px 6px;margin-right:8px}
#rCap{font:600 14px/1.3 var(--body)}
.rctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rctl input{flex:1 1 140px;min-width:100px;accent-color:#ffd23f}
.rctl .btn{padding:8px 12px}
.how{margin:0;padding-left:22px;display:grid;gap:8px;color:var(--text);font-weight:600}
.card-in.wide{width:min(900px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.m-best{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:6px}
.mtile{--c:#ffd23f;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--c);color:var(--text);padding:7px 10px;cursor:pointer;display:grid;gap:3px;border-radius:3px;font-family:var(--body);min-width:0}
.mtile b{font:400 16px/1.1 var(--display)}
.mtile span{font:600 14px/1.2 var(--body);color:var(--muted)}
.mtile i{font:500 11px/1.2 var(--mono);font-style:normal;color:var(--muted);letter-spacing:.04em}
.mtile:hover{border-color:var(--c)}
.mtile[aria-pressed="true"]{background:#2a3144;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.mtile:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.m-desc{color:var(--text)!important;min-height:3em}
.m-set{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.m-set .sens{flex:1 1 220px}
.card h2{margin:0;font:400 clamp(26px,6.4vw,44px)/1 var(--display);color:var(--sun);text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font:500 13px/1.35 var(--mono);margin:0}
.ctl dt{color:var(--sun);white-space:nowrap}
.ctl dd{margin:0;color:var(--text)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sgrid div{background:var(--panel-2);padding:8px 10px;display:grid;gap:3px}
.sgrid span{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sgrid b{font:500 17px/1.1 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sens{display:flex;gap:10px;align-items:center;font:500 12px/1 var(--mono);color:var(--muted)}
.sens input{flex:1;min-width:120px;accent-color:#ffd23f}
.btn{font:700 15px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:12px 16px;cursor:pointer;border-radius:3px}
.btn:hover{border-color:#4a5672}
.btn[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
.btn.primary{background:var(--hot);border-color:var(--hot);color:#fff}
.btn:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

.bar{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#hint{margin:0;color:var(--muted);font-size:15px;min-width:0;flex:1 1 280px}

.shelf-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-top:10px}
.shelf-h h2{margin:0;font:400 18px/1 var(--display);letter-spacing:.02em}
.shelf-h span{font:500 13px/1 var(--mono);color:var(--muted)}
.reel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.empty{grid-column:1/-1;margin:0;border:1px dashed var(--line);padding:22px 16px;color:var(--muted)}
.tape{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-width:0}
.tape.best{border-color:var(--sun)}
.thumb{position:relative}
.thumb img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover}
.badge{display:inline-block;font:400 11px/1 var(--display);letter-spacing:.05em;padding:5px 7px;background:var(--hot);color:#fff}
.badge.ok{background:var(--sun);color:#1a1405}
.thumb .badge{position:absolute;left:8px;top:8px}
.tbody{padding:10px 12px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.tbody h3{margin:0;font:700 16px/1.25 var(--body)}
.tbody p{margin:0;font:400 12px/1.45 var(--mono);color:var(--muted);overflow-wrap:anywhere}
#unoView .row{justify-content:flex-end}
.u-turn{text-align:center;font:400 15px/1 var(--display);padding:8px;background:var(--panel-2);color:var(--muted);letter-spacing:.03em}
.u-turn.me{background:var(--lime);color:#12141c}
.u-help{background:var(--panel);border:1px solid var(--line);padding:8px 12px;display:grid;gap:3px}
.u-help p{margin:0;font:500 12px/1.4 var(--mono);color:var(--text)}
.u-desc{text-align:center;font:600 14px/1.3 var(--body);color:var(--sun);min-height:1.4em}
#unoView{position:absolute;inset:0;z-index:4;background:rgba(14,17,25,.94);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.u-mid{flex:1 0 auto}
#unoView[hidden]{display:none}
.u-opps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.u-opp{background:var(--panel);border:1px solid var(--line);padding:8px 10px;display:grid;gap:5px;min-width:0}
.u-opp.turn{border-color:var(--sun)}
.u-opp.out{opacity:.4}
.u-opp b{font:700 15px/1.1 var(--body);overflow-wrap:anywhere}
.u-opp span{font:500 12px/1 var(--mono);color:var(--muted)}
.u-bar{height:5px;background:var(--panel-2)}
.u-bar i{display:block;height:100%;background:var(--lime)}
.u-bar.hot i{background:var(--hot)}
.u-mid{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:110px}
.ucard{width:62px;height:90px;border-radius:8px;border:3px solid #fff;color:#fff;font:400 20px/1 var(--display);display:grid;place-items:center;text-align:center;padding:2px;overflow-wrap:anywhere;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ucard small{display:block;font:500 9px/1.1 var(--mono);letter-spacing:.03em;margin-top:2px}
.ucard.R{background:#e5484d}.ucard.Y{background:#e0a800}.ucard.G{background:#2fbf71}.ucard.B{background:#3e7bfa}.ucard.W{background:#232937}
.ucard.big{width:84px;height:122px;font-size:26px;cursor:default}
.ucard.back{background:repeating-linear-gradient(45deg,#232937,#232937 6px,#2d3446 6px,#2d3446 12px);color:var(--sun)}
.ucard:disabled{opacity:.35;cursor:not-allowed;filter:saturate(.5)}
.ucard:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.u-info{text-align:center;font:500 13px/1.4 var(--mono);color:var(--text);display:grid;gap:4px;justify-items:center}
.u-hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-height:210px;overflow:auto;padding:4px}
.u-log{font:500 12px/1.4 var(--mono);color:var(--muted);text-align:center}
.u-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.u-pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.u-pick .btn.R{background:#e5484d;border-color:#e5484d;color:#fff}.u-pick .btn.Y{background:#e0a800;border-color:#e0a800;color:#12141c}.u-pick .btn.G{background:#2fbf71;border-color:#2fbf71;color:#12141c}.u-pick .btn.B{background:#3e7bfa;border-color:#3e7bfa;color:#fff}
@media (max-width:640px){.chat{display:none}.ucard{width:52px;height:76px;font-size:17px}.u-opps{gap:5px}}
</style>

<main class="wrap">
  <header class="hud">
    <h1 class="brand"><b>Ankle Breakers</b><span>First-person tag</span></h1>
    <div class="stats">
      <div class="stat"><span>Round</span><b id="sRound">0</b></div>
      <div class="stat"><span>Hearts</span><div class="hearts" id="sHearts"></div></div>
      <div class="stat"><span>Combo</span><b id="sCombo">x1</b></div>
      <div class="stat"><span>Speed</span><b id="sSpeed">0 km/h</b></div>
      <div class="stat"><span>Score</span><b id="sScore">0</b></div>
    </div>
  </header>

  <section class="stage" id="stage" tabindex="0" aria-label="Ankle Breakers arena">
    <canvas id="gl" role="img" aria-label="First-person view of a city map"></canvas>
    <canvas id="hudc"></canvas>
    <div class="layer" id="bubbles"></div>
    <div class="banner" id="banner" aria-live="polite"></div>
    <div class="itbar" id="itbar" hidden></div>
    <div class="chat" id="chat" aria-hidden="true"></div>
    <div class="flash" id="flash"></div>
    <div class="touch" id="touchL"></div>
    <div class="touch" id="touchR"></div>
    <div class="stick" id="stickL"><i></i></div>
    <div class="abil" id="abil">
      <div class="stam" id="stam" aria-label="Sprint stamina"><i></i></div>
      <button class="key" type="button" data-act="taunt"><b>E</b>Taunt<i></i></button>
      <button class="key" type="button" data-act="jump"><b>SPACE</b>Jump<i></i></button>
      <button class="key" type="button" data-act="dash"><b>Q / RMB</b>Dash<i></i></button>
    </div>
    <div id="unoView" hidden></div>
    <div class="rbar" id="rbar" hidden>
      <span class="rtag">REPLAY</span><span id="rCap"></span>
      <div class="rctl"><button type="button" class="btn" id="rPlay">Pause</button><button type="button" class="btn" id="rRestart">Restart</button><button type="button" class="btn" id="rSpeed">1x</button><input type="range" id="rSeek" min="0" max="1000" value="0" aria-label="Replay position"><button type="button" class="btn primary" id="rClose">Close</button></div>
    </div>
    <div class="card" id="card"></div>
  </section>

  <div class="bar">
    <p id="hint"></p>
    <div class="row">
      <button class="btn" id="btnSettings" type="button">Settings</button>
      <button class="btn" id="btnMenu" type="button">Main menu</button>
      <button class="btn" id="btnAuto" type="button" hidden aria-pressed="false">Auto-sprint off</button>
      <button class="btn" id="btnPause" type="button">Pause</button>
      <button class="btn" id="btnSound" type="button" hidden aria-pressed="true">Sound on</button>
    </div>
  </div>

  <div id="shelf" hidden>
  <div class="shelf-h"><h2>Highlights</h2><span id="clipCount">0 clips</span></div>
  <section class="reel" id="reel" aria-label="Saved highlights"></section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==SIM==
const HALF=300,PR=.5,CR=.6,GRAV=30,JUMPV=11,RUN=21,SPRINT=38,BOOST=56,DASHV=68,STEPH=.35,CELL=16,GN=Math.ceil(HALF*2/CELL);
const MAP_N=8,PITCH=70,STREET=22,BLOCK=PITCH-STREET;
const NAMES=['Skeeter','Gloria','Big Wanda','Moose','Pickles','Aunt Carol','Dwayne','Professor Tilt','Big Gary','Brenda','Coach Dale','Tiny Terry','Mildred','Sir Slides-a-Lot','Lil Tim','Dennis','Uncle Rick','Ms. Pennywhistle','Chad Jr.','Nana Bolt'];
const KIND={rusher:{speed:21,lead:0,wind:.38},reader:{speed:22,lead:.32,wind:.3},sprinter:{speed:27,lead:.22,wind:.28},pack:{speed:23,lead:.25,wind:.32}};
const TAGGABLE=['chase','windup','lunge'];

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ev(w,type,p){const e=p||{};e.type=type;w.events.push(e);return e;}
function wrapPi(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

/* ----- map ----- */
function cellIdx(v){return Math.max(0,Math.min(GN-1,Math.floor((v+HALF)/CELL)));}
function genMap(seed){
  const r=mulberry(seed||7),boxes=[],cyls=[],pads=[],cells=[];
  const off=-MAP_N*PITCH/2;
  for(let i=0;i<MAP_N;i++)for(let j=0;j<MAP_N;j++){
    const cx=off+i*PITCH+PITCH/2,cz=off+j*PITCH+PITCH/2;
    if((i===3||i===4)&&(j===3||j===4)){cells.push({i,j,cx,cz,type:'plaza'});continue;}
    const t=r(),type=t<.2?'city':t<.34?'park':t<.44?'yard':t<.5?'rubble':'open';
    cells.push({i,j,cx,cz,type});
    if(type==='city'){
      let placed=0;
      for(const q of [[-1,-1],[1,-1],[-1,1],[1,1]]){
        if(r()<.4||(placed===0&&q[0]===1&&q[1]===1)){
          const sx=13+r()*9,sz=13+r()*9,h=9+r()*38;
          boxes.push({x:cx+q[0]*12+(r()-.5)*3,z:cz+q[1]*12+(r()-.5)*3,hx:sx/2,hz:sz/2,h,kind:'building',tint:Math.floor(r()*6)});
          placed++;
        }
      }
    }else if(type==='park'){
      const n=3+Math.floor(r()*4);
      for(let k=0;k<n;k++)cyls.push({x:cx+(r()-.5)*40,z:cz+(r()-.5)*40,r:.8,h:6,kind:'tree',tint:Math.floor(r()*3)});
    }else if(type==='yard'){
      const o=r()<.5;
      for(let a=0;a<3;a++)for(let b=0;b<3;b++){
        if(r()<.55)continue;
        const along=(b-1)*18+(r()-.5)*3,across=(a-1)*14;
        boxes.push({x:cx+(o?across:along),z:cz+(o?along:across),hx:o?1.3:6,hz:o?6:1.3,h:2.6,kind:'container',tint:Math.floor(r()*4)});
      }
    }else{
      const n=3+Math.floor(r()*4);
      for(let k=0;k<n;k++){const s=1.2+r()*1.4;boxes.push({x:cx+(r()-.5)*40,z:cz+(r()-.5)*40,hx:s/2,hz:s/2,h:.9+r()*1.2,kind:'crate',tint:0});}
    }
  }
  cyls.push({x:0,z:0,r:6,h:1.4,kind:'fountain',tint:0});
  [[1,0],[-1,0],[0,1],[0,-1]].forEach((d,k)=>{
    for(let s=0;s<3;s++){
      const dist=12+s*3.2,h=.7+s*.7;
      boxes.push({x:d[0]*dist,z:d[1]*dist,hx:d[0]?1.6:3,hz:d[1]?1.6:3,h,kind:'stair',tint:k%4});
    }
  });
  for(let k=0;k<30;k++){
    const line=off+(Math.floor(r()*(MAP_N+1)))*PITCH,along=(r()-.5)*540,sgn=r()<.5?1:-1;
    if(r()<.5)pads.push({x:line,z:along,dx:0,dz:sgn,r:3.4});else pads.push({x:along,z:line,dx:sgn,dz:0,r:3.4});
  }
  const M={boxes,cyls,pads,cells,grid:null};
  const g=new Array(GN*GN);for(let i=0;i<g.length;i++)g[i]=[];
  const put=(o,x0,x1,z0,z1)=>{const a=cellIdx(x0),b=cellIdx(x1),c=cellIdx(z0),d=cellIdx(z1);for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)g[i*GN+j].push(o);};
  boxes.forEach(o=>{o.t=0;put(o,o.x-o.hx,o.x+o.hx,o.z-o.hz,o.z+o.hz);});
  cyls.forEach(o=>{o.t=1;put(o,o.x-o.r,o.x+o.r,o.z-o.r,o.z+o.r);});
  M.grid=g;
  return M;
}

function contact(M,x,z,r,feetY){
  let best=null;
  const test=(nx,nz,pen)=>{if(pen>0&&(!best||pen>best.pen))best={nx,nz,pen};};
  test(-1,0,x-(HALF-r));test(1,0,-HALF+r-x);test(0,-1,z-(HALF-r));test(0,1,-HALF+r-z);
  const x0=cellIdx(x-r),x1=cellIdx(x+r),z0=cellIdx(z-r),z1=cellIdx(z+r);
  for(let i=x0;i<=x1;i++)for(let j=z0;j<=z1;j++){
    const lst=M.grid[i*GN+j];
    for(let k=0;k<lst.length;k++){
      const o=lst[k];
      if(feetY>=o.h-STEPH)continue;
      if(o.t===1){
        const dx=x-o.x,dz=z-o.z,d=Math.hypot(dx,dz),m=r+o.r;
        if(d<m){if(d>1e-6)test(dx/d,dz/d,m-d);else test(1,0,m);}
      }else{
        const cx=Math.max(o.x-o.hx,Math.min(x,o.x+o.hx)),cz=Math.max(o.z-o.hz,Math.min(z,o.z+o.hz));
        const dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;
        if(d2<r*r){
          if(d2>1e-8){const d=Math.sqrt(d2);test(dx/d,dz/d,r-d);}
          else{const px=o.hx-Math.abs(x-o.x),pz=o.hz-Math.abs(z-o.z);if(px<pz)test(Math.sign(x-o.x)||1,0,px+r);else test(0,Math.sign(z-o.z)||1,pz+r);}
        }
      }
    }
  }
  return best;
}
function pushOut(M,e,r,feetY,killVel){
  let last=null;
  for(let i=0;i<3;i++){
    const c=contact(M,e.x,e.z,r,feetY);
    if(!c)break;
    e.x+=c.nx*c.pen;e.z+=c.nz*c.pen;last=c;
    if(killVel){const vn=e.vx*c.nx+e.vz*c.nz;if(vn<0){e.vx-=vn*c.nx;e.vz-=vn*c.nz;}}
  }
  return last;
}
function supportH(M,x,z,y){
  let h=0;
  const x0=cellIdx(x-.4),x1=cellIdx(x+.4),z0=cellIdx(z-.4),z1=cellIdx(z+.4);
  for(let i=x0;i<=x1;i++)for(let j=z0;j<=z1;j++){
    const lst=M.grid[i*GN+j];
    for(let k=0;k<lst.length;k++){
      const o=lst[k];
      if(o.h>y+STEPH||o.h<=h)continue;
      if(o.t===1){if(Math.hypot(x-o.x,z-o.z)<o.r+.15)h=o.h;}
      else if(Math.abs(x-o.x)<o.hx+.15&&Math.abs(z-o.z)<o.hz+.15)h=o.h;
    }
  }
  return h;
}

/* ----- world ----- */
const ORB_TYPES=['haste','shield','freeze'];
function addOrbs(w){
  w.orbs=[];w.freezeT=0;
  if(['solo','ffa','bomb','koth','hide','seek'].indexOf(w.mode)<0)return;
  for(let i=0;i<10;i++){
    const q=freeSpot(w.M,(w.rnd()-.5)*460,(w.rnd()-.5)*460);
    w.orbs.push({x:q[0],z:q[1],type:ORB_TYPES[i%3],cool:0});
  }
}
function stepOrbs(w,dt){
  const P=w.P;
  P.hasteT=Math.max(0,(P.hasteT||0)-dt);P.shieldT=Math.max(0,(P.shieldT||0)-dt);
  if(P.shieldT>0)P.inv=Math.max(P.inv,.15);
  w.freezeT=Math.max(0,(w.freezeT||0)-dt);
  for(const o of w.orbs){
    o.cool=Math.max(0,o.cool-dt);
    if(o.cool<=0&&Math.hypot(o.x-P.x,o.z-P.z)<2.6&&P.y<2.5){
      o.cool=16;
      if(o.type==='haste')P.hasteT=6;else if(o.type==='shield')P.shieldT=6;else w.freezeT=4;
      ev(w,'orb',{type:o.type,x:o.x,z:o.z});
    }
  }
}
function newWorld(seed,mode){

  const W0={mode:mode||'solo',holder:null,fuse:0,matchT:0,passes:0,won:false,M,rnd:mulberry((seed||7)*31+5),t:0,roundT:0,lastExtra:0,round:0,state:'play',phase:'run',itT:0,events:[],nextId:1,nameI:0,
    P:{x:0,z:18,y:0,vx:0,vz:0,vy:0,yaw:0,spd:0,hp:3,inv:0,ground:true,stamina:1,exhausted:false,regen:0,sprinting:false,
      dashT:0,dashCd:0,dashX:0,dashZ:-1,tauntCd:0,tauntT:0,lastTaunt:-99,boostT:0,spinAcc:0},
    C:[],spawnQ:[],score:0,combo:0,comboT:0,clearing:false,clearT:0,deadT:0,

  addOrbs(W0);return W0;
}

function award(w,kind,items,x,z,meta){
  const sub=items.reduce((a,i)=>a+i[1],0);
  w.combo++;w.comboT=5;
  const mult=Math.min(5,1+Math.floor((w.combo-1)/2));
  const total=sub*mult;
  w.score+=total;
  if(total>w.stats.bestTrick){w.stats.bestTrick=total;w.stats.bestLabel=items.map(i=>i[0]).join(' + ');}
  const e=ev(w,'score',{kind,items,sub,mult,total,x,z});
  if(meta)Object.assign(e,meta);
  return total;
}

function startRound(w){
  w.round++;w.roundT=0;w.lastExtra=0;
  const n=Math.min(8,2+w.round),kinds=[];
  for(let i=0;i<n;i++){
    let k='rusher';
    if(w.round>=2&&i%4===1)k='reader';
    if(w.round>=3&&i%4===2)k='sprinter';
    if(w.round>=4&&i%4===3)k='pack';
    kinds.push(k);
  }
  kinds.forEach((k,i)=>w.spawnQ.push({t:.3+i*.35,kind:k}));
  ev(w,'round',{round:w.round,n});
}
function spawnChaser(w,kind){
  const P=w.P;let x=0,z=0;
  for(let i=0;i<40;i++){
    const a=w.rnd()*Math.PI*2,r=60+w.rnd()*50;
    x=Math.max(-HALF+4,Math.min(HALF-4,P.x+Math.cos(a)*r));z=Math.max(-HALF+4,Math.min(HALF-4,P.z+Math.sin(a)*r));
    if(!contact(w.M,x,z,CR+.6,-1e9)&&Math.hypot(x-P.x,z-P.z)>40)break;
  }
  const K=KIND[kind],id=w.nextId++;
  const c={id,kind,name:NAMES[(w.nameI++)%NAMES.length],x,z,vx:0,vz:0,fx:0,fz:1,y:0,vy:0,state:'chase',t:0,ego:100,rage:0,tier:0,
    speed:K.speed+Math.min(3,w.round*.4)+(w.rnd()-.5)*1.2,lead:K.lead,wind:K.wind,lungeCd:1.5,lx:0,lz:1,minD:99,rec:null,
    tauntedAt:-99,detT:0,detX:0,detZ:0,cutT:0,cutCd:0,cutX:0,cutZ:0,flank:w.rnd()<.5?1:-1,hue:id%6,dead:false};
  w.C.push(c);ev(w,'spawn',{id,x,z,kind});

function addRage(w,c,amt){
  if(w.mode!=='solo')return;
  if(c.state==='quit'||c.state==='shame')return;
  c.rage=Math.min(100,c.rage+amt);
  if(c.rage>=100){
    c.state='quit';c.t=0;c.vy=14;
    const dx=c.x-w.P.x,dz=c.z-w.P.z,d=Math.hypot(dx,dz)||1;c.vx=dx/d*8;c.vz=dz/d*8;
    w.stats.quits++;
    ev(w,'quit',{id:c.id,name:c.name,x:c.x,z:c.z});
    award(w,'quit',[['Rage quit',500]],c.x,c.z,{id:c.id,name:c.name});
    return;
  }
  const tier=c.rage>=75?2:c.rage>=40?1:0;
  if(tier>c.tier){c.tier=tier;ev(w,'rage',{id:c.id,tier,x:c.x,z:c.z});}
}
function egoHit(w,c,dmg){
  if(w.mode!=='solo')return;
  if(c.state==='quit'||c.state==='shame')return;
  c.ego=Math.max(0,c.ego-dmg);
  if(c.ego<=0){
    c.state='shame';c.t=0;w.stats.shames++;
    ev(w,'shame',{id:c.id,name:c.name,x:c.x,z:c.z});
    award(w,'shame',[['Sent home',250]],c.x,c.z,{id:c.id,name:c.name});
  }
}
function resume(w,c){c.state=w.phase==='it'?'flee':'chase';c.t=0;}

function tagPlayer(w,c){
  const P=w.P;
  if(w.phase!=='run'||P.inv>0||P.y>=1.2||P.dashT>0)return false;
  w.phase='it';w.itT=15;P.inv=2.2;w.combo=0;w.comboT=0;w.stats.tags++;w.score=Math.max(0,w.score-250);
  const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz)||1;
  P.x+=dx/d*1.5;P.z+=dz/d*1.5;pushOut(w.M,P,PR,P.y,true);
  c.state='dance';c.t=0;c.rage=0;c.tier=0;c.immune=w.t+3.5;
  for(const o of w.C)if(o!==c&&(o.state==='chase'||o.state==='windup'||o.state==='lunge'||o.state==='recover')){o.state='flee';o.t=0;}
  ev(w,'tag',{id:c.id,name:c.name,x:c.x,z:c.z});
  return true;
}
function tagBack(w,c){
  const P=w.P,items=[['Tag back',400]];
  if(P.y>.8)items.push(['Air tag',300]);
  if(P.dashT>0)items.push(['Dash tag',150]);
  if(P.spd>=24)items.push(['Full speed',100]);
  w.stats.tagbacks++;
  award(w,'tagback',items,c.x,c.z,{id:c.id,name:c.name,air:P.y>.8});
  w.phase='run';w.itT=0;P.inv=2.5;
  for(const o of w.C)if(o.state==='flee'){o.state='chase';o.t=0;o.lungeCd=2.5;}
  c.state='chase';c.t=0;c.lungeCd=3;egoHit(w,c,35);
  ev(w,'tagback',{id:c.id,name:c.name,x:c.x,z:c.z});
}
function itFail(w){
  const P=w.P;
  P.hp--;w.phase='run';P.inv=2.5;w.combo=0;w.comboT=0;
  for(const o of w.C)if(o.state==='flee'){o.state='chase';o.t=0;o.lungeCd=2.5;}
  ev(w,'itfail',{hp:P.hp});
  if(P.hp<=0){w.state='dead';w.deadT=0;ev(w,'dead',{});}
}

function leadPt(w,c,t,sp){ // aim where the target will be
  const d=Math.hypot(t.x-c.x,t.z-c.z),tt=Math.min(.55,d/(sp||20)*.8);
  return[t.x+(t.vx||0)*tt,t.z+(t.vz||0)*tt];
}
function fleeTarget(w,c,tx,tz,dt){ // pick the open direction that leads away from the threat
  c.flT=(c.flT||0)-dt;
  if(c.flT>0&&c.flx!==undefined)return[c.flx,c.flz];
  c.flT=.25;
  const ax=c.x-tx,az=c.z-tz,al=Math.hypot(ax,az)||1;
  let best=null,bs=-1e9;
  for(let k=0;k<12;k++){
    const a=k*Math.PI/6,dx=Math.cos(a),dz=Math.sin(a);
    let clear=0;for(let st=1;st<=4;st++){if(contact(w.M,c.x+dx*st*4,c.z+dz*st*4,CR+.5,-1e9))break;clear=st;}
    const nx=c.x+dx*18,nz=c.z+dz*18;
    let sc=(dx*ax+dz*az)/al*10+clear*4+((c.fx||0)*dx+(c.fz||0)*dz)*2;
    if(clear<2)sc-=30;
    if(Math.abs(nx)>HALF-14||Math.abs(nz)>HALF-14)sc-=12;
    sc+=Math.hypot(nx-tx,nz-tz)*.1;
    if(sc>bs){bs=sc;best=[c.x+dx*30,c.z+dz*30];}
  }
  c.flx=best[0];c.flz=best[1];return best;
}
function botEvade(w,dt){ // bots read the player's dash and sidestep it
  const P=w.P;
  if(P.dashT<=0)return;
  for(const c of w.C){
    if(c.alive===false||c.dashT>0||c.dCd===undefined||c.dCd>0||w.freezeT>0)continue;
    if(['tumble','quit','trip','dance','calm','crash','shame'].indexOf(c.state)>=0)continue;
    const dx=c.x-P.x,dz=c.z-P.z,d=Math.hypot(dx,dz);
    if(d>9||d<1)continue;
    if((dx*P.dashX+dz*P.dashZ)/d<.78)continue;
    if(c.evAt===undefined||w.t-c.evAt>1.5)c.evAt=w.t+.1+w.rnd()*.14;
    if(w.t<c.evAt)continue;
    c.evAt=undefined;
    if(w.rnd()<.2)continue;
    const sg=(dx*-P.dashZ+dz*P.dashX)>=0?1:-1;
    c.dashT=.22;c.ddx=-P.dashZ*sg;c.ddz=P.dashX*sg;c.dCd=1.4+w.rnd()*.5;
    ev(w,'botdash',{id:c.id,x:c.x,z:c.z});
  }
}
function botDash(w,c,dt,tx,tz,minD,maxD){ // bots dash like players: cooldown, burst, can be dodged
  if(c.dCd===undefined)c.dCd=.5+w.rnd()*1.5;
  c.dCd-=dt;
  if(c.dashT>0||c.dCd>0||w.freezeT>0)return false;
  const dx=tx-c.x,dz=tz-c.z,d=Math.hypot(dx,dz);
  if(d<minD||d>maxD)return false;
  c.dCd=1.2+w.rnd()*.5;c.dashT=Math.min(.22,(d+1.4)/DASHV);c.ddx=dx/d;c.ddz=dz/d;ev(w,'botdash',{id:c.id,x:c.x,z:c.z});
  return true;
}
function steer(w,c,tx,tz,dt,sp){
  if(w.freezeT>0){c.vx=c.vz=0;return null;}
  let dx=tx-c.x,dz=tz-c.z;const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;
  if(c.detT>0){c.detT-=dt;dx=c.detX;dz=c.detZ;}
  c.vx=dx*sp;c.vz=dz*sp;c.fx=dx;c.fz=dz;
  if(c.dashT>0){c.dashT-=dt;c.vx=c.ddx*DASHV;c.vz=c.ddz*DASHV;}
  c.x+=c.vx*dt;c.z+=c.vz*dt;
  c.stT=(c.stT||0)+dt;
  if(c.stT>.6){const mv=Math.hypot(c.x-(c.stx===undefined?c.x:c.stx),c.z-(c.stz===undefined?c.z:c.stz));
    if(mv<sp*.6*.3&&d>3&&c.detT<=0&&sp>2){const sg=w.rnd()<.5?1:-1;c.detT=.9;c.detX=-dz*sg;c.detZ=dx*sg;}
    c.stx=c.x;c.stz=c.z;c.stT=0;}
  const hit=pushOut(w.M,c,CR,-1e9,false);
  if(hit&&c.detT<=0&&(dx*hit.nx+dz*hit.nz)<-.55){
    const s=(-hit.nz*dx+hit.nx*dz)>=0?1:-1;
    c.detX=-hit.nz*s;c.detZ=hit.nx*s;c.detT=1;
  }
  return hit;
}

function endLunge(w,c,crash){
  const P=w.P,m=c.minD;
  if(m<5){
    const R=c.rec||{};
    let base=['Dodge',60],dmg=15;
    if(m<2.4){base=['Ankle breaker',300];dmg=60;}else if(m<3.4){base=['Clean juke',150];dmg=35;}
    const items=[base];
    if(R.dash)items.push(['Dash juke',100]);
    if(R.air)items.push(['Hurdle',150]);
    if(R.spin>=2.4)items.push(['Spin move',200]);
    if(R.back&&m<3.4)items.push(['No look',250]);
    if(R.spd>=24)items.push(['Full speed',100]);
    const baited=w.t-c.tauntedAt<5;
    if(baited){items.push(['Ragebait',150]);dmg+=20;}
    if(crash)items.push(['Wall pancake',250]);
    w.stats.jukes++;if(m<2.4)w.stats.ankles++;
    award(w,crash?'pancake':m<2.4?'ankle':'juke',items,c.x,c.z,{id:c.id,name:c.name,baited,air:!!R.air,dash:!!R.dash,spin:R.spin>=2.4,back:!!R.back&&m<3.4,close:m});
    addRage(w,c,baited?55:30);
    if(c.state==='lunge'){c.state=(crash||m<3.4)?(crash?'crash':'trip'):'recover';c.t=0;c.lungeCd=1.3;}
    egoHit(w,c,dmg);
  }else if(c.state==='lunge'){
    c.state=crash?'crash':'recover';c.t=0;c.lungeCd=1.3;
  }
  if(crash&&c.state==='lunge')c.state='crash';
}

function stepChaser(w,c,dt){
  const P=w.P;c.t+=dt;c.lungeCd=Math.max(0,c.lungeCd-dt);c.cutCd=Math.max(0,c.cutCd-dt);
  const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz)||1e-6,nx=dx/d,nz=dz/d;
  const live=w.state==='play',it=w.phase==='it';
  switch(c.state){
    case'chase':{
      if(it){c.state='flee';c.t=0;break;}
      c.rage=Math.max(0,c.rage-2*dt);
      const tr=c.rage>=75?2:c.rage>=40?1:0;if(tr<c.tier)c.tier=tr;
      let tx=P.x,tz=P.z;
      if(c.kind==='pack'&&d>16){tx+=-nz*14*c.flank;tz+=nx*14*c.flank;}
      const sp=c.speed*(1+c.rage*.004)*(1+Math.min(.15,w.roundT*.0025));
      steer(w,c,tx,tz,dt,sp);
      if(live){
        if(d<1.7&&tagPlayer(w,c))break;
        const range=c.rage>=70?16:12;
        if(c.lungeCd<=0&&d<range&&d>2.5){c.state='windup';c.t=0;c.vx=c.vz=0;ev(w,'windup',{id:c.id,x:c.x,z:c.z});}
      }
      break;}
    case'windup':{
      c.fx=nx;c.fz=nz;
      if(live&&d<1.7&&tagPlayer(w,c))break;
      if(c.t>=c.wind*(1-c.rage*.003)){
        const lead=c.rage>=70?0:c.lead;
        let ax=P.x+P.vx*lead-c.x,az=P.z+P.vz*lead-c.z;const al=Math.hypot(ax,az)||1;
        c.lx=ax/al;c.lz=az/al;c.state='lunge';c.t=0;c.minD=d;c.rec=null;
        ev(w,'lunge',{id:c.id,x:c.x,z:c.z});
      }
      break;}
    case'lunge':{
      const sp=50+c.rage*.05;c.vx=c.lx*sp;c.vz=c.lz*sp;c.fx=c.lx;c.fz=c.lz;
      c.x+=c.vx*dt;c.z+=c.vz*dt;
      const hit=pushOut(w.M,c,CR,-1e9,false);
      const d2=Math.hypot(P.x-c.x,P.z-c.z);
      if(d2<c.minD){
        c.minD=d2;
        const bx=(c.x-P.x)/(d2||1),bz=(c.z-P.z)/(d2||1),fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
        c.rec={dash:P.dashT>0,air:P.y>1,spin:P.spinAcc,back:(fx*bx+fz*bz)<-.6,spd:P.spd};
      }
      if(live&&d2<1.7&&tagPlayer(w,c))break;
      if(hit)endLunge(w,c,true);else if(c.t>=.5+c.rage*.001)endLunge(w,c,false);
      break;}
    case'recover':c.vx*=.9;c.vz*=.9;if(c.t>=.6)resume(w,c);break;
    case'trip':c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.05,dt);c.vz*=Math.pow(.05,dt);pushOut(w.M,c,CR,-1e9,false);if(c.t>=1.8){resume(w,c);c.lungeCd=1.5;}break;
    case'crash':if(c.t>=1.6){resume(w,c);c.lungeCd=1.5;}break;
    case'tumble':c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.1,dt);c.vz*=Math.pow(.1,dt);pushOut(w.M,c,CR,-1e9,false);if(c.t>=2){resume(w,c);c.lungeCd=1.5;}break;
    case'dance':if(c.t>=1.4){resume(w,c);c.lungeCd=2;}break;
    case'flee':{
      if(!it){c.state='chase';c.t=0;c.lungeCd=2.5;break;}
      const away=-1;let sp=c.speed*.95;
      if(c.cutT>0){
        c.cutT-=dt;
        c.vx=c.cutX*c.speed*1.9;c.vz=c.cutZ*c.speed*1.9;c.x+=c.vx*dt;c.z+=c.vz*dt;c.fx=c.cutX;c.fz=c.cutZ;pushOut(w.M,c,CR,-1e9,false);
      }else{
        const clos=(P.vx*-nx+P.vz*-nz)>0?0:0;
        const closing=(P.vx*nx+P.vz*nz)>7;
        if(c.cutCd<=0&&d<9&&d>2.4&&closing){
          const s=w.rnd()<.5?1:-1;c.cutX=-nz*s;c.cutZ=nx*s;c.cutT=.4;c.cutCd=2;
          ev(w,'botjuke',{id:c.id,name:c.name,x:c.x,z:c.z,d});
        }
        steer(w,c,c.x-nx*40,c.z-nz*40,dt,sp);
      }
      break;}
    case'shame':{
      steer(w,c,c.x-nx*40,c.z-nz*40,dt,13);
      if(c.t>=3){c.dead=true;ev(w,'gone',{id:c.id});}
      break;}
    case'quit':c.y+=c.vy*dt;c.x+=c.vx*dt;c.z+=c.vz*dt;if(c.t>=1.5)c.dead=true;break;
  }
}

function tauntEffect(w){
  const P=w.P,hit=[],fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
  for(const c of w.C){
    if(c.state==='quit'||c.state==='shame')continue;
    const dx=c.x-P.x,dz=c.z-P.z,d=Math.hypot(dx,dz);
    if(d<70&&(d<14||(fx*dx+fz*dz)/(d||1)>.2)){c.tauntedAt=w.t;hit.push(c.id);}
  }
  ev(w,'taunt',{x:P.x,z:P.z,hit});
  for(const c of w.C)if(hit.indexOf(c.id)>=0)addRage(w,c,28);
}

function stepPlayer(w,dt,inp){
  const P=w.P,M=w.M;
  if(P.stunT>0){P.stunT-=dt;inp=Object.assign({},inp,{mx:0,mz:0,jump:false,dash:false,sprint:false,taunt:false});}
  P.inv=Math.max(0,P.inv-dt);P.dashCd=Math.max(0,P.dashCd-dt);P.tauntCd=Math.max(0,P.tauntCd-dt);
  P.tauntT=Math.max(0,P.tauntT-dt);P.boostT=Math.max(0,P.boostT-dt);
  const dyaw=wrapPi((inp.yaw||0)-P.yaw);P.yaw=inp.yaw||0;
  P.spinAcc=P.spinAcc*Math.exp(-dt/.5)+Math.abs(dyaw);
  const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  let wx=fx*(inp.mz||0)+rx*(inp.mx||0),wz=fz*(inp.mz||0)+rz*(inp.mx||0);
  const wl=Math.hypot(wx,wz);if(wl>1){wx/=wl;wz/=wl;}
  const moving=wl>.1;
  P.sprinting=!!(inp.sprint&&moving&&!P.exhausted&&P.stamina>0);
  if(P.sprinting){P.stamina=Math.max(0,P.stamina-dt*.13);P.regen=.8;if(P.stamina<=0)P.exhausted=true;}
  else{if(P.regen>0)P.regen-=dt;else P.stamina=Math.min(1,P.stamina+dt*.4);if(P.exhausted&&P.stamina>.3)P.exhausted=false;}
  let sp=P.sprinting?SPRINT:RUN;
  if(P.boostT>0)sp=BOOST;
  if(P.hasteT>0)sp*=1.35;
  if(w.mode==='rlgl'){sp=Math.min(sp,24);inp.dash=false;}
  if(P.tauntT>0)sp*=.6;
  if(inp.dash&&P.dashCd<=0&&P.dashT<=0){
    let dx=moving?wx:fx,dz=moving?wz:fz;const dl=Math.hypot(dx,dz)||1;
    P.dashX=dx/dl;P.dashZ=dz/dl;P.dashT=.22;P.dashCd=1.2;P.inv=Math.max(P.inv,.35);
    ev(w,'dash',{x:P.x,z:P.z});
  }
  if(P.dashT>0){P.dashT-=dt;P.vx=P.dashX*DASHV;P.vz=P.dashZ*DASHV;}
  else{const k=P.ground?13:2.4,f=Math.min(1,k*dt);P.vx+=(wx*sp-P.vx)*f;P.vz+=(wz*sp-P.vz)*f;}
  if(inp.jump&&P.ground){P.vy=JUMPV;P.ground=false;ev(w,'jump',{x:P.x,z:P.z});}
  P.x+=P.vx*dt;P.z+=P.vz*dt;
  pushOut(M,P,PR,P.y,true);
  const gh=supportH(M,P.x,P.z,P.y);
  P.vy-=GRAV*dt;P.y+=P.vy*dt;
  if(P.y<=gh){if(P.vy<-8)ev(w,'land',{x:P.x,z:P.z,v:-P.vy});P.y=gh;if(P.vy<0)P.vy=0;P.ground=true;}else P.ground=P.y<=gh+.02;
  P.spd=Math.hypot(P.vx,P.vz);
  if(w.orbs&&w.orbs.length)stepOrbs(w,dt);
  for(const pd of M.pads){
    if(Math.abs(pd.x-P.x)<pd.r&&Math.abs(pd.z-P.z)<pd.r&&P.boostT<.6&&P.y<1.5){P.boostT=1.8;ev(w,'boost',{x:pd.x,z:pd.z});}
  }
  if(inp.taunt&&P.tauntCd<=0&&P.dashT<=0&&['hoops','sus','hide','park','rlgl','dodge','koth','seek','sumo','ctf','frz','inf','aura','tshot','laser','tiles','gun','zomb','br','range'].indexOf(w.mode)<0){P.tauntCd=2;P.tauntT=.4;P.lastTaunt=w.t;tauntEffect(w);}
  if(P.dashT>0&&w.mode!=='sus'&&w.mode!=='laser'&&w.mode!=='range'){
    for(const c of w.C){
      if(['trip','crash','tumble','shame','quit','dance'].indexOf(c.state)>=0)continue;
      if(Math.hypot(c.x-P.x,c.z-P.z)<2.6){
        c.state='tumble';c.t=0;c.vx=P.dashX*14;c.vz=P.dashZ*14;
        const items=[['Bump',150]];if(w.t-c.tauntedAt<5)items.push(['Ragebait',150]);
        w.stats.bumps++;ev(w,'bump',{id:c.id,x:c.x,z:c.z});
        award(w,'bump',items,c.x,c.z,{id:c.id,name:c.name});
        egoHit(w,c,25);
      }
    }
  }
}

function jumpOvers(w,dt){
  const P=w.P;
  if(w.state!=='play')return;
  for(const c of w.C){
    if(c.alive===false||['quit','dance'].indexOf(c.state)>=0)continue;
    c.hurdT=Math.max(0,(c.hurdT||0)-dt);
    const d=Math.hypot(c.x-P.x,c.z-P.z);
    if(d>1.8)continue;
    if(P.y>1.0&&!P.ground&&c.hurdT<=0&&(c.y||0)<.8){
      c.hurdT=5;P.inv=Math.max(P.inv,1);
      award(w,'hurdle',[['Hurdle',220]].concat(P.dashT>0?[['Dash over',120]]:[]),c.x,c.z,{id:c.id,name:c.name});
      ev(w,'hurdle',{id:c.id,x:c.x,z:c.z});
      if(w.mode==='solo')egoHit(w,c,22);
    }
    if(P.vy<-2&&P.y<1.75&&P.y>.9&&d<1.15&&(c.stompT||0)<=0&&(c.y||0)<.8){
      c.stompT=4;P.vy=12;P.y=1.8;P.inv=Math.max(P.inv,1.3);
      {const sx=c.x-P.x,sz=c.z-P.z,sl=Math.hypot(sx,sz)||1;
      if(w.mode==='solo'){c.state='trip';c.t=0;c.vx=sx/sl*9;c.vz=sz/sl*9;}
      else if(w.mode!=='sumo'&&w.mode!=='ctf'){c.state='tumble';c.t=0;c.vx=sx/sl*9;c.vz=sz/sl*9;}}
      award(w,'stomp',[['Stomp',400]],c.x,c.z,{id:c.id,name:c.name});
      ev(w,'stomp',{id:c.id,x:c.x,z:c.z});
    }
    if(c.stompT>0)c.stompT-=dt;
  }
}
const STOMP_MODES=['ffa','bomb','koth','sumo','tiles','hoops','aura','ctf'];
function botStomp(w,dt){
  const P=w.P;
  const ents=[P].concat(w.C.filter(c=>c.alive!==false));
  for(const c of w.C){
    if(c.alive===false||c.hop)continue;
    if(c.leap){
      const L=c.leap;L.t+=dt;const k=Math.min(1,L.t/L.T);
      c.x=L.sx+(L.tx-L.sx)*k;c.z=L.sz+(L.tz-L.sz)*k;c.y=Math.sin(k*Math.PI)*3.4;
      if(k>=1){
        c.leap=null;c.y=0;
        for(const e of ents){
          if(e===c)continue;
          if(Math.hypot(e.x-c.x,e.z-c.z)>1.8||(e.y||0)>.9)continue;
          if(e===P){
            if(P.inv>0||P.dashT>0)continue;
            const l=Math.hypot(P.x-c.x,P.z-c.z)||1;
            P.stunT=1;P.inv=Math.max(P.inv,1.2);P.vx+=(P.x-c.x)/l*12;P.vz+=(P.z-c.z)/l*12;w.combo=0;
            ev(w,'stomped',{x:P.x,z:P.z,by:c.name,you:true});
          }else{
            const l=Math.hypot(e.x-c.x,e.z-c.z)||1;
            e.state='tumble';e.t=0;e.vx=(e.x-c.x)/l*12;e.vz=(e.z-c.z)/l*12;e.kx=(e.kx||0)+(e.x-c.x)/l*10;e.kz=(e.kz||0)+(e.z-c.z)/l*10;
            ev(w,'stomped',{x:e.x,z:e.z,by:c.name,you:false});
          }
          break;
        }
      }
      continue;
    }
    c.sCd=(c.sCd===undefined?2+w.rnd()*5:c.sCd)-dt;
    if(c.sCd>0)continue;
    if(['tumble','quit','trip','calm','dance','crash','shame'].indexOf(c.state)>=0||c.dashT>0||c.stun>0||c.down>0)continue;
    let tg=null,td=8;
    for(const e of ents){if(e===c||(e.y||0)>.5)continue;if(e.alive===false)continue;const d=Math.hypot(e.x-c.x,e.z-c.z);if(d>3&&d<td){td=d;tg=e;}}
    if(!tg){c.sCd=.5;continue;}
    c.sCd=6+w.rnd()*6;
    const tx=tg.x+(tg.vx||0)*.35,tz=tg.z+(tg.vz||0)*.35;
    c.leap={t:0,T:.5+td/40,sx:c.x,sz:c.z,tx,tz};
    ev(w,'botleap',{x:c.x,z:c.z});
  }
}
function update(w,dt,inp){
  update0(w,dt,inp);
  if(w.state==='play'&&STOMP_MODES.indexOf(w.mode)>=0)botStomp(w,dt);
  if(w.state==='play'&&w.mode!=='solo'&&['sus','uno','park','rlgl','dodge'].indexOf(w.mode)<0)botEvade(w,dt);
  if(w.P&&w.C&&w.mode!=='park'&&w.mode!=='uno')jumpOvers(w,dt);
}
function update0(w,dt,inp){
  if(w.mode!=='solo'){
    if(w.state==='dead'){w.deadT+=dt;return;}
    w.t+=dt;stepPlayer(w,dt,inp);
    if(w.P.imm===undefined)w.P.imm=0;
    if(w.mode==='hoops')hoopsUpdate(w,dt,inp);else if(w.mode==='sus')susUpdate(w,dt,inp);else if(w.mode==='hide')hideUpdate(w,dt);else if(w.mode==='park')parkUpdate(w,dt);else if(w.mode==='rlgl')rlglUpdate(w,dt);else if(w.mode==='dodge')dodgeUpdate(w,dt,inp);else if(w.mode==='koth')kothUpdate(w,dt);else if(w.mode==='seek')seekUpdate(w,dt);else if(w.mode==='sumo')sumoUpdate(w,dt);else if(w.mode==='inf')infUpdate(w,dt);else if(w.mode==='laser')laserUpdate(w,dt,inp);else if(w.mode==='gun')gunUpdate(w,dt,inp);else if(w.mode==='zomb')zombUpdate(w,dt,inp);else if(w.mode==='br')brUpdate(w,dt,inp);else if(w.mode==='range')rangeUpdate(w,dt,inp);else if(w.mode==='tiles')tilesUpdate(w,dt);else if(w.mode==='aura'){if(inp&&inp.taunt)w._poseReq=true;auraUpdate(w,dt);}else if(w.mode==='tshot')tshotUpdate(w,dt,inp);else if(w.mode==='frz')frzUpdate(w,dt);else if(w.mode==='ctf')ctfUpdate(w,dt);else tagUpdate(w,dt);
    return;
  }
  if(w.state==='dead'){w.deadT+=dt;for(const c of w.C.slice())stepChaser(w,c,dt);w.C=w.C.filter(c=>!c.dead);return;}
  w.t+=dt;w.roundT+=dt;
  stepPlayer(w,dt,inp);
  for(const c of w.C.slice()){if(w.freezeT>0&&['chase','windup','lunge','flee'].indexOf(c.state)>=0){c.vx=c.vz=0;continue;}stepChaser(w,c,dt);}
  if(w.phase==='it'&&w.state==='play'){
    w.itT-=dt;
    const P=w.P;let best=null,bd=1e9;
    for(const c of w.C){if(c.state==='shame'||c.state==='quit'||c.state==='dance'||w.t<(c.immune||0))continue;const d=Math.hypot(c.x-P.x,c.z-P.z);if(d<bd){bd=d;best=c;}}
    if(best&&bd<2.6)tagBack(w,best);
    else if(!best)w.phase='run';
    else if(w.itT<=0)itFail(w);
  }
  for(const q of w.spawnQ)q.t-=dt;
  while(w.spawnQ.length&&w.spawnQ[0].t<=0){const q=w.spawnQ.shift();spawnChaser(w,q.kind);}
  w.C=w.C.filter(c=>!c.dead);
  if(w.comboT>0){w.comboT-=dt;if(w.comboT<=0)w.combo=0;}
  if(w.roundT>45&&w.roundT-w.lastExtra>15&&w.C.length+w.spawnQ.length<10&&!w.clearing){w.lastExtra=w.roundT;w.spawnQ.push({t:0,kind:'rusher'});ev(w,'extra',{});}
  if(w.round>0&&!w.clearing&&!w.spawnQ.length&&w.C.length===0&&w.state==='play'&&w.phase==='run'){
    w.clearing=true;w.clearT=3;
    const bonus=300*w.round;w.score+=bonus;w.P.hp=Math.min(3,w.P.hp+1);
    ev(w,'clear',{bonus,round:w.round,hp:w.P.hp});
  }
  if(w.clearing){w.clearT-=dt;if(w.clearT<=0){w.clearing=false;startRound(w);}}
}

/* ----- tag modes: ffa + bomb ----- */
function holderEnt(w){return w.holder==='p'?w.P:w.C.find(c=>c.id===w.holder);}
function startTagMatch(w){
  const n=w.mode==='bomb'?7:8;
  for(let i=0;i<n;i++){const c=spawnChaser(w,'rusher');c.alive=true;c.pts=0;c.imm=0;c.speed=21+w.rnd()*3;c.wpT=0;}
  w.P.imm=0;w.passes=0;w.matchT=w.mode==='ffa'?120:0;
  w.holder=w.C[Math.floor(w.rnd()*w.C.length)].id;w.fuse=w.mode==='bomb'?14:0;
  ev(w,'tagstart',{mode:w.mode,holder:w.holder});
}
function passTag(w,from,to){
  const fp=from===w.P;
  w.holder=fp?'p':from.id;w.holder=to===w.P?'p':to.id;
  from.imm=to.imm=w.t+1.6;w.passes++;w.lastPasser=fp?'p':from.id;
  if(fp){w.stats.tags++;if(w.mode==='ffa')w.score+=250;}
  else if(from.pts!==undefined)from.pts+=300;
  ev(w,'tagpass',{from:fp?'p':from.id,to:to===w.P?'p':to.id,x:to.x,z:to.z,name:to.name});
}
function killBot(w,c,byPlayer,why){
  if(c.alive===false)return;
  c.alive=false;c.state='quit';c.t=0;c.vy=14;c.vx=c.vz=0;
  w.stats.quits++;
  ev(w,'boomkill',{id:c.id,name:c.name,x:c.x,z:c.z,why});
  if(byPlayer)award(w,'boomkill',[[c.name+' blew up',500]],c.x,c.z,{id:c.id,name:c.name});
}
function nextHolder(w){
  const alive=w.C.filter(c=>c.alive!==false);
  if(!alive.length&&w.state==='play'){w.won=true;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});return;}
  const pool=alive.map(c=>c.id).concat(w.state==='play'?['p']:[]);
  w.holder=pool[Math.floor(w.rnd()*pool.length)];w.fuse=14;w.passes=0;
}
function boom(w){
  const h=holderEnt(w);if(!h)return;
  const hp=w.holder==='p',lastP=w.lastPasser==='p';
  ev(w,'boom',{id:w.holder,x:h.x,z:h.z});
  for(const c of w.C){
    if(c.alive===false||c===h)continue;
    if(Math.hypot(c.x-h.x,c.z-h.z)<7)killBot(w,c,true,'splash');
  }
  if(hp){w.state='dead';w.deadT=0;ev(w,'dead',{});return;}
  killBot(w,h,lastP,'fuse');
  if(Math.hypot(w.P.x-h.x,w.P.z-h.z)<7&&w.P.dashT<=0){w.state='dead';w.deadT=0;ev(w,'dead',{splash:true});return;}
  nextHolder(w);
}
function tagUpdate(w,dt){
  const P=w.P,hold=holderEnt(w);
  const ents=[{id:'p',x:P.x,z:P.z,e:P}].concat(w.C.filter(c=>c.alive!==false).map(c=>({id:c.id,x:c.x,z:c.z,e:c})));
  for(const c of w.C){
    if(c.state==='quit'){c.y+=c.vy*dt;c.vy-=0;c.x+=c.vx*dt;c.z+=c.vz*dt;c.t+=dt;if(c.t>1.5)c.dead=true;continue;}
    if(c.alive===false)continue;
    c.t+=dt;
    if(w.holder===c.id){
      c.state='chase';
      let best=null,bd=1e9;
      for(const o of ents){if(o.id===c.id||w.t<(o.e.imm||0))continue;const d=Math.hypot(o.x-c.x,o.z-c.z);if(d<bd){bd=d;best=o;}}
      if(best){
        const lp=leadPt(w,c,{x:best.x,z:best.z,vx:best.id==='p'?P.vx:best.e.vx,vz:best.id==='p'?P.vz:best.e.vz},c.speed),tx=lp[0],tz=lp[1];
        if(!c.dashT&&Math.abs((best.e.y||0)-(c.y||0))<2)botDash(w,c,dt,tx,tz,5,12);
        steer(w,c,tx,tz,dt,c.speed*1.07);
        if(bd<1.7&&w.t>=(c.imm||0))passTag(w,c,best.e);
      }
    }else{
      c.state='flee';
      const hd=hold?Math.hypot(hold.x-c.x,hold.z-c.z):999;
      if(hd<42&&hold){const ft=fleeTarget(w,c,hold.x,hold.z,dt);if(hd<9)botDash(w,c,dt,ft[0],ft[1],1,99);steer(w,c,ft[0],ft[1],dt,c.speed);}
      else{
        c.wpT-=dt;if(c.wpT<=0||Math.hypot(c.detX,c.detZ)<0){c.wpT=4+w.rnd()*4;c.wx=(w.rnd()-.5)*500;c.wz=(w.rnd()-.5)*500;}
        steer(w,c,c.wx,c.wz,dt,c.speed*.6);
        if(w.mode==='ffa')c.pts+=dt*5;
      }
    }
  }
  if(w.holder==='p'&&w.state==='play'){
    let best=null,bd=1e9;
    for(const c of w.C){if(c.alive===false||w.t<(c.imm||0))continue;const d=Math.hypot(c.x-P.x,c.z-P.z);if(d<bd){bd=d;best=c;}}
    if(best&&bd<2.6&&w.t>=(P.imm||0))passTag(w,P,best);
  }else if(w.state==='play'){w.itSafe=(w.itSafe||0)+dt;if(w.mode==='ffa')w.score+=dt*5;}
  if(w.mode==='bomb'&&w.state==='play'){w.fuse-=dt;if(w.fuse<=0)boom(w);}
  if(w.mode==='ffa'&&w.state==='play'){
    w.matchT-=dt;
    if(w.matchT<=0){
      const bestBot=w.C.reduce((a,c)=>Math.max(a,c.pts||0),0);
      w.won=w.score>=bestBot;w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});
    }
  }
  w.C=w.C.filter(c=>!c.dead);
}

/* ----- shared flat arenas ----- */
function gridify(M){
  const g=new Array(GN*GN);for(let i=0;i<g.length;i++)g[i]=[];
  const put=(o,x0,x1,z0,z1)=>{const a=cellIdx(x0),b=cellIdx(x1),c=cellIdx(z0),d=cellIdx(z1);for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)g[i*GN+j].push(o);};
  M.boxes.forEach(o=>{o.t=0;put(o,o.x-o.hx,o.x+o.hx,o.z-o.hz,o.z+o.hz);});
  M.cyls.forEach(o=>{o.t=1;put(o,o.x-o.r,o.x+o.r,o.z-o.r,o.z+o.r);});
  M.grid=g;return M;
}
function genFlat(){return gridify({boxes:[],cyls:[],pads:[],cells:[],grid:null});}
function genDodge(){
  const boxes=[],S=32;
  boxes.push({x:0,z:-S,hx:S+1,hz:1,h:7,kind:'wall'},{x:0,z:S,hx:S+1,hz:1,h:7,kind:'wall'},{x:-S,z:0,hx:1,hz:S+1,h:7,kind:'wall'},{x:S,z:0,hx:1,hz:S+1,h:7,kind:'wall'});
  [[-12,-12],[12,-12],[-12,12],[12,12]].forEach(p=>boxes.push({x:p[0],z:p[1],hx:1.6,hz:1.6,h:4,kind:'pillar'}));
  return gridify({boxes,cyls:[],pads:[],cells:[],grid:null});
}
/* ----- red light green light ----- */
function startRlgl(w){
  w.P.x=0;w.P.z=270;w.P.yaw=0;
  for(let i=0;i<10;i++){
    const c=spawnChaser(w,['rusher','reader','sprinter','pack'][i%4]);
    c.x=(i-4.5)*9;c.z=272+w.rnd()*8;c.alive=true;c.speed=14+w.rnd()*8;c.stopP=.78+w.rnd()*.2;c.react=.15+w.rnd()*.45;c.rt=0;c.dec=false;c.fin=false;c.vx=c.vz=0;
  }
  w.rl={light:'green',t:3.5,warn:false,clock:75,grace:0,finish:-250,place:0};
  ev(w,'rlstart',{});
}
function rlglUpdate(w,dt){
  const R=w.rl,P=w.P;
  R.clock-=dt;R.t-=dt;
  if(R.light==='green'&&R.t<=.6&&!R.warn){R.warn=true;ev(w,'rlwarn',{});}
  if(R.t<=0){
    if(R.light==='green'){R.light='red';R.t=1.8+w.rnd()*2.2;R.warn=false;R.grace=.35;ev(w,'rlred',{});for(const c of w.C){c.rt=c.react;c.dec=false;}}
    else{R.light='green';R.t=2.5+w.rnd()*3;ev(w,'rlgreen',{});for(const c of w.C)c.dec=false;}
  }
  if(R.light==='red'){
    R.grace=Math.max(0,R.grace-dt);
    if(R.grace<=0&&P.spd>3&&w.state==='play'){
      w.won=false;w.state='dead';w.deadT=0;ev(w,'rlcaught',{x:P.x,z:P.z});ev(w,'dead',{});return;
    }
  }
  for(const c of w.C){
    if(c.state==='quit'){c.y+=c.vy*dt;c.t+=dt;if(c.t>1.5)c.dead=true;continue;}
    if(c.alive===false||c.fin)continue;
    if(R.light==='red'){
      c.rt-=dt;
      if(c.rt<=0&&!c.dec){
        c.dec=true;
        if(w.rnd()>c.stopP){
          c.alive=false;c.state='quit';c.t=0;c.vy=12;c.vx=c.vz=0;ev(w,'rleliminate',{id:c.id,x:c.x,z:c.z});continue;
        }
      }
      if(c.dec){c.vx=c.vz=0;c.state='calm';continue;}
    }
    c.state='chase';steer(w,c,c.x,-HALF+20,dt,c.speed);
    if(c.z<=R.finish){c.fin=true;c.vx=c.vz=0;c.state='dance';R.place++;c.place=R.place;ev(w,'rlfinish',{id:c.id,place:R.place});}
  }
  w.C=w.C.filter(c=>!c.dead);
  if(P.z<=R.finish&&w.state==='play'){
    R.place++;w.score=1000+Math.round(R.clock*40)+Math.max(0,(11-R.place))*100;
    w.won=true;w.state='dead';w.deadT=0;ev(w,'dead',{won:true,place:R.place});return;
  }
  if(R.clock<=0&&w.state==='play'){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{});}
}

/* ----- dodgeball ----- */
function startDodge(w){
  const P=w.P;P.x=0;P.z=24;P.yaw=0;P.hp=3;P.hold=0;P.thCd=0;
  for(let i=0;i<3;i++){
    const c=spawnChaser(w,['rusher','reader','sprinter'][i]);
    c.x=(i-1)*14;c.z=-24;c.alive=true;c.hp=2;c.speed=15;c.hold=1;c.thT=1.6+w.rnd()*1.2;c.sideT=0;c.sideDir=1;c.vx=c.vz=0;
  }
  w.balls=[];
  [[-8,2],[8,-2],[-16,0],[16,0],[0,6],[0,-6]].forEach(p=>w.balls.push({x:p[0],y:.4,z:p[1],vx:0,vy:0,vz:0,own:null,rest:true}));
  w.dg={hits:0};
  ev(w,'dgstart',{});
}
function dgThrow(w,e,isP,dx,dy,dz,sp){
  const l=Math.hypot(dx,dy,dz)||1;
  w.balls.push({x:e.x,y:(e.y||0)+1.5,z:e.z,vx:dx/l*sp,vy:dy/l*sp,vz:dz/l*sp,own:isP?'p':e.id,rest:false,life:0});
  e.hold=0;
  ev(w,'dgthrow',{by:isP?'p':e.id,x:e.x,z:e.z});
}
function dodgeUpdate(w,dt,inp){
  const P=w.P;
  P.thCd=Math.max(0,P.thCd-dt);
  if(inp&&inp.taunt&&P.hold&&P.thCd<=0){
    const pc=Math.cos(inp.pitch||0);
    dgThrow(w,P,true,-Math.sin(P.yaw)*pc,Math.sin(inp.pitch||0)+.04,-Math.cos(P.yaw)*pc,36);
    P.thCd=.3;
  }
  // bots
  for(const c of w.C){
    if(c.state==='quit'){c.y+=c.vy*dt;c.t+=dt;if(c.t>1.5)c.dead=true;continue;}
    if(c.alive===false)continue;
    const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz)||1;
    c.fx=dx/d;c.fz=dz/d;
    // sidestep incoming balls
    c.sideT-=dt;
    if(c.sideT<=0){
      for(const b of w.balls){
        if(b.rest||b.own!=='p')continue;
        const bx=c.x-b.x,bz=c.z-b.z,bd=Math.hypot(bx,bz),sp=Math.hypot(b.vx,b.vz)||1;
        if(bd<10&&(bx*b.vx+bz*b.vz)/(bd*sp)>.9&&w.rnd()<.25){c.sideT=.28;c.sideDir=w.rnd()<.5?1:-1;break;}
      }
    }
    if(c.sideT>0){
      const nx=-c.fz*c.sideDir,nz=c.fx*c.sideDir;
      c.vx=nx*16;c.vz=nz*16;c.x+=c.vx*dt;c.z+=c.vz*dt;pushOut(w.M,c,CR,-1e9,false);continue;
    }
    if(c.hold){
      c.thT-=dt;
      // keep distance 14-26
      const want=d>26?1:d<14?-1:0;
      if(want){c.vx=c.fx*want*c.speed;c.vz=c.fz*want*c.speed;c.x+=c.vx*dt;c.z+=c.vz*dt;pushOut(w.M,c,CR,-1e9,false);}
      else{c.vx=c.vz=0;}
      c.state=c.thT<.45?'windup':'chase';
      if(c.thT<=0){
        const sp=27,T=d/sp,lead=.35,ns=5+d*.2;
        const tx=P.x+P.vx*T*lead+(w.rnd()-.5)*ns,tz=P.z+P.vz*T*lead+(w.rnd()-.5)*ns;
        dgThrow(w,c,false,tx-c.x,(P.y+1.1)-(c.y+1.5)+.5*12*T*T/ (1) *0+ (12*T*.5)*T*0,tz-c.z,sp);
        // compensate gravity: raise aim by drop over flight
        const b=w.balls[w.balls.length-1];b.vy+=12*T*.5;
        c.thT=2.8+w.rnd()*2.2;c.state='chase';
      }
    }else{
      // fetch nearest resting ball
      let nb=null,bd=1e9;for(const b of w.balls){if(!b.rest)continue;const q=Math.hypot(b.x-c.x,b.z-c.z);if(q<bd){bd=q;nb=b;}}
      c.state='chase';
      if(nb){botDash(w,c,dt,nb.x,nb.z,7,18);steer(w,c,nb.x,nb.z,dt,c.speed*.95);}
      if(nb&&bd<1.8){c.hold=1;nb.dead=true;c.thT=1.6+w.rnd()*1.2;}
    }
  }
  // balls
  for(const b of w.balls){
    if(b.dead)continue;
    if(b.rest){
      if(P.hold===0&&Math.hypot(b.x-P.x,b.z-P.z)<2){P.hold=1;b.dead=true;ev(w,'dgpickup',{});}
      continue;
    }
    b.life+=dt;b.vy-=12*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    if(b.y<.4){b.y=.4;b.vy=-b.vy*.45;b.vx*=.8;b.vz*=.8;}
    const c0=contact(w.M,b.x,b.z,.3,b.y-.3);
    if(c0){
      b.x+=c0.nx*c0.pen;b.z+=c0.nz*c0.pen;
      const vn=b.vx*c0.nx+b.vz*c0.nz;if(vn<0){b.vx-=1.6*vn*c0.nx;b.vz-=1.6*vn*c0.nz;}
    }
    if(b.own!=='p'&&P.inv<=0&&P.dashT<=0&&w.state==='play'){
      if(Math.hypot(b.x-P.x,b.z-P.z)<.95&&b.y>P.y-.2&&b.y<P.y+1.9){
        P.hp--;P.inv=1;b.rest=true;b.vx=b.vz=0;b.vy=0;b.own=null;b.y=.4;
        ev(w,'dghit',{hp:P.hp,x:P.x,z:P.z});
        if(P.hp<=0){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{});return;}
      }
    }
    if(b.own==='p'){
      for(const c of w.C){
        if(c.alive===false||c.state==='quit')continue;
        if(Math.hypot(b.x-c.x,b.z-c.z)<1.1&&b.y<(c.y||0)+2.2){
          c.hp--;w.dg.hits++;w.score+=300;b.rest=true;b.vx=b.vz=b.vy=0;b.own=null;b.y=.4;
          ev(w,'dgbot',{id:c.id,x:c.x,z:c.z,hp:c.hp});
          if(c.hp<=0){c.alive=false;c.state='quit';c.t=0;c.vy=12;c.vx=c.vz=0;w.score+=300;ev(w,'dgout',{id:c.id,x:c.x,z:c.z});}
          break;
        }
      }
    }
    if(!b.rest&&b.life>0.2&&Math.hypot(b.vx,b.vz)<2&&b.y<=.45){b.rest=true;b.own=null;b.vx=b.vz=0;}
    if(!b.rest&&b.life>6){b.rest=true;b.own=null;b.vx=b.vz=b.vy=0;b.y=.4;}
  }
  w.balls=w.balls.filter(b=>!b.dead);
  w.C=w.C.filter(c=>!c.dead);
  if(w.state==='play'&&w.C.every(c=>c.alive===false)){
    w.score+=P.hp*300+1000;w.won=true;w.state='dead';w.deadT=0;ev(w,'dead',{won:true});
  }
}

/* ----- king of the hill ----- */
function kothZone(w){
  for(let k=0;k<30;k++){
    const x=(w.rnd()-.5)*440,z=(w.rnd()-.5)*440;
    const q=freeSpot(w.M,x,z);
    if(!contact(w.M,q[0],q[1],16,-1e9))return{x:q[0],z:q[1],r:14};
  }
  return{x:0,z:60,r:14};
}
function startKoth(w){
  for(let i=0;i<6;i++){const c=spawnChaser(w,['rusher','reader','sprinter','pack'][i%4]);c.alive=true;c.pts=0;c.speed=20+w.rnd()*3;c.stunSet=false;c.shoveCd=0;c.jit=0;c.jx=0;c.jz=0;}
  w.koth={zone:kothZone(w),t:28,clock:120,p:0,target:40,lead:'-'};
  ev(w,'kothstart',{x:w.koth.zone.x,z:w.koth.zone.z});
}
function kothUpdate(w,dt){
  const K=w.koth,P=w.P,Z=K.zone;
  K.clock-=dt;K.t-=dt;
  if(K.t<=0){K.zone=kothZone(w);K.t=28;ev(w,'zonemove',{x:K.zone.x,z:K.zone.z});}
  const inZ=(e)=>Math.hypot(e.x-Z.x,e.z-Z.z)<Z.r;
  const holders=[];
  if(inZ(P))holders.push('p');
  for(const c of w.C){
    if(c.state==='quit'){c.y+=c.vy*dt;c.t+=dt;if(c.t>1.5)c.dead=true;continue;}
    c.shoveCd=Math.max(0,c.shoveCd-dt);
    if(c.state==='tumble'){
      if(!c.stunSet){c.stunSet=true;c.t=0;c.stun=1.2;}
      c.t+=dt;c.stun-=dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.1,dt);c.vz*=Math.pow(.1,dt);pushOut(w.M,c,CR,-1e9,false);
      if(c.stun<=0){c.state='chase';c.stunSet=false;c.t=0;}
      if(inZ(c))holders.push(c);
      continue;
    }
    c.state='chase';
    const dz=Math.hypot(Z.x-c.x,Z.z-c.z);
    const dP=Math.hypot(P.x-c.x,P.z-c.z);
    if((dP<2.2||(c.dashT>0&&dP<3))&&c.shoveCd<=0&&inZ(P)){
      c.shoveCd=3;const l=dP||1;P.vx+=(P.x-c.x)/l*22;P.vz+=(P.z-c.z)/l*22;ev(w,'kshove',{x:P.x,z:P.z});
    }
    if(dP<12&&dP>4&&inZ(P))botDash(w,c,dt,P.x,P.z,4,12);
    if(dz>Z.r*.6)steer(w,c,Z.x,Z.z,dt,c.speed);
    else{c.jit-=dt;if(c.jit<=0){c.jit=.8+w.rnd();c.jx=Z.x+(w.rnd()-.5)*Z.r;c.jz=Z.z+(w.rnd()-.5)*Z.r;}steer(w,c,c.jx,c.jz,dt,c.speed*.5);}
    if(inZ(c))holders.push(c);
  }
  if(holders.length===1){
    const h=holders[0];
    if(h==='p'){K.p+=dt;w.score+=dt*20;}else h.pts+=dt;
    K.hold=h==='p'?'you':'bot';
  }else K.hold=holders.length?'contested':'empty';
  w.C=w.C.filter(c=>!c.dead);
  const top=w.C.reduce((a,c)=>Math.max(a,c.pts||0),0);
  if(w.state==='play'&&(K.p>=K.target||top>=K.target||K.clock<=0)){
    w.won=K.p>=top;if(w.won)w.score+=1000;
    w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});
  }
}
/* ----- sumo ----- */
function startSumo(w){
  const P=w.P;P.x=0;P.z=9;P.y=0;P.yaw=0;P.vx=P.vz=0;
  for(let i=0;i<4;i++){
    const c=spawnChaser(w,['rusher','reader','sprinter','pack'][i]);const a=i/4*Math.PI*2+.6;
    c.alive=true;c.x=Math.cos(a)*13;c.z=Math.sin(a)*13-2;c.y=0;c.vx=c.vz=0;c.kx=c.kz=0;c.speed=15+w.rnd()*3;c.chT=1.5+w.rnd()*2;c.chg=0;c.edge=0;c.out=false;c.tgt=null;
  }
  w.sumo={R:26,minR:4.5,t:0,kos:0,out:false,fall:0,edge:0,total:4};
  ev(w,'sumostart',{});
}
function sumoHit(w,a,b,pw){ // a pushes b
  const dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||1;
  if(b===w.P){b.vx+=dx/l*pw;b.vz+=dz/l*pw;ev(w,'kshove',{x:b.x,z:b.z});}
  else{b.kx+=dx/l*pw;b.kz+=dz/l*pw;ev(w,'sumobump',{x:b.x,z:b.z});}
}
function sumoUpdate(w,dt){
  const S=w.sumo,P=w.P;
  S.t+=dt;S.R=Math.max(S.minR,26-S.t*.26);
  const live=w.C.filter(c=>c.alive!==false);
  // bots
  for(const c of w.C){
    if(c.alive===false){c.y-=dt*14;c.t+=dt;if(c.t>2)c.dead=true;continue;}
    c.state='chase';
    c.kx*=Math.pow(.08,dt);c.kz*=Math.pow(.08,dt);
    let best=null,bd=1e9;
    const cand=[P].concat(live.filter(o=>o!==c));
    for(const o of cand){if(o===P&&S.out)continue;const d=Math.hypot(o.x-c.x,o.z-c.z);if(d<bd){bd=d;best=o;}}
    let tx=0,tz=0,sp=c.speed*.8;
    const dc=Math.hypot(c.x,c.z);
    if(dc>S.R-6){tx=-c.x;tz=-c.z;sp=c.speed;} // recover from edge
    else if(best){
      tx=best.x-c.x;tz=best.z-c.z;
      c.chT-=dt;
      botDash(w,c,dt,best.x,best.z,3,13);
    }
    const tl=Math.hypot(tx,tz)||1;c.fx=tx/tl;c.fz=tz/tl;
    c.vx=c.fx*sp+c.kx;c.vz=c.fz*sp+c.kz;
    if(c.dashT>0){c.dashT-=dt;c.vx=c.ddx*DASHV*.6+c.kx;c.vz=c.ddz*DASHV*.6+c.kz;c.fx=c.ddx;c.fz=c.ddz;}
    c.x+=c.vx*dt;c.z+=c.vz*dt;
    if(best&&bd<2.1&&c.dashT>0){sumoHit(w,c,best,best===P?(P.inv>0?4:23):23);c.dashT=0;c.kx-=c.fx*6;c.kz-=c.fz*6;}
  }
  // player dash/body hits
  for(const c of live){
    if(c.alive===false)continue;
    const dx=c.x-P.x,dz=c.z-P.z,d=Math.hypot(dx,dz);
    if(d<2.1&&!S.out){
      if(P.dashT>0){sumoHit(w,P,c,23);c.dashT=0;w.score+=60;P.dashT=Math.min(P.dashT,.08);}
      else{const l=d||1,ov=(2.1-d)/2;c.x+=dx/l*ov;c.z+=dz/l*ov;P.x-=dx/l*ov;P.z-=dz/l*ov;}
    }
    c.state='chase';
  }
  // bot-bot separation
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){
    const a=live[i],b=live[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<2.1&&d>0){const ov=(2.1-d)/2;a.x-=dx/d*ov;a.z-=dz/d*ov;b.x+=dx/d*ov;b.z+=dz/d*ov;}
  }
  // edges
  for(const c of live){
    if(Math.hypot(c.x,c.z)>S.R+.6){c.edge+=dt;if(c.edge>.25){c.alive=false;c.state='tumble';c.t=0;S.kos++;w.score+=400;ev(w,'sumoout',{x:c.x,z:c.z,name:c.name,you:false});}}
    else c.edge=0;
  }
  if(!S.out){
    if(Math.hypot(P.x,P.z)>S.R+.6){S.edge+=dt;if(S.edge>.25){S.out=true;ev(w,'sumoout',{x:P.x,z:P.z,name:'You',you:true});}}
    else S.edge=0;
  }else{S.fall+=dt;P.y=-S.fall*S.fall*9;P.vy=0;}
  w.C=w.C.filter(c=>!c.dead);
  if(w.state==='play'&&S.t>110&&!S.out){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});}
  if(w.state==='play'){
    if(S.out&&S.fall>1.4){w.won=false;w.state='dead';w.deadT=0;ev(w,'dead',{won:false});}
    else if(!S.out&&w.C.every(c=>c.alive===false)){w.won=true;w.score+=1500+Math.round(P.hp*0);w.state='dead';w.deadT=0;ev(w,'dead',{won:true});}
  }
}

/* ----- infection ----- */
function ringPlace(w,c,i,n,r0,r1){
  const P=w.P;
  for(let k=0;k<12;k++){
    const a=(i+w.rnd()*.8)/n*Math.PI*2,r=r0+w.rnd()*(r1-r0);
    const x=P.x+Math.cos(a)*r,z=P.z+Math.sin(a)*r;
    if(!contact(w.M,x,z,CR+1,-1e9)&&Math.abs(x)<HALF-10&&Math.abs(z)<HALF-10){c.x=x;c.z=z;c.vx=c.vz=0;return;}
  }
}
function startInf(w){
  for(let i=0;i<8;i++){const c=spawnChaser(w,['rusher','reader','sprinter','pack'][i%4]);ringPlace(w,c,i,8,i===0?50:30,i===0?65:75);c.alive=true;c.zom=i===0;c.speed=i===0?22:19.5+w.rnd()*2;c.stun=0;c.wpT=0;c.mk=c.zom?0x9be564:null;}
  w.inf={clock:90,humans:7,turned:0,start:7};
  ev(w,'infstart',{});

function infUpdate(w,dt){

/* ----- laser tag ----- */
function laserRay(w,sh,ox,oy,oz,dx,dz,slope,team){
  // returns the nearest enemy hit by a ray (xz direction dx,dz normalized, vertical slope)
  let best=null,bt=70,by=0;
  const cands=[];
  if(team!==0&&!w.P.down)cands.push(w.P);
  for(const c of w.C)if(c.team!==team&&!(c.down>0)&&c!==sh)cands.push(c);
  if(team===1&&false)return null;
  for(const e of cands){
    const vx=e.x-ox,vz=e.z-oz,t=vx*dx+vz*dz;
    if(t<.6||t>=bt)continue;
    const perp=Math.abs(vx*dz-vz*dx);
    if(perp>.85)continue;
    const y=oy+slope*t,ey=e.y||0;
    if(y<ey-.25||y>ey+2.2)continue;
    if(!los(w.M,ox,oz,e.x,e.z))continue;
    best=e;bt=t;by=y;
  }
  return best?{e:best,t:bt,y:by}:null;
}
function laserTag(w,e,shooter){

  }else{e.down=3;e.state='calm';e.vx=e.vz=0;ev(w,'laserhit',{x:e.x,z:e.z,you:false});}
  S.score[sTeam]++;
  if(shooter===w.P){w.score+=300;S.myTags++;}
}
function startLaser(w){

function laserUpdate(w,dt,inp){

    }else{

      let nt=null,nd=1e9;for(const e of enemiesOf(c)){const d=Math.hypot(e.x-c.x,e.z-c.z);if(d<nd){nd=d;nt=e;}}
      if(nt)steer(w,c,nt.x,nt.z,dt,c.speed);
    }
  }
  if(w.state==='play'){
    const done=S.score[0]>=S.target||S.score[1]>=S.target||S.clock<=0;
    if(done){w.won=S.score[0]>S.score[1];if(w.won)w.score+=1500;w.state='dead';w.deadT=0;ev(w,'dead',{won:w.won});}

/* ----- floor is lava (crumbling tiles) ----- */
const TILE={n:8,s:8};
function tileAt(w,x,z){const i=Math.floor((x+32)/8),j=Math.floor((z+32)/8);if(i<0||j<0||i>=8||j>=8)return-1;return j*8+i;}
function startTiles(w){
  const P=w.P;P.x=0;P.z=0;P.yaw=0;P.imm=0;
  for(let i=0;i<5;i++){const c=spawnChaser(w,['rusher','reader','sprinter','pack','rusher'][i]);const a=i/5*Math.PI*2;c.x=Math.cos(a)*16;c.z=Math.sin(a)*16;c.vx=c.vz=0;c.alive=true;c.speed=16+w.rnd()*3;c.pick=-1;c.kx=c.kz=0;c.y=0;c.out=false;}
  w.tiles={st:new Array(64).fill(0),tm:new Array(64).fill(0),sd:new Array(64).fill(0),t:0,rT:2,fall:0,out:false,left:5};
  ev(w,'tilestart',{});
}
function tilePath(S,from,to){
  const q=[from],prev={};prev[from]=-1;
  while(q.length){
    const k=q.shift();if(k===to)break;const i=k%8,j=Math.floor(k/8);
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){
      if(!di&&!dj)continue;const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>7||jj>7)continue;
      const n=jj*8+ii;if(S.st[n]!==0||(n in prev))continue;
      if(di&&dj&&(S.st[j*8+ii]!==0||S.st[jj*8+i]!==0))continue;
      prev[n]=k;q.push(n);
    }
  }
  if(!(to in prev))return null;
  const p=[to];let c=to;while(prev[c]!==from&&prev[c]!==-1){c=prev[c];p.push(c);}
  return p.reverse();
}
function tilesUpdate(w,dt){
  const S=w.tiles,P=w.P;S.t+=dt;
  S.rT-=dt;
  if(S.rT<=0){
    S.rT=Math.max(.6,3-S.t*.03);
    const solid=[];S.st.forEach((v,i)=>{if(v===0)solid.push(i);});
    if(solid.length>2){const k=solid[Math.floor(w.rnd()*solid.length)];S.st[k]=1;S.tm[k]=1.1;}
  }
  const standing=new Set();
  const stand=(e)=>{const k=tileAt(w,e.x,e.z);if(k>=0&&S.st[k]===0)standing.add(k);return k;};
  if(!S.out&&P.ground)stand(P);
  for(const c of w.C)if(c.alive!==false)stand(c);
  for(let k=0;k<64;k++){
    if(S.st[k]!==0)continue;
    if(standing.has(k)){S.sd[k]+=dt;if(S.sd[k]>=2.4){S.st[k]=1;S.tm[k]=.8;}}else S.sd[k]=Math.max(0,S.sd[k]-dt*.6);
  }
  for(let k=0;k<64;k++){
    if(S.st[k]===1){S.tm[k]-=dt;if(S.tm[k]<=0){S.st[k]=2;ev(w,'tilefall',{x:(k%8)*8-28,z:Math.floor(k/8)*8-28});}}
  }
  // bots
  const live=w.C.filter(c=>c.alive!==false);
  for(const c of w.C){
    if(c.alive===false){c.y-=dt*14;c.t+=dt;if(c.t>2.5)c.dead=true;continue;}
    c.kx=(c.kx||0)*Math.pow(.08,dt);c.kz=(c.kz||0)*Math.pow(.08,dt);
    c.x+=c.kx*dt;c.z+=c.kz*dt;
    if(c.hop){
      const h=c.hop;h.t+=dt;const k=Math.min(1,h.t/h.T);
      c.x=h.sx+(h.tx-h.sx)*k;c.z=h.sz+(h.tz-h.sz)*k;c.y=Math.sin(k*Math.PI)*3.2;
      if(k>=1){c.hop=null;c.y=0;}
      continue;
    }
    if(c.state==='tumble'){
      c.t+=dt;c.x+=c.vx*dt;c.z+=c.vz*dt;c.vx*=Math.pow(.1,dt);c.vz*=Math.pow(.1,dt);

        for(const o of live)if(o!==c){const d=Math.hypot(o.x-c.x,o.z-c.z);if(d>3&&d<vd){vd=d;vic=o;}}
        if(vic&&Math.hypot(vic.x,vic.z)>14)botDash(w,c,dt,vic.x,vic.z,3,11);
      }
      if(c.dashT>0){
        c.dashT-=dt;c.x+=c.ddx*DASHV*.6*dt;c.z+=c.ddz*DASHV*.6*dt;
        const hitE=[S.out?null:P].concat(live).filter(e=>e&&e!==c);
        for(const e of hitE){
          if(Math.hypot(e.x-c.x,e.z-c.z)<2.2){
            const l=Math.hypot(e.x-c.x,e.z-c.z)||1;
            if(e===P){if(P.inv<=0){P.vx+=(P.x-c.x)/l*22;P.vz+=(P.z-c.z)/l*22;P.inv=.4;ev(w,'kshove',{x:P.x,z:P.z});}}
            else{e.kx=(e.kx||0)+(e.x-c.x)/l*22;e.kz=(e.kz||0)+(e.z-c.z)/l*22;ev(w,'sumobump',{x:e.x,z:e.z});}

      }else if(c.pick>=0){

        const path=cur>=0&&S.st[cur]===0?tilePath(S,cur,c.pick):null;
        let gx=tx,gz=tz;
        if(path&&path.length){const nk=path[0];gx=(nk%8)*8-28;gz=Math.floor(nk/8)*8-28;}
        else{
          // unreachable: leap to the best reachable-by-jump tile

  }
