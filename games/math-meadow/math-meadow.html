<script>
const $=s=>document.querySelector(s),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function shuf(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function nums(ans,fmt){const rev=+String(Math.abs(ans)).split('').reverse().join(''),I=Number.isInteger(ans),s=new Set([ans]);for(const d of shuf([ans+1,ans-1,ans+10,ans-10,ans*2,Math.round(ans/2),rev,ans+2,ans-2])){if(s.size>=4)break;if(d!==ans&&d>=0&&Number.isInteger(d)===I)s.add(d)}let n=0;const sp=Math.max(3,Math.ceil(ans*.2));while(s.size<4&&n++<200){const d=ans+r(-sp,sp);if(d>=0)s.add(d)}return shuf([...s]).map(v=>({t:fmt?fmt(v):v,c:v===ans}))}
function pie(a,b){let h="";for(let i=0;i<b;i++){const a0=2*Math.PI*i/b-Math.PI/2,a1=2*Math.PI*(i+1)/b-Math.PI/2,x0=50+45*Math.cos(a0),y0=50+45*Math.sin(a0),x1=50+45*Math.cos(a1),y1=50+45*Math.sin(a1);
h+=`<path d="M50 50L${x0} ${y0}A45 45 0 ${b==1?1:0} 1 ${x1} ${y1}Z" fill="${i<a?'#2f6fed':'none'}" stroke="currentColor" stroke-width="2.5"${i<a?'':' fill-opacity="0"'}/>`}
return `<svg viewBox="0 0 100 100" role="img" aria-label="${a} of ${b} slices shaded">${h}</svg>`}
const GEN=[
{n:"Meadow",e:"🌱",world:"A sunny meadow full of friends.",items:["🐞","🐸","🐝","🦋","🐢"],lines:["The critters need your help!","A butterfly asks you a riddle:","Let’s explore the meadow!"],win:["Yes! Great thinking.","The critters cheer!"]},
{n:"Fantasy",e:"🐉",world:"Dragons, wizards and treasure.",items:["🐉","🧙","💎","🗡️","🏰"],lines:["A dragon guards the bridge. Solve to pass!","The wizard whispers a riddle:","Treasure awaits the clever!"],win:["The gate opens!","Magic! You did it."]},
{n:"Space",e:"🚀",world:"Rockets, planets and aliens.",items:["🚀","👽","🪐","⭐","🛸"],lines:["Mission control needs a calculation:","An alien sends a message:","Engage warp drive. Solve to launch!"],win:["Lift-off! Great work.","Houston, we have a winner!"]},
{n:"Sports",e:"⚽",world:"Goals, scores and champions.",items:["⚽","🏀","🏆","🥅","🎾"],lines:["The coach has a challenge:","Score the winning point!","Time for training:"],win:["GOAL! Nice one.","Champion move!"]},
{n:"Mystery",e:"🕵️",world:"Clues, cases and secrets.",items:["🔍","🗝️","📜","🕯️","🧩"],lines:["A clue appears:","Detective, crack the case!","The safe needs a code:"],win:["Case closed!","Elementary!"]},
{n:"Pirates",e:"🏴‍☠️",world:"Maps, ships and buried gold.",items:["🪙","🦜","⚓","🗺️","🏴‍☠️"],lines:["Arr, the map needs decoding:","The captain’s orders:","Buried treasure ahead!"],win:["Yo ho ho, correct!","X marks the spot!"]}
];const G=()=>GEN[S.genre]||GEN[0];
function poly(n){let p="";for(let i=0;i<n;i++){const a=2*Math.PI*i/n-Math.PI/2;p+=(50+42*Math.cos(a)).toFixed(1)+","+(50+42*Math.sin(a)).toFixed(1)+" "}return `<svg viewBox="0 0 100 100" role="img" aria-label="a shape"><polygon points="${p}" fill="#2f6fed" fill-opacity=".25" stroke="currentColor" stroke-width="3"/></svg>`}
function tri(o,a,h,t){return `<svg viewBox="0 0 145 105" role="img" aria-label="right triangle" style="font-size:12px"><path d="M20 85H110V15Z" fill="#2f6fed" fill-opacity=".2" stroke="currentColor" stroke-width="2.5"/><path d="M100 85V75H110" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="115" y="54" fill="currentColor">${o}</text><text x="60" y="101" fill="currentColor">${a}</text><text x="50" y="42" text-anchor="end" fill="currentColor">${h}</text>${t?'<text x="32" y="80" fill="currentColor">θ</text>':''}</svg>`}
const pick=a=>a[r(0,a.length-1)],gcd=(a,b)=>b?gcd(b,a%b):a,mn=v=>String(v).replace("-","−"),sg=v=>v<0?"−"+-v:"+"+v,SUP=["⁰","¹","²","³","⁴","⁵"],fac=n=>n?n*fac(n-1):1;
const sc=(ans,alts)=>{const s=[...new Set(alts.filter(x=>x!=ans))].slice(0,3);return shuf([ans,...s]).map(v=>({t:v,c:v==ans}))};
const ni=(ans,st=1,f)=>{const s=new Set([ans]);while(s.size<4)s.add(+(ans+st*r(-4,4)).toFixed(4));return shuf([...s]).map(v=>({t:f?f(v):mn(v),c:v===ans}))};
const ACT=[
{name:"Count the Critters",e:"🐞",desc:"Count and tap the right number.",ages:[0,1],gen(l){const n=r(1,l?20:10),em=G().items[r(0,4)];return{q:"How many are there?",vis:em.repeat(n),ch:nums(n),hint:"Touch each one as you count. Try counting in groups of 5."}}},
{name:"Add & Subtract",e:"➕",desc:"Combine and take away, from dots to big numbers.",ages:[0,1,2],gen(l){let a,b,op=Math.random()<.5?"+":"−";const m=[5,20,999][l];a=r(1,m);b=r(1,m);if(op=="−"&&b>a)[a,b]=[b,a];const ans=op=="+"?a+b:a-b;
return{q:`${a} ${op} ${b} = ?`,vis:l==0?G().items[0].repeat(a)+(op=="+"?" ➕ ":" ➖ ")+G().items[1].repeat(b):"",ch:nums(ans),hint:op=="+"?"Start at the bigger number and count up.":"Start at the bigger number and count back."}}},
{name:"Times Table Trail",e:"✖️",desc:"Groups, arrays and times tables.",ages:[0,1,2],gen(l){const a=r(l?2:1,l==2?15:l?10:5),b=r(l?2:1,l==2?15:l?10:5);return{q:l==0?`${a} groups of ${b} — how many in all?`:`${a} × ${b} = ?`,vis:l==0?(G().items[2].repeat(b)+" ").repeat(a):"",ch:nums(a*b),hint:`Count by ${b}s, ${a} times: ${b}, ${b*2}, ${b*3}…`}}},
{name:"Pizza Fractions",e:"🍕",desc:"See the shaded slices and name the fraction.",ages:[0,1,2],gen(l){const dens=l==0?[2,4]:l==1?[2,3,4,5,6,8]:[2,4,5,10],b=dens[r(0,dens.length-1)],a=r(1,b-1);
if(l==2){const ans=Math.round(a/b*100),s=new Set([ans]);while(s.size<4)s.add(r(1,19)*5);return{q:"What percent is shaded?",vis:pie(a,b),ch:shuf([...s]).map(v=>({t:v+"%",c:v===ans})),hint:`${a}/${b} as a decimal is ${a/b}. Move it two places for a percent.`}}
const s=new Set([a+"/"+b]);while(s.size<4){const d=dens[r(0,dens.length-1)];s.add(r(1,d-1)+"/"+d)}
return{q:"What fraction is shaded?",vis:pie(a,b),ch:shuf([...s]).map(v=>({t:v,c:v==a+"/"+b})),hint:`Count all the slices (${b}) for the bottom, shaded slices (${a}) for the top.`}}},
{name:"Mystery Number",e:"🕵️",desc:"Find the hidden number in a balance puzzle.",ages:[0,1,2],gen(l){let x,q,h;if(l==0){x=r(1,8);const a=r(1,5);q=`❓ + ${a} = ${x+a}`;h="What do you add to "+a+" to reach "+(x+a)+"?"}else if(l==1){x=r(2,30);const a=r(2,30);q=`x + ${a} = ${x+a}. What is x?`;h="Take "+a+" away from both sides."}else{x=r(2,12);const a=r(2,9),b=r(1,20);q=`${a}x + ${b} = ${a*x+b}. What is x?`;h=`Subtract ${b}, then divide by ${a}.`}return{q:l==0?"Which number goes in the ❓?":q,vis:l==0?q:"",ch:nums(x),hint:h}}},
{name:"Percent Market",e:"🛒",desc:"Discounts, tips and percentages of real amounts.",ages:[1,2],gen(l){const p=l==1?[10,25,50][r(0,2)]:[5,15,20,30,75][r(0,4)],base=l==1?r(1,10)*20:r(2,40)*20,ans=base*p/100;return{q:`What is ${p}% of $${base}?`,vis:"🏷️",ch:nums(ans,v=>"$"+v),hint:`10% of $${base} is $${base/10}. Build ${p}% from that.`}}},
{name:"Shape Detective",e:"🔷",desc:"Spot shapes, sides and corners.",ages:[0,1],gen(l){const N=["","","","triangle","square","pentagon","hexagon","heptagon","octagon"],n=r(3,l?8:6);
if(l==0)return{q:"How many sides does this shape have?",vis:poly(n),ch:nums(n),hint:"Walk along the edge and count each straight side."};
const s=new Set([N[n]]);while(s.size<4)s.add(N[r(3,8)]);return{q:"What is this shape called?",vis:poly(n),ch:shuf([...s]).map(v=>({t:v,c:v==N[n]})),hint:"tri = 3, quad = 4, penta = 5, hexa = 6, hepta = 7, octa = 8."}}},
{name:"Area & Perimeter",e:"📐",desc:"Rectangles, triangles and circles.",ages:[1,2],gen(l){const t=l==2?r(0,3):r(0,1);
if(t<2){const w=r(2,12),h=r(2,12),ar=t==0;return{q:`A rectangle is ${w} by ${h}. What is its ${ar?"area":"perimeter"}?`,vis:"▭",ch:nums(ar?w*h:2*(w+h)),hint:ar?"Area = length × width.":"Perimeter = add all four sides."}}
if(t==2){const b=r(2,10)*2,h=r(2,10);return{q:`A triangle has base ${b} and height ${h}. What is its area?`,vis:"△",ch:nums(b*h/2),hint:"Area = ½ × base × height."}}
const rr=r(2,10);return{q:`A circle has radius ${rr}. What is its area, in π?`,vis:"◯",ch:nums(rr*rr,v=>v+"π"),hint:"Area = π × r × r."}}},
{name:"Right-Triangle Rescue",e:"🔺",desc:"Find the missing side with Pythagoras.",ages:[1,2],gen(l){const T=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]],[a,b,c]=T[r(0,l==2?3:0)],k=l==2?1:r(1,3),A=a*k,B=b*k,C=c*k,leg=l==2&&Math.random()<.5;
return{q:leg?`A right triangle has hypotenuse ${C} and one leg ${A}. How long is the other leg?`:`A right triangle has legs ${A} and ${B}. How long is the hypotenuse?`,vis:tri(leg?"?":B,A,leg?C:"?",0),ch:nums(leg?B:C),hint:leg?"b² = c² − a². Subtract the squares, then take the square root.":"c² = a² + b². Add the squares, then take the square root."}}},
{name:"Trig Quest",e:"📈",desc:"SOH-CAH-TOA and special angles.",ages:[2],gen(l){
if(Math.random()<.6){const T=[[3,4,5],[5,12,13],[8,15,17]],[o,a,h]=T[r(0,2)],f=["sin","cos","tan"][r(0,2)],v={sin:[o,h],cos:[a,h],tan:[o,a]}[f],ans=v[0]+"/"+v[1];
const all=[[o,h],[a,h],[o,a],[a,o],[h,o],[h,a]].map(x=>x[0]+"/"+x[1]),opts=shuf(all.filter(x=>x!=ans)).slice(0,3).concat(ans);
return{q:`In this right triangle, what is ${f} θ?`,vis:tri(o,a,h,1),ch:shuf(opts).map(x=>({t:x,c:x==ans})),hint:"SOH-CAH-TOA: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent."}}
const V=[["sin 30°","1/2"],["cos 60°","1/2"],["sin 45°","√2/2"],["cos 45°","√2/2"],["cos 30°","√3/2"],["sin 60°","√3/2"],["tan 45°","1"],["tan 30°","√3/3"],["sin 90°","1"],["cos 0°","1"],["sin 0°","0"],["cos 90°","0"]],[q,ans]=V[r(0,V.length-1)],pool=["1/2","√2/2","√3/2","1","0","√3/3","√3"];
return{q:`What is ${q}?`,vis:"🎡",ch:shuf(shuf(pool.filter(x=>x!=ans)).slice(0,3).concat(ans)).map(x=>({t:x,c:x==ans})),hint:"Picture the unit circle: sin is the height, cos is the width of the point at that angle."}}},
{name:"Pattern Maker",e:"🔢",c:"Patterns",desc:"Find the next number in the pattern.",ages:[0,1,2],gen(l){const a=r(1,9),d=r(2,l?9:3),m=r(2,3);const s=l<2?[0,1,2,3].map(i=>a+d*i):[0,1,2,3].map(i=>a*m**i),n=l<2?a+4*d:a*m**4;return{q:`What comes next? ${s.join(", ")}, ?`,vis:"",ch:nums(n),hint:l<2?`It adds ${d} each time.`:`It multiplies by ${m} each time.`}}},
{name:"Place Value & Rounding",e:"🔟",c:"Arithmetic",desc:"Digits, tens, hundreds and rounding.",ages:[0,1,2],gen(l){const n=r(l?100:10,l==2?9999:l?999:99);if(l==0)return{q:`In ${n}, which digit is in the tens place?`,vis:"",ch:nums(Math.floor(n/10)%10),hint:"The tens place is the second digit from the right."};const u=l==1?10:100;return{q:`Round ${n} to the nearest ${u}.`,vis:"",ch:ni(Math.round(n/u)*u,u),hint:`Look at the digit just below the ${u}s place: 5 or more rounds up.`}}},

{name:"Chance & Probability",e:"🎲",c:"Probability & Stats",desc:"Likely, unlikely and certain.",ages:[0,1,2],gen(l){const x=r(1,4),y=x+r(1,4);if(l==0)return{q:`A bag has ${x} red and ${y} blue marbles. Which colour are you more likely to pick?`,vis:"🔴".repeat(x)+"🔵".repeat(y),ch:sc("Blue",["Red","Equal chance"]),hint:"The colour with more marbles is more likely."};if(l==1)return{q:`A bag has ${x} red and ${y} blue marbles. What is the chance of picking red?`,vis:"🔴".repeat(x)+"🔵".repeat(y),ch:sc(`${x}/${x+y}`,[`${y}/${x+y}`,`${x}/${y}`,`${x+y}/${x}`]),hint:"Chance = red marbles ÷ all marbles."};const S=r(2,12);return{q:`Two dice are rolled. In how many of the 36 outcomes is the sum ${S}?`,vis:"🎲🎲",ch:nums(6-Math.abs(S-7)),hint:"List the pairs (1,?), (2,?)… that add up to it."}}},

{name:'Money Grows',e:'🏦',c:'Ratios & Rates',desc:'Simple and compound interest.',ages:[2],gen(){const P=r(1,9)*100,p=pick([10,20]),t=r(2,5);return Math.random()<.5?{q:`You invest $${P} at ${p}% simple interest for ${t} years. How much interest do you earn?`,vis:'💰',ch:nums(P*p/100*t,v=>'$'+v),hint:'Interest = principal × rate × years.'}:{q:`$${P} grows ${p}% a year, compounded. What is it worth after 2 years?`,vis:'📈',ch:nums(Math.round(P*(1+p/100)**2),v=>'$'+v),hint:`Multiply by ${1+p/100} twice.`}}},

{name:'Memory Match',e:'🃏',c:'Games',desc:'Flip cards to match each sum with its answer.',ages:[0,1,2],play(l){const P=[],U=new Set(),M=l==0?9:l==1?12:15;while(P.length<6){const a=r(2,M),b=r(2,M),q=l==0?[`${a} + ${b}`,a+b]:l==1?[`${a} × ${b}`,a*b]:[`${a}² − ${b}`,a*a-b];if(!U.has(q[1])){U.add(q[1]);P.push(q)}}const C=shuf(P.flatMap((q,i)=>[{t:q[0],k:i},{t:String(q[1]),k:i}]));let open=[],found=0,moves=0,lock=0;const R=()=>{$('#app').innerHTML=BAR('Moves: '+moves)+`<div class='panel'><h2>🃏 Memory Match</h2><p class='mute'>Match each question with its answer.</p><div class='opts'>${C.map((c,i)=>`<button data-i='${i}' class='${c.d?'ok':''}'>${c.d||open.includes(i)?c.t:'❓'}</button>`).join('')}</div><p id='fb' role='status' aria-live='polite'></p></div>`;document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>flip(+b.dataset.i))};const flip=i=>{if(lock||C[i].d||open.includes(i))return;open.push(i);if(open.length==2){moves++;const [x,y]=open;if(C[x].k==C[y].k){C[x].d=C[y].d=1;open=[];found++;R();if(found==6){reward(8);$('#fb').textContent=`You matched them all in ${moves} moves! +8 stars`}return}lock=1;R();setTimeout(()=>{open=[];lock=0;R()},900);return}R()};R()}},
{name:'Number Line Sniper',e:'🎯',c:'Games',desc:'Place the number on the line. Tap it or type it.',ages:[0,1,2],play(l){const [lo,hi]=[[0,10],[0,100],[-10,10]][l];let rd=0,tot=0;const N=()=>{const t=l==2?+(r(-90,90)/10).toFixed(1):r(1,l?99:9);$('#app').innerHTML=BAR(`Round ${rd+1}/5 · +${tot}⭐`)+`<div class='panel'><h2>🎯 Number Line Sniper</h2><p class='qt'>Place <b>${mn(t)}</b> on the line.</p><div id='nl' role='img' style='position:relative;height:64px;border-bottom:4px solid currentColor;cursor:crosshair' aria-label='Number line from ${lo} to ${hi}'><span style='position:absolute;left:0;bottom:-30px'>${mn(lo)}</span><span style='position:absolute;right:0;bottom:-30px'>${hi}</span></div><div class='bar' style='margin-top:40px'><button class='nm' data-d='-10' aria-label='Move marker far left'>⏪</button><button class='nm' data-d='-1' aria-label='Move marker left'>◀</button><button class='nm' data-d='1' aria-label='Move marker right'>▶</button><button class='nm' data-d='10' aria-label='Move marker far right'>⏩</button><button id='aim'>Aim</button><input id='gi' type='number' step='any' aria-label='Or type your guess' placeholder='or type it' style='padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)'><button id='gb'>Check</button><button id='nx' style='display:none'>Next →</button></div><p id='fb' role='status' aria-live='polite'></p></div>`;const L=$('#nl');let done=0;const shoot=g=>{if(done||isNaN(g))return;done=1;g=Math.min(hi,Math.max(lo,g));const err=Math.abs(g-t)/(hi-lo),pts=err<.03?3:err<.08?2:err<.15?1:0,P=v=>(v-lo)/(hi-lo)*100;tot+=pts;if(pts)reward(pts);L.insertAdjacentHTML('beforeend',`<i style='position:absolute;bottom:0;left:${P(t)}%;width:5px;height:48px;background:var(--ok)'></i><i style='position:absolute;bottom:0;left:${P(g)}%;width:5px;height:48px;background:var(--bad)'></i>`);$('#fb').textContent=`${pts?'🎉':'Close!'} You chose ${+g.toFixed(1)}; the answer was ${mn(t)}. +${pts} stars`;rd++;const nx=$('#nx');nx.style.display='';nx.textContent=rd<5?'Next →':'Finish';nx.onclick=()=>rd<5?N():home()};let mk=50;const M=document.createElement('i');M.style.cssText='position:absolute;bottom:0;width:4px;height:40px;background:var(--acc);opacity:.8';L.appendChild(M);const pm=()=>{M.style.left=mk+'%'};pm();document.querySelectorAll('.nm').forEach(b=>b.onclick=()=>{if(done)return;mk=Math.min(100,Math.max(0,mk+ +b.dataset.d));pm()});$('#aim').onclick=()=>shoot(lo+mk/100*(hi-lo));L.onclick=e=>{const R=L.getBoundingClientRect();shoot(lo+(e.clientX-R.left)/R.width*(hi-lo))};$('#gb').onclick=()=>shoot(parseFloat($('#gi').value))};N()}},
{name:'Guess My Number',e:'🔮',c:'Games',desc:'Higher or lower? Find it in as few guesses as you can.',ages:[0,1,2],play(l){const hi=[20,100,1000][l],t=r(1,hi);let n=0,lo=1,up=hi;const R=m=>{$('#app').innerHTML=BAR('Guesses: '+n)+`<div class='panel'><h2>🔮 Guess My Number</h2><p class='qt'>I’m thinking of a number from 1 to ${hi}.</p><p class='mute'>It is between ${lo} and ${up}.${n>=3?' Tip: guess the middle of the range!':''}</p><div class='bar'><input id='gi' type='number' inputmode='numeric' aria-label='Your guess' style='padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)'><button id='gb'>Guess</button></div><p id='fb' role='status' aria-live='polite'>${m||''}</p></div>`;const go=()=>{const g=Math.round(+$('#gi').value);if(!g||g<1||g>hi)return;n++;if(g==t){const best=Math.ceil(Math.log2(hi));reward(Math.max(1,best+2-n));R(`🎉 Found it in ${n} guesses! Halving the range each time finds any number from 1 to ${hi} in at most ${best} guesses.`);$('#gi').disabled=true;$('#gb').disabled=true;return}if(g<t){lo=Math.max(lo,g+1);R('⬆️ Higher!')}else{up=Math.min(up,g-1);R('⬇️ Lower!')}};$('#gb').onclick=go;$('#gi').onkeydown=e=>{if(e.key=='Enter')go()};$('#gi').focus()};R()}},

{name:'Circle Spin',e:'⭕',c:'Geometry',desc:'Circumference and pizza slices.',ages:[1,2],gen(l){const R=r(2,9);if(l<2)return{q:`What is the circumference of a circle with radius ${R}, in π?`,vis:'⭕',ch:nums(2*R,v=>v+'π'),hint:'Circumference = 2 × π × r.'};const A=pick([60,90,120,180]);return{q:`A pizza slice has a ${A}° angle at the centre of a circle of radius 6. What is its area, in π?`,vis:'🍕',ch:nums(36*A/360,v=>v+'π'),hint:`The whole circle is 36π. This slice is ${A}/360 of it.`}}},

{name:'Identity Check',e:'🔍',c:'Trigonometry',desc:'sin² + cos² = 1 in action.',ages:[2],gen(){const [o,a,h]=pick([[3,4,5],[5,12,13],[8,15,17]]);return{q:`θ is acute and sin θ = ${o}/${h}. What is cos θ?`,vis:tri(o,'?',h,1),ch:sc(`${a}/${h}`,[`${o}/${a}`,`${h}/${a}`,`${a}/${o}`,`${h-o}/${h}`]),hint:'Use sin²θ + cos²θ = 1, or find the third side of the triangle.'}}},
{name:'Spread Squad',e:'📏',c:'Probability & Stats',desc:'Standard deviation made friendly.',ages:[2],gen(){const m=r(10,40),d=r(1,9);return{q:`The data set is ${shuf([m-d,m-d,m+d,m+d]).join(', ')}. What is the standard deviation?`,vis:'',ch:nums(d),hint:'Every value is the same distance from the mean. That distance is the standard deviation.'}}},
{name:'Odds Combo',e:'🪙',c:'Probability & Stats',desc:'Chances of two or more things happening.',ages:[1,2],gen(l){if(l<2){const n=r(2,4);return{q:`You flip ${n} coins. What is the chance that all of them are heads?`,vis:'🪙'.repeat(n),ch:sc(`1/${2**n}`,[`1/${2*n}`,`1/${n}`,`${n}/${2**n}`,`1/${2**(n+1)}`]),hint:'Each coin has a 1/2 chance. Multiply the chances.'}}const a=r(2,6),b=r(2,6);return{q:`P(A) = 1/${a} and P(B) = 1/${b}, and they are independent. What is P(A and B)?`,vis:'',ch:sc(`1/${a*b}`,[`1/${a+b}`,`2/${a+b}`,`1/${a*b+1}`,`${a}/${b}`]),hint:'For independent events, multiply the probabilities.'}}},
{name:'Expected Value',e:'🎰',c:'Probability & Stats',desc:'What a game pays on average.',ages:[2],gen(){const a=r(2,9)*2,b=r(1,9)*2;return{q:`A game pays $${a} if a fair coin lands heads and costs $${b} if it lands tails. What is the expected winnings per play?`,vis:'🪙',ch:ni((a-b)/2,1,v=>(v<0?'−$':'$')+Math.abs(v)),hint:'Expected value = (½ × win) + (½ × loss).'}}},
{name:'Flip & Slide',e:'🪞',c:'Geometry',desc:'Reflections, slides and rotations on a grid.',ages:[1,2],gen(l){const x=r(1,9)*(Math.random()<.5?1:-1),y=r(1,9)*(Math.random()<.5?1:-1),P=(u,v)=>`(${mn(u)}, ${mn(v)})`,T=l<2?[['Reflect over the y-axis',P(-x,y)],['Reflect over the x-axis',P(x,-y)],['Slide 3 right and 2 up',P(x+3,y+2)]]:[['Rotate 90° counter-clockwise about the origin',P(-y,x)],['Rotate 180° about the origin',P(-x,-y)],['Rotate 90° clockwise about the origin',P(y,-x)]],[t,ans]=pick(T);return{q:`${t}: ${P(x,y)} goes to…?`,vis:'',ch:sc(ans,[P(-x,y),P(x,-y),P(-x,-y),P(y,x),P(-y,x),P(x+3,y+2)]),hint:'Sketch it on a grid. Reflecting over the y-axis flips the sign of x.'}}},

{name:'Lightning Round',e:'⚡',c:'Games',desc:'How many can you get in 45 seconds? Wrong answers cost nothing.',ages:[0,1,2],play(){let n=0,T=S.nt?Infinity:45,p;window.LRE=()=>{T=0};const L=ACT.filter(x=>x.gen&&x.c!='Mixed'&&(S.all||x.ages.includes(S.age)));const Q=()=>{const a=pick(L);p=a.gen((AQ&&AQ.lvl>=0)?a.ages.reduce((m,x)=>Math.abs(x-AQ.lvl)<Math.abs(m-AQ.lvl)?x:m):(a.ages.includes(S.age)?S.age:a.ages[0]));p.q=a.e+' '+p.q;D()};const D=()=>{$('#app').innerHTML=BAR(`⚡ ${n} correct · ⏱ <span id='tt'>${T==Infinity?'∞':T}</span>${T==Infinity?`<button onclick='LRE()'>Finish</button>`:'s'}`)+`<div class='panel'><h2>⚡ Lightning Round</h2><p class='qt'>${p.q}</p><div class='vis'>${p.vis}</div><div class='opts'>${p.ch.map((c,i)=>`<button data-i='${i}'>${c.t}</button>`).join('')}</div></div>`;document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(p.ch[+b.dataset.i].c){n++;S.gt=(S.gt||0)+10;save();snd(1)}else snd(0);Q()})};const iv=setInterval(()=>{T--;const e=$('#tt');if(!e||T<=0){clearInterval(iv);if(e){reward(n);$('#app').innerHTML=BAR('⚡ Time!')+`<div class='panel'><h2>⚡ Time’s up!</h2><p class='qt'>You got ${n} right: +${n} stars and +${n*10}s game time!</p><button onclick='home()'>Back to activities</button></div>`}return}e.textContent=T==Infinity?'∞':T},1000);Q()}},
{name:'Number Hunt',e:'🔦',c:'Games',desc:'Tap every number that fits the rule.',ages:[0,1,2],play(l){let rd=0,tot=0;const isP=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d==0)return false;return true};const N=()=>{const k=l==0?pick([2,5,10]):l==1?pick([3,4,6,7,9]):0,rule=l==2?'a prime number':'a multiple of '+k,ok=n=>l==2?isP(n):n%k==0,pool=[...Array(l==0?30:l==1?60:50).keys()].map(x=>x+2),good=shuf(pool.filter(ok)).slice(0,5),bad=shuf(pool.filter(x=>!ok(x))).slice(0,7),C=shuf([...good,...bad]).map(v=>({v,ok:ok(v),s:0}));const R=()=>{$('#app').innerHTML=BAR(`Round ${rd+1}/3 · +${tot}⭐`)+`<div class='panel'><h2>🔦 Number Hunt</h2><p class='qt'>Tap every number that is <b>${rule}</b>.</p><div class='opts'>${C.map((c,i)=>`<button data-i='${i}' aria-pressed='${!!c.s}' style='${c.s?'background:var(--acc2);border-color:var(--acc)':''}'>${c.v}</button>`).join('')}</div><div class='bar'><button id='ck'>Check</button></div><p id='fb' role='status' aria-live='polite'></p></div>`;document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(C.done)return;C[+b.dataset.i].s^=1;R()});$('#ck').onclick=()=>{C.done=1;const g=C.filter(c=>c.s&&c.ok).length,w=C.filter(c=>c.s&&!c.ok).length,m=C.filter(c=>c.ok&&!c.s).length,pts=Math.max(0,g-w-m);tot+=pts;if(pts)reward(pts);rd++;$('#fb').textContent=`Found ${g} of ${good.length}. Mistakes: ${w}, missed: ${m}. +${pts} stars`;$('#ck').textContent=rd<3?'Next round →':'Finish';$('#ck').onclick=()=>rd<3?N():home()};if(C.done)return};R()};N()}},

const LES={'Arithmetic':'Break big problems into small steps. Example: 47 + 38 → 47 + 30 = 77, then 77 + 8 = 85.','Number Sense':'Negative numbers sit left of zero. Subtracting a negative is the same as adding: 5 − (−3) = 8.','Number Theory':'A prime has only two factors. The GCF is the biggest shared factor and the LCM is the smallest shared multiple. Example: GCF(12, 18) = 6.','Fractions & Decimals':'A fraction is a division: 3/4 = 3 ÷ 4 = 0.75 = 75%. To add fractions, first give them the same bottom number.','Ratios & Rates':'A ratio compares amounts. Scale both parts the same way: 2:3 = 4:6. A rate divides by one unit: 120 km in 2 h is 60 km/h.','Patterns':'Look at the gap between terms. Adding the same amount each time is arithmetic, multiplying is geometric. Example: 3, 6, 12 → ×2.','Powers & Roots':'a² means a × a. A root undoes a power: √49 = 7. A log asks which power makes the number: log base 2 of 8 = 3.','Algebra':'Treat an equation like a balance: do the same thing to both sides. Example: x + 5 = 12 → x = 7.','Geometry':'Area covers a surface, perimeter goes around it, volume fills a solid. Example: a 3 by 4 rectangle has area 12 and perimeter 14.','Trigonometry':'In a right triangle: sin = opposite ÷ hypotenuse, cos = adjacent ÷ hypotenuse, tan = opposite ÷ adjacent (SOH-CAH-TOA).','Probability & Stats':'Probability = ways it can happen ÷ all possible ways. The mean is the total ÷ how many; the median is the middle value.','Discrete':'Counting: multiply the choices. Logic: AND needs both true, OR needs one. Binary uses only 0 and 1, with place values 1, 2, 4, 8…','Calculus':'A derivative is a rate of change: x² becomes 2x. An integral adds up tiny slices to find area: the integral of 2x from 0 to 3 is 9.','Linear Algebra':'A vector is an arrow with numbers (a, b). The dot product is a·c + b·d. The determinant of [a b; c d] is ad − bc.','Advanced':'The imaginary unit i satisfies i² = −1. Multiply complex numbers like brackets, then swap i² for −1.','Meas function sortGen(l){const pr=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i==0)return false;return true};let lab,fn,h;if(l==0){lab=['Even','Odd'];fn=n=>n%2?1:0;h='Even numbers end in 0, 2, 4, 6 or 8.'}else if(l==1){lab=['Multiple of 3','Not a multiple of 3'];fn=n=>n%3?1:0;h='Add the digits. If that total is in the 3 times table, so is the number.'}else{lab=['Prime','Not prime'];fn=n=>pr(n)?0:1;h='A prime has exactly two factors: 1 and itself.'}for(;;){const A=new Set();while(A.size<6)A.add(r(l==2?4:1,l==0?30:l==1?60:50));const it=[...A].map(v=>({v,b:fn(v)}));if(it.some(x=>x.b==0)&&it.some(x=>x.b==1))return{q:`Sort each number: ${lab[0]} or ${lab[1]}?`,vis:'',type:'sort',labels:lab,items:shuf(it),ch:dum(),hint:h}}}
