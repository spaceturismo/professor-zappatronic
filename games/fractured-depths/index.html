<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c15">
<title>Fractured Depths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: a pocket D&D roguelike, moody, chunky and readable at arm's length
   IDEA: a handheld console; dungeon screen flips to a battle screen with a parchment text box and a rolling d20
   PICTURE: 8x8 pixel sprites, torch-lit on the map, huge on battle platforms; glitched foes tear in magenta/cyan
   COLOUR: violet-black stone; each reality's hue tints walls, arena and accent; elements and rarities own colours
   TYPE: Silkscreen labels, VT323 text; LAYOUT: HUD, screen, log, d-pad / arena, text box, action grid */
:root{color-scheme:dark;--bg:#100c15;--stone:#211a29;--stone2:#2e2539;--edge:#3d3249;--ink:#efe6f7;--dim:#a99dba;--acc:hsl(var(--h,270),85%,68%);--hp:#e5484d;--xp:#46a758;--gold:#f5c542;--gl:#ff2bd6;--gl2:#2bf0ff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--ink);font:20px/1.15 VT323,ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
button,h1,h2,h3,h4,.px{font-family:Silkscreen,monospace;font-weight:400}
header{background:var(--stone);border:2px solid var(--edge);box-shadow:inset 0 -3px 0 #0006;padding:6px 8px;display:grid;gap:5px}
.top{display:flex;align-items:center;gap:8px;font-size:13px}
.rz{flex:1;color:var(--acc);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frac{color:var(--gl);font-size:13px;text-shadow:1px 0 var(--gl2)}
.gold{color:var(--gold);display:flex;align-items:center;gap:5px;font-size:21px}
.coin{width:10px;height:10px;background:var(--gold);box-shadow:inset -2px -2px 0 #b07d1a;display:inline-block}
.bars{display:flex;gap:8px;align-items:center}
.hp{flex:1;height:20px;background:#3a1418;position:relative;border:2px solid #0008}
#hpf{height:100%;background:linear-gradient(#ff7a7e,var(--hp) 55%,#a8232a);transition:width .2s}
#hpt{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;text-shadow:1px 1px 0 #000}
#lv{font-size:12px;color:#6bd47a;white-space:nowrap}
.xp{height:5px;background:#16261a}#xpf{height:100%;width:0;background:var(--xp);transition:width .2s}
#view{flex:1;position:relative;border:2px solid var(--edge);background:#07050a;overflow:hidden;min-height:180px;box-shadow:inset 0 0 0 2px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#log{height:44px;font-size:19px;line-height:22px;overflow:hidden;padding:0 4px}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div+div{opacity:.5}
#ctrl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{appearance:none;-webkit-appearance:none;border:2px solid var(--edge);background:var(--stone2);color:var(--ink);font-size:12px;box-shadow:inset 0 -4px 0 #0007,inset 0 2px 0 #ffffff14;border-radius:0;min-height:44px;cursor:pointer;touch-action:manipulation;padding:0 6px}
button:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 #0007}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pad button{font-size:18px}.pad .mid{font-size:10px;color:var(--dim)}
button:disabled{opacity:.35;cursor:default}
#desc:not(:disabled){background:var(--acc);color:#120d18;animation:pulse .9s infinite alternate}
@keyframes pulse{to{filter:brightness(1.3)}}
#ov{position:fixed;inset:0;background:#07050ae0;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 12px 28px;z-index:6}
#ov.open{display:flex}
.card{width:100%;max-width:480px;background:var(--stone);border:2px solid var(--edge);box-shadow:0 0 0 4px #0006,inset 0 -4px 0 #0005;padding:18px 16px;margin:auto 0}
h1{font-size:32px;line-height:1.05;margin:4px 0 10px;color:var(--acc);text-shadow:3px 3px 0 #000;text-wrap:balance}
h2{font-size:19px;margin:0 0 8px;line-height:1.2}h3{font-size:15px;margin:2px 0 6px;line-height:1.2}h4{font-size:12px;color:var(--dim);margin:16px 0 6px}
p{margin:6px 0}.sub{color:var(--dim)}.accent{color:var(--acc)}
.reality{border:2px solid var(--acc);padding:10px 12px;margin:12px 0;background:#0004}
.rn{font-family:Silkscreen,monospace;font-size:11px;color:var(--acc)}
.reality ul{margin:6px 0 0;padding:0;list-style:none}.reality li{margin:5px 0}.reality li b{color:var(--acc);font-weight:400}
.item{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #ffffff12}
.item img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.it{flex:1;display:grid}.nm{font-size:20px;line-height:1.05}.nm small{color:var(--gold);font-size:15px}.st{font-size:17px;color:var(--dim);line-height:1.1}
.up{color:#6bd47a;font-size:16px}.down{color:#d7827e;font-size:16px}
.item button{min-width:60px;font-size:10px}
.ghost{background:transparent}
.big{width:100%;margin-top:14px;font-size:15px;min-height:54px;background:var(--acc);color:#120d18;border-color:#0006}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.x{min-width:44px}
.sheet{font-size:19px;background:#0004;padding:6px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 8px}
.sheet b{font-weight:400;color:var(--dim);font-size:15px;display:block}
.reel{margin:14px 0;min-height:70px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--edge);font-size:22px;text-align:center;padding:6px}
.reel .item{border:0;text-align:left;width:100%}
.reel.land{border:2px solid var(--gold);background:#f5c54212}
.dead{color:var(--hp);font-size:28px;text-shadow:3px 3px 0 #000}
.bad{color:#ff8a8a}
.elb{width:8px;align-self:stretch;flex:none}
.gl{color:var(--gl)!important;text-shadow:1px 0 var(--gl2),-1px 0 #ff2b2b;animation:glt 1.2s steps(2) infinite}
@keyframes glt{50%{text-shadow:-2px 0 var(--gl2),2px 0 #ff2b2b}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{display:grid;text-align:left;align-content:start;gap:3px;padding:8px 10px;min-height:60px}
.opt b{font-weight:400;font-size:13px}.opt span{font:17px/1.1 VT323,monospace;color:var(--dim)}
.opt.fated{border-color:var(--gold)}.opt.fated b::after{content:' ★';color:var(--gold)}
.opt.wide{grid-column:1/-1}
.abs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.abtn{display:grid;gap:0;padding:6px;text-align:center;min-height:64px}
.abtn b{font-weight:400;font-size:11px;color:var(--dim)}.abtn strong{font:28px/1 VT323,monospace}.abtn span{font:16px VT323,monospace;color:var(--dim)}
.abtn.sel{border-color:var(--gold);background:#f5c54222}
.feat{font-size:18px;margin:4px 0;padding-left:8px;border-left:3px solid var(--acc)}
.steps{font-family:Silkscreen,monospace;font-size:10px;color:var(--dim);margin-bottom:6px}
/* battle */
#battle{position:fixed;inset:0;z-index:4;display:none;justify-content:center;background:var(--bg)}
#battle.open{display:flex}
.bwrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
.arena{flex:1;min-height:220px;position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:4px;padding:10px;border:2px solid var(--edge);background:linear-gradient(180deg,hsl(var(--h,270),32%,17%),hsl(var(--h,270),22%,9%) 75%);overflow:hidden}
.arena.glitchy{box-shadow:inset 0 0 0 2px var(--gl),inset 0 0 30px #ff2bd655}
.arena::before{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(90deg,#ffffff07 0 16px,transparent 16px 32px),repeating-linear-gradient(0deg,#ffffff07 0 16px,transparent 16px 32px)}
.bh{position:relative;z-index:3;align-self:center;background:var(--stone);border:2px solid var(--edge);padding:6px 8px 7px;box-shadow:inset 0 -3px 0 #0006,3px 3px 0 #0008}
.bn{display:flex;justify-content:space-between;gap:6px;font-family:Silkscreen,monospace;font-size:12px}
.bn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .lv{color:#6bd47a;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:15px;margin:4px 0}
.chips i{font:normal 10px/1.4 Silkscreen,monospace;color:#120d18;background:#ccc;padding:0 4px}
.chips .stt{background:#ff8a8a}.chips .stg{background:#3d3249;color:var(--ink)}.chips .ac{background:#c9d1e3}
.bar{height:10px;background:#0b0810;border:2px solid #000}.bar div{height:100%;width:100%;transition:width .45s,background-color .45s;background:#4fd36a}
.hpn{font-size:18px;text-align:right;line-height:1;margin-top:3px}
.bxp{height:4px;background:#16261a;margin-top:3px}.bxp div{height:100%;background:var(--xp);transition:width .4s}
.mon{position:relative;display:flex;align-items:flex-end;justify-content:center;z-index:1}
.mon img{width:min(34vw,150px);max-height:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;position:relative;z-index:1}
.plat{position:absolute;bottom:2%;left:6%;right:6%;height:26%;border-radius:50%;background:radial-gradient(closest-side,hsl(var(--h,270),30%,36%),hsl(var(--h,270),30%,20%) 70%,transparent)}
.fx{position:absolute;left:15%;right:15%;bottom:10%;aspect-ratio:1;border-radius:50%;opacity:0;z-index:2;pointer-events:none}
.fx.go{animation:fx .45s}
@keyframes fx{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(1.25)}}
.foe img.in{animation:inR .5s}.me img.in{animation:inL .5s}
@keyframes inR{from{transform:translateX(130%)}}@keyframes inL{from{transform:translateX(-130%)}}
.mon img.hit{animation:hit .4s}
@keyframes hit{20%,60%{transform:translateX(-7px);filter:brightness(3)}40%,80%{transform:translateX(7px)}}
.me img.lunge{animation:lungeR .3s}.foe img.lunge{animation:lungeL .3s}
@keyframes lungeR{50%{transform:translate(20%,-14%)}}@keyframes lungeL{50%{transform:translate(-20%,14%)}}
.foe img.glitch{animation:gimg .9s steps(3) infinite}
@keyframes gimg{0%{filter:drop-shadow(4px 0 var(--gl)) drop-shadow(-4px 0 var(--gl2))}33%{transform:translate(-5px,2px) skewX(10deg);filter:drop-shadow(-4px 0 var(--gl)) drop-shadow(4px 0 var(--gl2)) hue-rotate(90deg)}66%{clip-path:inset(18% 0 30% 0);transform:translateX(6px)}}
.mon img.faint{animation:none;transition:transform .6s,opacity .6s;transform:translateY(45%);opacity:0}
.die{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;display:grid;place-items:center;background:#f1eadf;color:#1a1420;font:20px Silkscreen,monospace;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);z-index:5;opacity:0;pointer-events:none}
.die.show{animation:die .8s}
.die.n20{background:var(--gold)}.die.n1{background:#e5484d;color:#fff}
@keyframes die{0%{opacity:0;transform:rotate(-200deg) scale(.4)}30%{opacity:1;transform:rotate(0) scale(1.15)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.bmsg{min-height:76px;background:#f1eadf;color:#1a1420;border:3px solid #1a1420;box-shadow:0 0 0 2px var(--edge),inset 0 -3px 0 #0002;padding:8px 12px;font-size:22px;line-height:1.08}
.bmsg b{font-family:Silkscreen,monospace;font-weight:400;font-size:14px}
.bmenu{min-height:182px;display:flex;flex-direction:column;gap:6px}
.mvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.mv,.lcard{display:grid;text-align:left;align-content:center;gap:2px;padding:6px 8px 8px 10px;border-left:8px solid var(--el);min-height:58px}
.mv b,.lcard b{font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv span,.lcard span{font:17px/1 VT323,monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard span{white-space:normal}
.mv .se{color:#6bd47a}.mv .nve{color:#d7827e}
.brow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.brow.two{grid-template-columns:1fr 1fr}
.brow .atk{background:#4a2b2e;border-color:#7a3b40}
.ilist{display:grid;gap:6px;max-height:38vh;overflow-y:auto}
.bi{display:flex;gap:8px;align-items:center;text-align:left;padding:6px 8px}.bi img{width:28px;height:28px;image-rendering:pixelated}.bi span{display:grid;flex:1}.bi small{font:17px VT323,monospace;color:var(--dim)}
.loot{display:flex;gap:8px;align-items:center;background:var(--stone2);border:2px solid var(--edge);padding:6px 8px}
.loot img{width:30px;height:30px;image-rendering:pixelated;flex:none}.loot .it b{font-weight:400;font-size:19px;line-height:1}.loot button{min-width:64px;font-size:10px}
.bhead{font-family:Silkscreen,monospace;font-size:11px;color:var(--dim)}
.info{font-size:18px;max-height:38vh;overflow-y:auto;background:#0004;padding:6px 8px}
.info p{margin:3px 0}
.dlg .who{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.dlg .who img{width:72px;height:72px;image-rendering:pixelated;background:#0005;border:2px solid var(--edge);flex:none}
.dlg h2{margin:0}
.say{font-size:22px;line-height:1.15;margin:10px 0}
.roll{font-size:17px;background:#0005;padding:4px 8px;border-left:3px solid var(--gold);color:var(--gold)}
.dopts{display:grid;gap:6px}
.dopt{text-align:left;padding:8px 10px;font:20px/1.1 VT323,monospace;min-height:46px}
.dopt em{font:normal 10px Silkscreen,monospace;color:var(--gold)}
.dopt.fight{border-color:#7a3b40;background:#3a2226}
.price{color:var(--gold);font-weight:400}
.swrow{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.sw{width:36px;min-height:36px;height:36px;padding:0;border:2px solid var(--edge)}.sw.sel{outline:3px solid var(--gold);outline-offset:1px}
.chip{min-height:36px;font-size:10px;padding:0 8px}.chip.sel{background:var(--acc);color:#120d18}
.preview{display:flex;gap:16px;justify-content:center;background:#0005;padding:10px;margin:8px 0}
.preview img{width:96px;height:96px;image-rendering:pixelated}
#nameIn{width:100%;font:24px VT323,monospace;background:#0006;color:var(--ink);border:2px solid var(--edge);padding:6px 10px;min-height:44px}
#nameIn:focus{outline:2px solid var(--acc)}
.rep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:18px;margin:6px 0}.rep .rb{grid-column:1/-1}
.rep .rb{height:8px;background:#0006;position:relative}.rep .rb i{position:absolute;top:0;bottom:0}.rep .rb::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}
.qst{border-left:3px solid var(--gold);padding:4px 8px;margin:6px 0;background:#0003}.qst b{font-weight:400;font-size:19px}.qst.ready{border-color:#6bd47a}.qst.failed,.qst.done{opacity:.55}
.skl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;font-size:17px}.skl .pf{color:var(--gold)}
#arena .bh:first-child{cursor:pointer}
.guide{position:absolute;left:6px;right:6px;top:6px;z-index:2;display:flex;gap:8px;align-items:center;background:#211a29eb;border:2px solid var(--edge);border-left:4px solid var(--gold);padding:4px 6px;font-size:18px;line-height:1.05}
.guide img{width:28px;height:28px;image-rendering:pixelated;flex:none}.guide span{flex:1;display:grid}.guide b{font:10px Silkscreen,monospace;color:var(--gold);font-weight:400}.guide button{min-height:38px;min-width:42px;font-size:14px}
.tipc{border-color:var(--gold)}.tipc .rn{color:var(--gold)}
.tipline{border-left:3px solid var(--gold);padding:4px 8px;background:#0004;font-size:18px}
.hbtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.hb p{font-size:19px;line-height:1.2}
.et{width:100%;border-collapse:collapse;font-size:18px}.et th,.et td{text-align:left;padding:3px 6px;border-bottom:1px solid #ffffff15}.et th{font:10px Silkscreen,monospace;color:var(--dim)}
@media(max-height:660px){.pad{grid-template-rows:repeat(3,44px)}#log{height:22px}#log div+div{display:none}.bmenu{min-height:156px}.mv{min-height:50px}}
@media(max-width:350px){.pad{grid-template-columns:repeat(3,50px)}.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#desc:not(:disabled),.gl,.foe img.glitch{animation:none}.mon img.in,.mon img.hit,.mon img.lunge,.fx.go,.die.show{animation:none}.die.show{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><span id="dep" class="px">D1</span><span id="frac" class="px"></span><span id="rz" class="rz"></span><span class="gold"><i class="coin"></i><b id="gold">0</b></span></div>
    <div class="bars"><div class="hp"><div id="hpf"></div><span id="hpt"></span></div><span id="lv" class="px">Lv 1</span></div>
    <div class="xp"><div id="xpf"></div></div>
  </header>
  <div id="view"><canvas id="cv"></canvas><div id="guide" class="guide" hidden></div></div>
  <div id="log" aria-live="polite"></div>
  <div id="ctrl">
    <div class="pad">
      <span></span><button data-d="0,-1" aria-label="Move up">▲</button><span></span>
      <button data-d="-1,0" aria-label="Move left">◀</button><button id="waitb" class="mid">Wait</button><button data-d="1,0" aria-label="Move right">▶</button>
      <span></span><button data-d="0,1" aria-label="Move down">▼</button><span></span>
    </div>
    <div class="acts">
      <button id="bagb">Hero</button>
      <button id="movb">Skills</button>
      <button id="desc" disabled>Descend</button>
      <button id="menub">Journal</button>
    </div>
  </div>
</div>
<div id="battle"><div class="bwrap">
  <div class="arena" id="arena">
    <div class="bh"><div class="bn"><span id="bfN"></span><span id="bfL" class="lv"></span></div><div class="chips" id="bfC"></div><div class="bar"><div id="bfH"></div></div></div>
    <div class="mon foe"><div class="plat"></div><img id="bfS" alt=""><div class="fx" id="bfF"></div></div>
    <div class="mon me"><div class="plat"></div><img id="bpS" alt=""><div class="fx" id="bpF"></div></div>
    <div class="bh"><div class="bn"><span id="bpN">You</span><span id="bpL" class="lv"></span></div><div class="chips" id="bpC"></div><div class="bar"><div id="bpH"></div></div><div class="hpn" id="bpT"></div><div class="bxp"><div id="bpX"></div></div></div>
    <div class="die" id="die"></div>
  </div>
  <div class="bmsg" id="bmsg" aria-live="polite"></div>
  <div class="bmenu" id="bmenu"></div>
</div></div>
<div id="ov"></div>
<script>
{
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rollD=(n,d)=>{let t=0;for(let i=0;i<n;i++)t+=1+Math.floor(Math.random()*d);return t};
const d20=()=>rnd(1,20);
const md=s=>Math.floor((s-10)/2),sg=n=>(n>=0?'+':'')+n;
const W=36,H=36,DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const idx=(x,y)=>y*W+x;
const AB=['str','dex','con','int','wis','cha'],ABN={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};

/* ---------- persistent meta ---------- */
const KEY='fractured-depths-v3';

const cache={};let TP={};
function spr(name,over,tint){
  const key=name+'|'+(over?(over.__k||JSON.stringify(over)):'')+'|'+(tint||'');
  if(cache[key])return cache[key];
  const c=document.createElement('canvas');c.width=c.height=8;const g=c.getContext('2d');
  SPR[name].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;g.fillStyle=tint?(tint===true?'#fff':tint):(over&&over[ch])||PAL[ch]||'#f0f';g.fillRect(x,y,1,1)}));
  return cache[key]=c;
}
const urls={};
function url(name,over){const k=name+JSON.stringify(over||{});return urls[k]||(urls[k]=spr(name,over).toDataURL())}

function spellMod(A,D){

  if(best===-9)for(const c in P.cls)if(CLS[c].cast)best=Math.max(best,D.m[CLS[c].cast]);
  if(best===-9)best=Math.max(D.m.int,D.m.wis,D.m.cha);

function resolveEl(A,foe){

/* ---------- map generation ---------- */
const WALKT=[0,1,1,1,1,0,0,0,0];
const walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&WALKT[T[idx(x,y)]]===1;

function bfs(sx,sy,lim){

  for(let h=0;h<q.length;h++){const i=q[h],x=i%W,y=(i/W)|0;if(d[i]>=lim)continue;
    for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(!walk(nx,ny))continue;const j=idx(nx,ny);if(d[j]<0){d[j]=d[i]+1;q.push(j)}}}

      if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
      for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)T[idx(xx,yy)]=1;
      rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
    }
  }while(rooms.length<5);
  const dig=(a,b)=>{let x=a.cx,y=a.cy;
    const sx=()=>{while(x!==b.cx){T[idx(x,y)]=1;x+=Math.sign(b.cx-x)}},sy=()=>{while(y!==b.cy){T[idx(x,y)]=1;y+=Math.sign(b.cy-y)}};
    if(Math.random()<.5){sx();sy()}else{sy();sx()}T[idx(x,y)]=1};
  for(let i=1;i<rooms.length;i++){let best=0,bd=1e9;for(let j=0;j<i;j++){const d=Math.abs(rooms[i].cx-rooms[j].cx)+Math.abs(rooms[i].cy-rooms[j].cy);if(d<bd){bd=d;best=j}}dig(rooms[i],rooms[best])}
  for(let k=0;k<2;k++)dig(pick(rooms),pick(rooms));
  seen=new Uint8Array(W*H);vis=new Uint8Array(W*H);ents=[];objs=[];
  const st=rooms[0];P.x=P.rx=camX=st.cx;P.y=P.ry=camY=st.cy;
  const dist=bfs(P.x,P.y,999);let far=rooms[1];
  for(const r of rooms)if(dist[idx(r.cx,r.cy)]>dist[idx(far.cx,far.cy)])far=r;
  stairs={x:far.cx,y:far.cy};T[idx(stairs.x,stairs.y)]=2;

  const spot=r=>{for(let t=0;t<30;t++){const x=rnd(r.x,r.x+r.w-1),y=rnd(r.y,r.y+r.h-1);if(T[idx(x,y)]===1&&!blocked(x,y)&&!objs.some(o=>o.x===x&&o.y===y))return{x,y}}return null};

  for(let i=0,n=rnd(2,4);i<n;i++){const p=spot(pick(rooms));if(p)objs.push({...p,k:'gold',amt:rnd(3,8)+depth*2})}
  for(let i=0,n=rnd(1,2);i<n;i++){const p=spot(pick(others));if(p)objs.push({...p,k:'cons',id:rollCons()})}
  if(Math.random()<.3){const p=spot(pick(others));if(p)objs.push({...p,k:'fountain',block:1})}
  if(Math.random()<.3){const p=spot(pick(others));if(p)objs.push({...p,k:'item',it:makeItem()})}
  if(Math.random()<.25){const p=spot(pick(others)),id=scrollFor();if(p&&id)objs.push({...p,k:'tome',id})}

function los(x0,y0,x1,y1){

function saveRoll(c,stat,dc,cond){

function resist(c,el,fromMe){

async function eor(){
  for(const c of [B.pl,B.en]){
    if(HP(c)<=0)continue;
    for(const z of [...c.dots]){
      let v=rollD(z.dn,z.dd)+(z.add||0),t='';
      if(z.save){const s=saveRoll(c,z.save,z.dc);if(s.ok){v=Math.floor(v/2);t=' (saved, half)'}}
      const res=await applyDmg(c,[[v,z.el]],!c.me);await say(`${z.n} sears ${c.me?'you':'the '+c.name} for ${res.tot}${t}.`,750);
      if(--z.r<=0)c.dots.splice(c.dots.indexOf(z),1);if(HP(c)<=0)break;
    }
    if(HP(c)<=0)continue;
    if(c.cond==='burn'||c.cond==='poison'){const L=c.me?lvl():c.e.lv,res=await applyDmg(c,[[c.cond==='burn'?rollD(1+Math.floor(L/4),6):rollD(1+Math.floor(L/4),4),c.cond==='burn'?'Fire':'Venom']],!c.me);await say(`${nm(c)} ${be(c)} hurt by ${c.cond==='burn'?'flames':'poison'}: ${res.tot}.`,700)}
    if(c.cond&&c.cond!=='held'&&--c.condR<=0){const w=c.cond;c.cond=null;await say(`${nm(c)} ${be(c)} no longer ${CONDN[w]}.`,600)}
    for(const k in c.fx)if(--c.fx[k].r<=0)delete c.fx[k];
    if(c.mark&&--c.mark.r<=0)c.mark=null;
  }
  B.round++;B.uncanny=0;bui();
}
async function turn(act){
  if(!B||B.busy)return;
  if(act.k==='run'&&B.en.e.m.boss){$('#bmsg').textContent="There's no running from a Warden!";return}
  B.busy=true;$('#bmenu').innerHTML='';
  for(const who of B.order){
    if(who==='p'){if(await canAct(B.pl)){const pr=await pTurn(act);if(pr==='fled')return endBattle('run');if(pr==='talked')return talkWin()}}
    else if(!(B.round===1&&!B.pFirst&&!B.eDone)) await eTurn();
    if(await faint())return;
  }

  await eor();if(await faint())return;

async function faint(){

    if(RACES[P.race].relentless&&!B.relent){B.relent=1;P.hp=1;bui();await say('Relentless! You refuse to fall and stand at 1 HP.',1000);return false}
    if(P.revive){P.revive=0;P.hp=Math.round(derive().maxhp*.5);bui();flash(B.pl,'Holy');await say('Second Wind! You rise again.',1100);return false}
    $('#bpS').classList.add('faint');await say('You collapse…',1300);killer=B.en.name;closeBattle();B=null;die();return true;
  }

async function victory(){
  const e=B.en.e,m=e.m,D=derive();gEv('win');
  const xp=Math.round(10*Math.pow(e.lv,1.5)*m.xp*(e.gl?3:1)*(m.boss?3:1)*mod.xp*(1+.2*P.frac)*(RACES[P.race].xp||1));
  const gold=Math.round((4+e.lv*3)*(1+P.frac*.3)*(e.gl?3:1)*(m.boss?4:1)*mod.gold);
  P.xp+=xp;P.gold+=gold;P.kills++;if(e.gl){P.glitchKills++;addRep('rift',2)}questKill(e);if(e.k==='goblin'||e.k==='chief')addRep('goblins',-2);
  if(has('darkone'))heal(B.pl,Math.max(1,D.m.cha)+cl('warlock'));
  const gb=(e.gl?2:0)+(m.boss?2:0)+P.frac*.5,loot=[];
  if(m.boss||e.gl||Math.random()<.5)loot.push({k:'gear',it:makeItem(gb,null,e.gl&&Math.random()<.5)});
  if(m.boss||e.gl||e.qid)loot.push({k:'gear',it:makeItem(gb+(e.qid?1:0))});
  if(Math.random()<.65)loot.push({k:'cons',id:rollCons()});
  if(e.gl&&Math.random()<.5)loot.push({k:'cons',id:rollCons()});
  if(Math.random()<(m.boss?.7:e.gl?.45:.1)){const id=scrollFor();if(id)loot.push({k:'scroll',id})}
  if(!loot.length)loot.push({k:'cons',id:'potion'});

  for(;;){
    const free=10-P.bag.length;
    const row=(l,i)=>{let img,name,sub,col='';
      if(l.k==='gear'){img=ico(l.it);name=l.it.name;col=RAR[l.it.r].c;const df=cmpItem(l.it);sub=`${RAR[l.it.r].n} ${l.it.slot==='ring'?'trinket':l.it.slot} · ${itemTxt(l.it)} · <span class="${df>0?'up':'down'}">${df>0?'▲ upgrade':'▼ weaker'}</span>`}
      else if(l.k==='cons'){img=`<img src="${consUrl(l.id)}" alt="">`;name=CONS[l.id].n;sub=CONS[l.id].d}
      else{img=`<img src="${url('tome',{x:EL[ABI[l.id].el]||'#fff'})}" alt="">`;name='Scroll: '+ABI[l.id].n;sub=abDesc(ABI[l.id])}
      return `<div class="loot">${img}<div class="it"><b style="color:${col}" class="${l.k==='gear'&&l.it.r===5?'gl':''}">${esc(name)}</b><span class="st">${sub}</span></div>${l.taken?'<span class="st">Taken</span>':l.k==='gear'&&free<=0?'<span class="st">Bag full</span>':`<button data-pick="t${i}">Take</button>`}</div>`};
    $('#bmsg').innerHTML=`<b>Victory!</b> +${xp} XP · +${gold} gold${e.gl?' · <span class="gl">glitch bounty</span>':''}`;
    const v=await choose(`<div class="ilist">${loot.map(row).join('')}</div><div class="brow two"><button data-pick="all">Take all</button><button data-pick="done">Continue</button></div>`);
    if(v==='done')break;
    if(v==='all'){loot.forEach(take);break}
    if(v&&v[0]==='t')take(loot[+v.slice(1)]);
  }
  function take(l){if(l.taken)return;
    if(l.k==='gear'){if(P.bag.length>=10)return;P.bag.push(l.it)}
    else if(l.k==='cons')P.items[l.id]++;

function lie(q,n){q.status='done';q.lied=1;npcs.splice(npcs.indexOf(n),1);const g=gain(25+depth*4);addRep('syndicate',4);return N(`They press ${g} gold into your hand and vanish into the dark.`,[O('Leave.')])}

/* ---------- quests ---------- */
let QID=0;
function genQuest(type,giver){
  let d=depth+rnd(1,2);while(isTown(d))d++;
  const q={id:++QID,type,giver:giver?giver.name:'The Guild',fac:giver&&ROLES[giver.role].fac||'guild',status:'offer',have:0,n:1,d:null};
  const mons=Object.keys(MON).filter(k=>!MON[k].boss&&MON[k].d<=depth+2&&!MON[k].person);
  if(type==='slay'){q.mon=pick(mons);q.n=rnd(3,5);q.title=`Cull the ${MON[q.mon].n}s`;q.desc=`Slay ${q.n} ${MON[q.mon].n}s anywhere in the Depths.`}
  else if(type==='hunt'){q.mon=pick(mons);q.named=`${pick(FIRST)} ${pick(EPI)}`;q.d=d;q.title=`Hunt ${q.named}`;q.desc=`${q.named}, a monstrous ${MON[q.mon].n}, prowls depth ${d}. Kill it there.`}
  else if(type==='recover'){q.obj=pick(HEIR);q.d=d;q.title=`Recover the ${q.obj}`;q.desc=`${q.giver}’s ${q.obj} was lost on depth ${d}. Find it before you go deeper.`;q.fac='towns'}
  else if(type==='rescue'){const p=newName();q.person=`${p.first} ${p.last}`;q.d=d;q.title=`Find ${p.first}`;q.desc=`${q.giver.split(' ')[0]}’s ${pick(KIN)}, ${q.person}, went missing on depth ${d}.`;q.fac='towns';q.twist=Math.random()<.35}
  else if(type==='deliver'){const p=newName();q.target=`${p.first} ${p.last}`;q.d=nextTown();q.title='Deliver a sealed letter';q.desc=`Carry ${q.giver.split(' ')[0]}’s letter to ${q.target} in the next town (depth ${q.d}).`;q.fac='towns'}
  else if(type==='cleanse'){q.n=rnd(2,4);q.title='Lay the dead to rest';q.desc=`Destroy ${q.n} undead (Skeletons, Wraiths, Drowned).`;q.fac='temple'}
  else if(type==='glitch'){q.n=1+(P.frac>2?1:0);q.title='Mend the static';q.desc=`Destroy ${q.n} Glitched creature${q.n>1?'s':''}. Cross a rift if you must.`;q.fac='rift'}
  else if(type==='tribute'){q.title='A discreet withdrawal';q.desc='Lift the strongbox from a merchant in the next town. Don’t get caught.';q.fac='syndicate';q.d=nextTown()}
  q.gold=Math.round((35+depth*15)*({hunt:1.5,glitch:2,tribute:1.3}[type]||1));q.xp=Math.max(10,Math.round(need()*({hunt:.4,glitch:.5}[type]||.3)));q.item=Math.random()<.5||type==='hunt';
  return q;
}
const rwTxt=q=>`Reward: ${q.gold} gold, ${q.xp} XP${q.item?', an item':''}, ${FAC[q.fac].n} reputation`;
function questOffer(n,q){
  if(q.status!=='offer')return N(q.status==='active'?'“Still waiting on that job.”':'“Nothing more for now.”',[back(n)]);
  return N(`“${q.desc}”  ${rwTxt(q)}.`,[O('I’ll do it.',()=>{acceptQuest(q);return N('“Good. Don’t make me regret this.”',[back(n)])},{dis:()=>P.quests.filter(x=>x.status==='active').length>=6}),O('Not now.',()=>rootNode(n,'Suit yourself.'))]);
}
function acceptQuest(q){tip('quest');gEv('quest');q.status='active';P.quests.push(q);log(`Quest accepted: ${q.title}`,'var(--gold)')}
function payQuest(q){
  const gm=1+Math.max(0,P.rep.guild)/100;P.gold+=Math.round(q.gold*gm);P.xp+=q.xp;addRep(q.fac,12);if(q.fac!=='guild')addRep('guild',3);
  if(q.item)giveItem(makeItem(1.5+P.frac*.3));q.status='done';log(`Quest complete: ${q.title}`,'var(--gold)');
}
function questOpts(n){
  const o=[];
  if(n.quest&&n.quest.status==='offer'&&!['captain','fence','riftwarden','guild'].includes(n.role))o.push(O(`[Quest] ${n.quest.title}`,()=>questOffer(n,n.quest)));
  return o;
}
function boardNode(n){
  const ready=P.quests.filter(q=>q.status==='ready');
  const offers=TOWN?TOWN.offers.filter(q=>q.status==='offer'):[];
  return N(ready.length?'“You’ve got work to report? Let’s see it.”':'Parchment notices flutter on the board. Some are stained with things that aren’t ink.',[
    ...ready.map(q=>O(`Turn in: ${q.title}`,()=>{payQuest(q);return N(`“${pick(['Fine work.','The Guild thanks you.','Word travels fast. Here.'])}” ${rwTxt(q)}${q.lied?' (minus the part you lied about)':''}.`,[O('Back to the board.',()=>boardNode(n))])})),
    ...offers.map(q=>O(`${q.title}: ${q.desc}`,()=>N(`${rwTxt(q)}.`,[O('Accept.',()=>{acceptQuest(q);return boardNode(n)},{dis:()=>P.quests.filter(x=>x.status==='active').length>=6}),O('Back.',()=>boardNode(n))]))),
    O('Done.')]);
}
function questKill(e){
  for(const q of P.quests){if(q.status!=='active')continue;

function talkOpts(e){

elements:['Elements',`<p>Every monster has an element (the coloured corner on the map). Hitting a weakness deals double damage; a resisted hit deals half.</p><table class="et"><tr><th>Attack</th><th>Strong vs</th><th>Weak vs</th></tr>${[['Fire','Frost, Venom','Fire, Water'],['Frost','Water','Frost, Fire'],['Water','Fire','Water, Frost'],['Venom','Normal','Venom, Shadow'],['Holy','Shadow','Holy'],['Shadow','Holy','Shadow'],['Normal','none','Shadow']].map(([a,b,c])=>`<tr><td style="color:${EL[a]}">${a}</td><td>${b}</td><td>${c}</td></tr>`).join('')}</table><p>Elemental Adept (a feat) ignores resistance. Your ancestry may resist an element too.</p>`],

/* ---------- death & echoes ---------- */
const ECHAB={str:'Giant’s Memory',dex:'Cat’s Memory',con:'Ox’s Memory',int:'Sage’s Memory',wis:'Owl’s Memory',cha:'Siren’s Memory'};
function rollEcho(){
  const opts=[],items=[...Object.values(P.eq),...P.bag].filter(it=>it&&!it.echo&&it.r>0);
  items.forEach(it=>opts.push([2.5,()=>{const c=JSON.parse(JSON.stringify(it));c.echo=1;c.bonus=Math.max(0,(c.bonus||0)-1);
    for(const k in c.st)if(typeof c.st[k]==='number'&&k!=='crit')c.st[k]=k==='ls'?+(c.st[k]*.75).toFixed(2):Math.max(1,Math.round(c.st[k]*.75));
    return{type:'item',item:c,n:c.name,d:`Faded echo · ${itemTxt(c)}`}}]));
  Object.keys(P.known).filter(id=>id!=='attack'&&ABI[id].cls.length).forEach(id=>opts.push([1.4,()=>({type:'tech',id,n:`Technique Memory: ${ABI[id].n}`,d:`Know ${ABI[id].n} in every life, whatever your class.`})]));
  AB.forEach(k=>opts.push([.9,()=>({type:'abil',k,v:1,n:`${ECHAB[k]} +1 ${ABN[k]}`,d:`Begin every life with +1 ${ABN[k]}.`})]));
  opts.push([1.2,()=>({type:'items',items:{potion:2,ether:1},n:'Satchel Memory',d:'Begin every life with 2 extra Potions and a Draught.'})]);
  if(!meta.echoes.some(e=>e.type==='sense'))opts.push([1,()=>({type:'sense',n:"Cartographer's Ghost",d:'The stairs are revealed on every floor.'})]);
  if(!meta.echoes.some(e=>e.type==='revive'))opts.push([1,()=>({type:'revive',n:'Second Wind',d:'Once per life, survive a fatal blow at 50% HP.'})]);
  let x=Math.random()*opts.reduce((a,o)=>a+o[0],0);
  for(const o of opts)if((x-=o[0])<=0)return o[1]();
  return opts[0][1]();
}
function eIco(e){
  if(e.type==='item')return ico(e.item);
  if(e.type==='tech')return `<img src="${url('tome',{x:EL[ABI[e.id].el]||'#fff'})}" alt="">`;
  const a=e.type==='abil'?['ring',{x:'#ffae2b'}]:e.type==='items'?['potion']:e.type==='sense'?['eye']:['heart',{r:'#7fe3e8'}];
  return `<img src="${url(a[0],a[1])}" alt="">`;
}
const echoHTML=e=>`<div class="item">${eIco(e)}<div class="it"><span class="nm ${e.type==='item'&&e.item.r===5?'gl':''}" style="color:${e.type==='item'?RAR[e.item.r].c:'var(--gold)'}">${esc(e.n)}</span><span class="st">${esc(e.d)}</span></div></div>`;
const echoList=()=>meta.echoes.length?meta.echoes.map(echoHTML).join(''):'<p class="sub">None yet. Each death leaves one behind.</p>';
const realityHTML=r=>`<div class="reality"><div class="rn">Reality #${r.n}</div><h3>${esc(r.name)}</h3><ul>${r.mods.map(id=>{const m=MODS.find(o=>o.id===id);return m?`<li><b>${esc(m.n)}.</b> ${esc(m.d)}</li>`:''}).join('')}${r.fated?`<li><b>Fated:</b> ${RACES[r.fated.race].n} and ${CLS[r.fated.cls].n}</li>`:''}</ul></div>`;
function die(){
  P.hp=0;dead=true;meta.deaths++;meta.best=Math.max(meta.best,depth);
  const old=runR,echo=rollEcho();let lost=null;
  meta.echoes.push(echo);
  if(meta.echoes.length>3)lost=meta.echoes.splice(Math.floor(Math.random()*3),1)[0];
  newReality();save();ui();
  setTimeout(()=>deathScreen(old,echo,lost),600);
}
function deathScreen(old,echo,lost){
  show(`<div class="card"><h2 class="dead">You died</h2><p class="sub">${esc(P.name)}, ${RACES[P.race].n} ${Object.entries(P.cls).map(([k,v])=>CLS[k].n+' '+v).join(' / ')} · felled by the ${esc(killer)} on depth ${depth}</p><p class="sub">${P.kills} victories · ${P.realities} realit${P.realities>1?'ies':'y'} crossed · Fracture ${P.frac} · ${P.glitchKills} glitches slain · ${P.quests.filter(q=>q.status==='done').length} quests done · ${P.peace} talked down</p><p>${esc(old.name)} fractures. Something follows you out…</p><div class="reel" id="reel">…</div><div id="after"></div></div>`,true);
  const names=[...Object.values(ECHAB),'Satchel Memory',"Cartographer's Ghost",'Second Wind',...Object.keys(P.known).map(id=>ABI[id].n),...[...Object.values(P.eq),...P.bag].filter(Boolean).map(i=>i.name)];
  let t=0;const reel=$('#reel');
  const iv=setInterval(()=>{
    reel.textContent=pick(names);

      $('#after').innerHTML=(lost?`<p class="bad">${esc(lost.n)} shattered. Only three echoes can follow you.</p>`:'')+`<h4>Your echoes (${meta.echoes.length}/3)</h4>${echoList()}<h4>A new reality forms</h4>${realityHTML(meta.cur)}<button class="big" id="go">Forge a new hero</button>`;
      $('#go').onclick=newLife}
  },75);
}

function bag(){
  gEv('hero');
  if(busy()&&!ovOpen())return;
  const D=derive(),C=Object.keys(P.cls).filter(c=>CLS[c].cast);
  const slot=(k,l)=>{const it=P.eq[k];return `<div class="item">${it?ico(it):''}<div class="it"><span class="nm ${it&&it.r===5?'gl':''}" style="color:${it?RAR[it.r].c:'var(--dim)'}">${it?esc(it.name):'No '+l}</span><span class="st">${it?itemTxt(it):'Empty slot'}</span></div>${it?`<button data-un="${k}">Remove</button>`:''}</div>`};
  const rows=P.bag.map((it,i)=>{const df=cmpItem(it);
    return `<div class="item">${ico(it)}<div class="it"><span class="nm ${it.r===5?'gl':''}" style="color:${RAR[it.r].c}">${esc(it.name)}</span><span class="st">${RAR[it.r].n} ${it.slot==='ring'?'trinket':it.slot} · ${itemTxt(it)}</span><span class="${df>0?'up':'down'}">${df>0?'▲ Upgrade':df===0?'= Same':'▼ Weaker'}</span></div><button data-eq="${i}">Equip</button><button data-dr="${i}" class="ghost">Drop</button></div>`}).join('');
  const cons=Object.entries(P.items).filter(([,v])=>v>0).map(([k,v])=>`<div class="item"><img src="${consUrl(k)}" alt=""><div class="it"><span class="nm">${CONS[k].n} ×${v}</span><span class="st">${CONS[k].d}</span></div>${CONS[k].field?`<button data-use="${k}">Use</button>`:'<span class="st">Battle</span>'}</div>`).join('');
  const pass=[];for(const c in P.cls)for(const[l,,t]of PASS[c]||[])if(P.cls[c]>=l)pass.push(t);
  show(`<div class="card"><div class="row"><h2>${esc(P.name)}</h2><button class="x" data-close aria-label="Close">✕</button></div>

  <div class="sheet">${AB.map(k=>`<span><b>${ABN[k]}</b>${D.ab[k]} (${sg(D.m[k])})</span>`).join('')}<span><b>HP</b>${P.hp}/${D.maxhp}</span><span><b>AC</b>${D.ac}</span><span><b>Init</b>${sg(D.init)}</span><span><b>Weapon</b>${sg(D.wHit)}</span><span><b>Damage</b>${D.W.n}d${D.W.d}${sg(D.wDmg)}</span>${C.length?`<span><b>Spell DC</b>${8+D.prof+Math.max(...C.map(c=>D.m[CLS[c].cast]))+D.sp}</span>`:''}<span><b>Crit</b>${D.crit}–20</span></div>
  <h4>Features</h4>${pass.map(t=>`<p class="feat">${esc(t)}</p>`).join('')}${P.feats.map(f=>{const F=FEATS.find(x=>x.id===f);return `<p class="feat">${F.n}: ${F.d}</p>`}).join('')}<p class="feat">${RACES[P.race].n}: ${RACES[P.race].t}</p>
  <h4>Skills (gold = proficient)</h4><div class="skl">${Object.keys(SKN).map(k=>`<span class="${skProf(k)?'pf':''}">${SKN[k]} ${sg(skBonus(k,D))}</span>`).join('')}</div>

const clampHp=()=>{P.hp=Math.min(P.hp,derive().maxhp)};
function show(html,lock){const o=$('#ov');o.innerHTML=html;o.classList.add('open');o.dataset.lock=lock?'1':''}
function hide(){swapId=null;$('#ov').classList.remove('open');ui();flushTips()}
$('#ov').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if('pick' in d){if(ovRes)ovRes(d.pick);return}
  if('close' in d)return hide();
  if(d.tipok)return hide();
  if(d.tipoff){meta.tipsOff=1;save();TQ=TQ.filter(h=>h.includes('Tamsin'));return hide()}
  if(d.guideoff){if(P)P.guide=null;guideBar();TQ=TQ.filter(h=>!h.includes('Tamsin'));return hide()}
  if(d.hb)return handbook(d.hb);
  if(d.hbopen)return handbook();
  if(d.title)return title();
  if(d.tipstoggle){meta.tipsOff=!meta.tipsOff;save();return menu()}
  if(d.tipsreset){meta.tips={};meta.tipsOff=false;save();return menu()}
  if(d.guidestart){P.guide={step:0,f:{},base:{}};hide();guideCheck();return}
  if(d.portal){hide();shiftReality();return}
  if(d.buy!==undefined&&SHOP){const it=SHOP.n.stock[+d.buy],pr=Math.round(itemValue(it)*SHOP.m);if(P.gold>=pr&&P.bag.length<10){P.gold-=pr;P.bag.push(it);SHOP.n.stock.splice(+d.buy,1)}return shopScreen(SHOP.n,SHOP.kind)}
  if(d.buyc&&SHOP){const pr=Math.round(CPRICE[d.buyc]*SHOP.m);if(P.gold>=pr){P.gold-=pr;P.items[d.buyc]++}return shopScreen(SHOP.n,SHOP.kind)}
  if(d.sell!==undefined&&SHOP){const it=P.bag.splice(+d.sell,1)[0];P.gold+=Math.round(itemValue(it)*SHOP.sm);if(SHOP.kind!=='black')SHOP.n.stock.push(it);return shopScreen(SHOP.n,SHOP.kind)}
  if(d.upg){const it=P.eq[d.upg],c=Math.round(((it.bonus||0)+1)*60*priceMult()+depth*12);if(P.gold>=c&&(it.bonus||0)<3){P.gold-=c;it.bonus=(it.bonus||0)+1;it.name=`+${it.bonus} `+it.name.replace(/^\+\d+ /,'');if(it.r<1)it.r=1;log(`Reforged: ${it.name}`,'#ffae2b')}return smithScreen(SHOP.n)}
  if(d.smithshop)return shopScreen(SHOP.n,'smith');
  if(d.eq!==undefined){const it=P.bag.splice(+d.eq,1)[0],cur=P.eq[it.slot];P.eq[it.slot]=it;if(cur)P.bag.push(cur);clampHp();log(`Equipped ${it.name}.`,RAR[it.r].c);bag()}
  else if(d.dr!==undefined){const it=P.bag.splice(+d.dr,1)[0];log(`Dropped ${it.name}.`);bag()}
  else if(d.un){if(P.bag.length>=10)log('Your pack is full.','#ff8a8a');else{P.bag.push(P.eq[d.un]);P.eq[d.un]=null;clampHp()}bag()}
  else if(d.use){useField(d.use);bag()}
  else if(d.equ){if(P.prep.length<4)P.prep.push(d.equ);else swapId=d.equ;movesScreen()}
  else if(d.rep){P.prep[P.prep.indexOf(d.rep)]=swapId;swapId=null;movesScreen()}
  else if(d.uneq){P.prep=P.prep.filter(x=>x!==d.uneq);movesScreen()}
  else if('cancel' in d){swapId=null;movesScreen()}
});

}
function draw(now){
  requestAnimationFrame(draw);
  if(!P||!T||!VW||B)return;
  const L=.32;P.rx+=(P.x-P.rx)*L;P.ry+=(P.y-P.ry)*L;
  for(const e of ents){e.rx+=(e.x-e.rx)*L;e.ry+=(e.y-e.ry)*L}
  camX+=(P.rx-camX)*.18;camY+=(P.ry-camY)*.18;
  cx.fillStyle='#07050a';cx.fillRect(0,0,VW,VH);
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=.85;if(shake<.4)shake=0}
  const ox=Math.round(VW/2-(camX+.5)*TS+sx),oy=Math.round(VH/2-(camY+.5)*TS+sy);
  const x0=Math.max(0,Math.floor(-ox/TS)),x1=Math.min(W-1,Math.ceil((VW-ox)/TS)),y0=Math.max(0,Math.floor(-oy/TS)),y1=Math.min(H-1,Math.ceil((VH-oy)/TS));
  const px=x=>ox+x*TS,py=y=>oy+y*TS,pix=TS/8,t=now||0;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=idx(x,y);if(!seen[i])continue;const k=T[i];
    drawTile(k,x,y,px(x),py(y));
  }
  if(TOWN){cx.textAlign='center';cx.font=`${Math.max(9,Math.round(TS*.28))}px Silkscreen, monospace`;cx.lineWidth=3;cx.strokeStyle='#000';for(const l of TOWN.labels){const X=ox+l.x*TS,Y=oy+l.y*TS+TS*.75;cx.strokeText(l.t,X,Y);cx.fillStyle='#fff';cx.fillText(l.t,X,Y)}}
  for(const o of objs){
    if(!seen[idx(o.x,o.y)])continue;const X=px(o.x),Y=py(o.y);
    const glow=c=>{cx.globalAlpha=.22+.1*Math.sin(t/300);cx.fillStyle=c;cx.beginPath();cx.arc(X+TS/2,Y+TS/2,TS*.42,0,7);cx.fill();cx.globalAlpha=1};
    if(o.k==='item'){const c=RAR[o.it.r].c;glow(c);cx.drawImage(spr(sprOf(o.it),{x:c}),X,Y,TS,TS);if(o.it.r>=3&&Math.sin(t/180+o.x)>.6){cx.fillStyle='#fff';cx.fillRect(X+pix*6,Y+pix,pix,pix)}}
    else if(o.k==='tome'){const c=EL[ABI[o.id].el]||'#fff';glow(c);cx.drawImage(spr('tome',{x:c}),X,Y,TS,TS)}
    else if(o.k==='cons')cx.drawImage(spr(...CONS[o.id].ic),X,Y,TS,TS);
    else if(o.k==='event'){cx.drawImage(o.look?personCanvas(o.look):spr(o.icon[0],o.icon[1]),X,Y,TS,TS);mark(X,Y,'!')}
    else if(o.k==='qitem'){glow('#f5c542');cx.drawImage(spr('ring',{x:'#f5c542'}),X,Y,TS,TS)}
    else if(o.k==='campfire')cx.drawImage(spr('campfire'),X,Y-(Math.sin(t/110)>.4?pix:0),TS,TS);
    else if(o.k==='portal'){const cxp=X+TS/2,cyp=Y+TS/2;glow('#ff2bd6');cx.lineWidth=Math.max(2,pix);for(let i=0;i<3;i++){cx.strokeStyle=`hsl(${(t/6+i*110)%360},95%,65%)`;cx.beginPath();cx.ellipse(cxp,cyp,TS*(.4-i*.1),TS*(.46-i*.12),t/500*(i%2?-1:1),0,6.3);cx.stroke()}}
    else cx.drawImage(spr(o.k,o.dry?{c:'#3d3249'}:null),X,Y,TS,TS);
  }
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=idx(x,y);if(seen[i]&&!vis[i]){cx.fillStyle='rgba(7,5,10,.62)';cx.fillRect(px(x),py(y),TS,TS)}}
  for(const e of ents){
    if(!vis[idx(e.x,e.y)])continue;
    const X=Math.round(ox+e.rx*TS),Y=Math.round(oy+e.ry*TS)-(Math.sin(t/260+e.x*1.7)>0?pix:0);
    if(e.sleep>0)cx.globalAlpha=.55;
    if(e.gl){const j=Math.random()<.3?pix*2:pix;cx.globalAlpha=.7;cx.drawImage(eCanvas(e,'#ff2bd6'),X-j,Y,TS,TS);cx.drawImage(eCanvas(e,'#2bf0ff'),X+j,Y,TS,TS);cx.globalAlpha=1}
    cx.drawImage(eCanvas(e),X,Y,TS,TS);cx.globalAlpha=1;
    if(e.type){cx.fillStyle=EL[e.type];cx.fillRect(X+TS-pix*2,Y,pix*2,pix*2)}
    if(e.hp<e.max){cx.fillStyle='#000';cx.fillRect(X+pix,Y-pix,TS-pix*2,pix);cx.fillStyle='#e5484d';cx.fillRect(X+pix,Y-pix,(TS-pix*2)*Math.max(0,e.hp/e.max),pix)}
  }
  for(const n of npcs){if(!vis[idx(n.x,n.y)])continue;n.rx+=(n.x-n.rx)*L;n.ry+=(n.y-n.ry)*L;const X=Math.round(ox+n.rx*TS),Y=Math.round(oy+n.ry*TS)-(Math.sin(t/300+n.id)>.6?pix:0);cx.drawImage(n.look?personCanvas(n.look):spr(n.icon[0],n.icon[1]),X,Y,TS,TS);const qm=npcMark(n);if(qm)mark(X,Y,qm)}
  const PX=Math.round(ox+P.rx*TS),PY=Math.round(oy+P.ry*TS),pc=PX+TS/2,pcy=PY+TS/2;
  if(!dead)cx.drawImage(personCanvas(P.look),PX,PY-(Math.sin(t/400)>.3?pix:0),TS,TS);
  else{cx.globalAlpha=.5;cx.drawImage(personCanvas(P.look,false,'#555'),PX,PY+pix*2,TS,TS);cx.globalAlpha=1}
  const g=cx.createRadialGradient(pc,pcy,TS*1.2,pc,pcy,TS*(TOWN?16:mod.fov+1.8));
  g.addColorStop(0,`hsla(${runR.hue},90%,60%,.06)`);g.addColorStop(.6,'rgba(7,5,10,.25)');g.addColorStop(1,'rgba(7,5,10,.92)');
  cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  cx.textAlign='center';cx.lineJoin='round';cx.font=`${Math.round(TS*.34)}px Silkscreen, monospace`;
  drawGuide(ox,oy,t);
  floaters=floaters.filter(f=>f.life>0);
  for(const f of floaters){const X=ox+f.x*TS+TS/2,Y=oy+f.y*TS-(45-f.life)*.6;
    cx.globalAlpha=Math.min(1,f.life/20);cx.lineWidth=4;cx.strokeStyle='#000';cx.strokeText(f.t,X,Y);cx.fillStyle=f.c;cx.fillText(f.t,X,Y);f.life--}
  cx.globalAlpha=1;
  if(banner&&banner.life>0){cx.globalAlpha=Math.min(1,banner.life/30);cx.font=`${Math.round(Math.min(34,VW/10))}px Silkscreen, monospace`;cx.lineWidth=6;cx.strokeStyle='#000';const by=VH*.22;cx.strokeText(banner.t,VW/2,by);
    if(banner.gl){const j=(Math.random()-.5)*6;cx.fillStyle='#ff2bd6';cx.fillText(banner.t,VW/2-3+j,by);cx.fillStyle='#2bf0ff';cx.fillText(banner.t,VW/2+3-j,by)}
    cx.fillStyle=banner.gl?'#fff':`hsl(${runR.hue},85%,72%)`;cx.fillText(banner.t,VW/2,by);cx.globalAlpha=1;banner.life--}
}

/* ---------- input ---------- */
const KEYS={arrowup:[0,-1],w:[0,-1],k:[0,-1],arrowdown:[0,1],s:[0,1],j:[0,1],arrowleft:[-1,0],a:[-1,0],h:[-1,0],arrowright:[1,0],d:[1,0],l:[1,0]};
addEventListener('keydown',e=>{
  if(ovOpen()){if(e.key==='Escape'&&!$('#ov').dataset.lock)hide();return}
  if(B){if(sayDone&&(e.key===' '||e.key==='Enter')){e.preventDefault();sayDone();return}
    const n=+e.key;if(n>=1&&n<=5){const b=document.querySelectorAll('#bmenu [data-mv],#bmenu [data-pick]')[n-1];if(b&&!b.disabled)b.click()}return}
  const k=KEYS[e.key.toLowerCase()];
  if(k){e.preventDefault();act(...k)}
  else if(e.key===' '||e.key==='.'){e.preventDefault();wait()}
  else if(e.key==='i')bag();else if(e.key==='m')movesScreen();else if(e.key==='q'&&!busy()&&P.items.potion){useField('potion');ui()}
  else if(e.key==='Enter'||e.key==='>')descend();
});
let tch=null;
cv.addEventListener('pointerdown',e=>{tch={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{
  if(!tch||!P)return;const dx=e.clientX-tch.x,dy=e.clientY-tch.y;tch=null;
  if(Math.hypot(dx,dy)>24)return Math.abs(dx)>Math.abs(dy)?act(Math.sign(dx),0):act(0,Math.sign(dy));
  const r=cv.getBoundingClientRect(),qx=e.clientX-r.left-VW/2,qy=e.clientY-r.top-VH/2;
  if(Math.abs(qx)<TS*.6&&Math.abs(qy)<TS*.6)return T[idx(P.x,P.y)]===2?descend():wait();
  Math.abs(qx)>Math.abs(qy)?act(Math.sign(qx),0):act(0,Math.sign(qy));
});
document.querySelectorAll('[data-d]').forEach(b=>{
  const[dx,dy]=b.dataset.d.split(',').map(Number);let t1,t2;
  const stop=()=>{clearTimeout(t1);clearInterval(t2)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();stop();act(dx,dy);t1=setTimeout(()=>{t2=setInterval(()=>{if(busy())return stop();act(dx,dy)},150)},320)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
});
$('#waitb').onclick=wait;$('#bagb').onclick=bag;$('#movb').onclick=movesScreen;$('#desc').onclick=descend;$('#menub').onclick=menu;
const ro=new ResizeObserver(resize);ro.observe($('#view'));
addEventListener('contextmenu',e=>e.preventDefault());

resize();title();requestAnimationFrame(draw);
/*end*/
}
</script>
