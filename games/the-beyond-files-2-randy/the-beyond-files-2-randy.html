head>\n<body>\n<div id=\"app\">\n  <div id=\"crosshair\"></div>\n\n  <div id=\"hint\"><b>WASD</b> move · <b>Mouse</b> look · <b>Arrows</b> look (Left/Right/Up/Down) · <b>Space</b> jump<br><b>E</b> talk · <b>Q</b> shop · <b>I</b> inventory · <b>Shift</b> slide · <b>L</b> quest log<br><span id=\"phase-indicator\">🌙 Night</span></div>\n\n  <div id=\"prompt\">Press <b>E</b> to talk to <span id=\"prompt-name\">someone</span></div>\n\n  <div id=\"dialogue\">\n    <div class=\"name\" id=\"d-name\">Name</div>\n    <div class=\"line\" id=\"d-line\">...</div>\n    <div class=\"foot\" id=\"d-foot\">[E] Continue</div>\n  </div>\n\n  <div id=\"cutscene-bar-top\"></div>\n  <div id=\"cutscene-bar-bottom\"></div>\n  <div id=\"cutscene-caption\"></div>\n  <div id=\"cutscene-skip\">Skip Intro (Esc)</div>\n  <div id=\"intro-jumpscare\"></div>\n\n  <div id=\"danger-vignette\"></div>\n  <div id=\"catch-flash\">Something has you...</div>\n  <canvas id=\"static-noise\" width=\"96\" height=\"54\"></canvas>\n  <div id=\"hide-slats\"></div>\n  <div id=\"dread-tint\"></div>\n  <div id=\"scratch-marks\"><svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\"><path d=\"M8 -5 L2 40 L11 105\" stroke=\"#3a0000\" stroke-width=\"2.4\" fill=\"none\"/><path d=\"M92 -8 L97 35 L88 108\" stroke=\"#3a0000\" stroke-width=\"2.2\" fill=\"none\"/><path d=\"M0 15 L20 8\" stroke=\"#3a0000\" stroke-width=\"1.6\" fill=\"none\"/><path d=\"M100 80 L80 90\" stroke=\"#3a0000\" stroke-width=\"1.6\" fill=\"none\"/></svg></div>\n  <div id=\"whisper-text\"></div>\n  <div id=\"hud-location\">📍 Millbrook Square</div>\n  <div id=\"lock-notice\"><span class=\"ln-close\" id=\"ln-close\">×</span><b>Mouse isn't locked.</b> Look around by dragging the mouse, or with the arrow keys. Press <b>Esc</b> anytime for camera settings.</div>\n  <div id=\"lore\"></div>\n  <div id=\"hud-horror\"><div id=\"hh-diff\"></div><div class=\"hh-row\">🧠<div class=\"hh-bar\"><i id=\"hh-sanity\"></i></div></div><div id=\"hh-lives\">❤❤❤</div><div id=\"hh-notes\">📜 0/11</div><div id=\"hh-night\">🌙 Night 1</div></div>\n  <div id=\"main-menu\">\n    <div id=\"mm-start\"><h1 data-t=\"The Beyond Files III: Randy\">The Beyond Files III: Randy</h1><p>Luca came looking for Echo's case. A foggy little town, something red in the dark, and a village that was never on the map</p><button class=\"mm-btn\" id=\"mm-play\">Play</button><div id=\"mm-saves\" style=\"display:none\"><button class=\"mm-btn mm-btn-alt\" id=\"mm-continue\">Continue</button><button class=\"mm-btn mm-btn-alt\" id=\"mm-load\">Load Game</button></div></div>\n    <div id=\"mm-diff\"><h1 style=\"font-size:clamp(28px,5vw,40px)\">Choose your fear</h1><p>how hard should the night bite?</p><div id=\"mm-cards\"></div></div>\n  </div>\n\n  <div id=\"hud-coins\">🪙 <span id=\"hud-coins-count\">0</span></div>\n  <div id=\"hud-pickup-toast\"></div>\n  <div id=\"hud-slide\">⚡ Slide Ready</div>\n\n  <div id=\"quest-marker\">\n    <div id=\"quest-arrow\"><svg viewBox=\"0 0 32 32\" width=\"30\" height=\"30\" aria-hidden=\"true\">\n      <polygon points=\"16,3 4,28 16,22 28,28\" fill=\"#2a2018\" stroke=\"#5a4a3a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\n      <polygon points=\"16,3 8.6,18.5 16,15 23.4,18.5\" fill=\"#ff6a1f\"/>\n      <line x1=\"16\" y1=\"3\" x2=\"16\" y2=\"22\" stroke=\"#ff6a1f\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n    </svg></div>\n    <div id=\"quest-text\">\n      <div id=\"quest-label\">—</div>\n      <div id=\"quest-dist\"></div>\n    </div>\n    <div id=\"quest-toggle\">▾</div>\n  </div>\n  <div id=\"quest-log\"></div>\n\n  <div id=\"shop\">\n    <div class=\"shop-name\" id=\"shop-name\">Shop</div>\n    <div class=\"shop-coins\">You have <span id=\"shop-coins-count\">0</span> 🪙</div>\n    <div id=\"shop-items\"></div>\n    <div class=\"shop-foot\">[Q] or [Esc] Leave</div>\n  </div>\n\n  <div id=\"inventory\">\n    <div class=\"inv-title\">Inventory</div>\n    <div id=\"inventory-items\"><div class=\"inv-empty\">Nothing yet — coins and finds will show up here.</div></div>\n    <div class=\"inv-foot\">[I] Close</div>\n  </div>\n\n  <div id=\"inspect-overlay\">\n    <div id=\"inspect-title\">Item</div>\n    <canvas id=\"inspect-canvas\"></canvas>\n    <div id=\"inspect-hint\">Drag to rotate — flip it over</div>\n    <div id=\"inspect-close\">Close (Esc)</div>\n  </div>\n\n  <div id=\"world-map\">\n    <div class=\"wm-card\">\n      <div class=\"wm-head\">\n        <h2>Millbrook &amp; the Outlying County</h2>\n        <div id=\"wm-close\">Close (M)</div>\n      </div>\n      <div id=\"wm-plot\"></div>\n      <div id=\"wm-info\">Click a discovered place to see it, or travel there.</div>\n    </div>\n  </div>\n\n  <div id=\"save-panel\">\n    <div class=\"sp-card\">\n      <h2 id=\"sp-title\">Save / Load</h2>\n      <div id=\"sp-slots\"></div>\n      <div class=\"sp-foot\"><button id=\"sp-import\">Import code</button><button id=\"sp-close\">Close</button></div>\n    </div>\n  </div>\n\n  <div id=\"game-over\">\n    <h1>Big Randy Claims Another</h1>\n    <p>Three chances, and the dark took all of them. Whatever's out there is still out there.</p>\n    <button id=\"go-retry\">Try Again</button>\n  </div>\n\n  <div id=\"overlay\">\n    <div class=\"card\">\n      <h1 data-t=\"The Beyond Files III: Randy\">The Beyond Files III: Randy</h1>\n      <p class=\"tag\">Night One. A foggy little town, four doors, an orange moon, and a drowned village to the east (hounds hunt by sound, shades fear your light)</p>\n      <div class=\"controls\">\n        <div><b>Move</b> W A S D</div>\n        <div><b>Look around</b> Mouse (locked), or drag / arrow keys if not</div>\n        <div><b>Talk</b> E (when close to someone)</div>\n        <div><b>Shop</b> Q (near a merchant)</div>\n        <div><b>Inventory</b> I</div>\n        <div><b>Jump</b> Space</div>\n        <div><b>Slide</b> Shift — dodges him, stuns on contact</div>\n        <div><b>Beds</b> rest for a brief speed boost</div>\n        <div><b>After dark</b> stay near light or indoors</div>\n        <div><b>Hide</b> E at wardrobes, barrels, haystacks</div>\n        <div><b>Notes</b> J — torn pages are hidden around town</div>\n        <div><b>Map</b> M — discovered places, with fast travel</div>\n        <div><b>Pause</b> Esc</div>\n      </div>\n      <div id=\"cam-settings\">\n        <div class=\"cs-row\"><label for=\"cs-autolock\">Try mouse lock automatically</label><input type=\"checkbox\" id=\"cs-autolock\" checked></div>\n        <div class=\"cs-row\"><label for=\"cs-sens\">Look sensitivity</label><input type=\"range\" id=\"cs-sens\" min=\"0.4\" max=\"2\" step=\"0.1\" value=\"1\"></div>\n        <div class=\"cs-row\"><label for=\"cs-invert\">Invert vertical look</label><input type=\"checkbox\" id=\"cs-invert\"></div>\n        <div class=\"cs-row\"><button id=\"cs-lock-btn\">Try Mouse Lock Now</button><span id=\"cs-lock-status\"></span></div>\n        <div class=\"cs-divider\"></div>\n        <div class=\"cs-row\"><button id=\"cs-save-btn\">Save / Load Game</button><span id=\"cs-save-status\"></span></div>\n        <div class=\"cs-row\"><button id=\"cs-quit-btn\">Quit to Main Menu</button></div>\n        <div class=\"cs-divider\"></div>\n        <div class=\"cs-row\"><label>Graphics</label><span id=\"perf-status\">Auto — High</span></div>\n        <div id=\"perf-desc\" style=\"font-size:12px;color:#8f8573;margin:2px 0 6px\">The original look: soft shadows, full resolution.</div>\n        <div class=\"cs-row cs-perf-btns\">\n          <button class=\"cs-perf-btn\" data-mode=\"auto\">Auto</button>\n          <button class=\"cs-perf-btn\" data-mode=\"0\">Cinematic</button>\n          <button class=\"cs-perf-btn\" data-mode=\"1\">Ultra</button>\n          <button class=\"cs-perf-btn\" data-mode=\"2\">High</button>\n          <button class=\"cs-perf-btn\" data-mode=\"3\">Medium</button>\n          <button class=\"cs-perf-btn\" data-mode=\"4\">Low</button>\n          <button class=\"cs-perf-btn\" data-mode=\"5\">Lower</button>\n          <button class=\"cs-perf-btn\" data-mode=\"6\">Minimal</button>\n          <button class=\"cs-perf-btn\" data-mode=\"7\">Potato</button>\n        </div>\n      </div>\n      <div class=\"go\">Click to keep exploring</div>\n    </div>\n  </div>\n\n  <div id=\"char-creation\">\n    <div class=\"cc-card\">\n      <h1>Who are you?</h1>\n      <p class=\"cc-tag\">you are Luca, Lyra's friend, who wanted to be a detective like Echo. Tell us a little about yourself before you reach Millbrook</p>\n\n      <div class=\"cc-section\">\n        <div class=\"cc-label\">Name</div>\n        <input id=\"cc-name\" type=\"text\" maxlength=\"18\" placeholder=\"Wanderer\">\n      </div>\n\n      <div class=\"cc-section\">\n        <div class=\"cc-label\">Look</div>\n        <div class=\"cc-swatches\" id=\"cc-swatches\"></div>\n      </div>\n\n      <div class=\"cc-section\">\n        <div class=\"cc-label\">Class</div>\n        <div class=\"cc-class-grid\" id=\"cc-classes\"></div>\n      </div>\n\n      <button id=\"cc-confirm\" disabled>Begin Your Journey</button>\n    </div>\n  </div>\n</div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js\"><\/script>\n<script>\n/* =====================================================================\n   HOLLOWMERE TOOLKIT: textures, houses, church, creeks + bridges, props,\n   post-processing, mist, watchers, hounds and shades. Host-agnostic.\n   ===================================================================== */\nconst HM = (function () {\n'use strict';\nconst T = THREE;\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nfunction mulberry(seed) {\n  let a = seed >>> 0;\n  return function () {\n    a += 0x6D2B79F5; let t = a;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nlet R = mulberry(20261014);\nconst rnd = (a, b) => a + (b - a) * R();\nconst FL0 = 0.02, STOREY = 3.2, STAIR_W = 1.5, NST = 12, RUN = 0.55;\nconst noop = function () {};\nconst NOTE = [];\n\n/* ---------- shared textures and materials (built once) ---------- */\nlet shared = null;\nfunction getShared() {\n  if (shared) return shared;\nfunction ctex(w, h, fn) {\n  const c = document.createElement('canvas');\n  c.width = w; c.height = h;\n  const g = c.getContext('2d');\n  fn(g, w, h);\n  const t = new T.CanvasTexture(c);\n  t.wrapS = t.wrapT = T.RepeatWrapping;\n  t.anisotropy = 4;\n  return t;\n}\nfunction speck(g, w, h, n, a, dark, size) {\n  for (let i = 0; i < n; i++) {\n    g.fillStyle = dark ? 'rgba(0,0,0,' + (R() * a) + ')' : 'rgba(255,255,255,' + (R() * a) + ')';\n    g.fillRect(R() * w, R() * h, 1 + R() * (size || 3), 1 + R() * (size || 3));\n  }\n}\nconst tPlaster = ctex(256, 256, (g, w, h) => {\n  g.fillStyle = '#676a60'; g.fillRect(0, 0, w, h);\n  speck(g, w, h, 2200, .10, false); speck(g, w, h, 2600, .2, true);\n  for (let i = 0; i < 16; i++) {\n    const x = R() * w, gr = g.createLinearGradient(0, 0, 0, h);\n    gr.addColorStop(0, 'rgba(18,16,12,0)');\n    gr.addColorStop(.5, 'rgba(18,16,12,' + (.06 + R() * .16) + ')');\n    gr.addColorStop(1, 'rgba(18,16,12,0)');\n    g.fillStyle = gr; g.fillRect(x, 0, 3 + R() * 12, h);\n  }\n});\nconst tWood = ctex(256, 256, (g, w, h) => {\n  g.fillStyle = ' ;\n    else noop(B, o.relic.x, o.relic.z, F0, o.relic.name);\n  }\n  return B;\n}\n\n/* A church with a nave, benches, chancel steps and a choir loft reached by a real stair. */\nfunction church(cx, cz, rot) {\n  const w = 12, d = 22, t = 0.35, F0 = FL0, F1 = F0 + STOREY, Hc = 8.0;\n  const hw = w / 2, hd = d / 2, n = NST, run = RUN, rise = (F1 - F0) / n;\n  const B = builder(cx, cz, rot), L = B.L, wall = B.wall;\n  const sx0 = -hw + t, sx1 = sx0 + STAIR_W;\n  const zl0 = hd - 4.0, zS = zl0 - (n - 1) * run;\n\n  L(-hw - 0.3, 0, -hd - 0.3, hw + 0.3, F0 - 0.04, hd + 0.3, 'stone');\n  L(-hw + t, F0 - 0.04, -hd + t, hw - t, F0, hd - t, 'wood');\n  L(-2.2, 0, hd + 0.3, 2.2, 0.16, hd + 1.4, 'stone');\n  L(-2.6, 0, hd + 1.4, 2.6, 0.08, hd + 2.2, 'stone', { noCollide: false });\n\n  const tall = (c, y0, y1, wd) => ({ a: c - wd / 2, b: c + wd / 2, y0: y0, y1: y1 });\n  wall(true, hd - t, hd, -hw, hw, 0, Hc, [{ a: -1.1, b: 1.1, y0: F0, y1: F0 + 2.8 }, tall(-3.8, F1 + 0.4, F1 + 3.2, 1.2), tall(3.8, F1 + 0.4, F1 + 3.2, 1.2)], 'stone');\n  wall(true, -hd, -hd + t, -hw, hw, 0, Hc, [tall(-3.5, F0 + 2.2, F0 + 5.6, 1.2), tall(3.5, F0 + 2.2, F0 + 5.6, 1.2)], 'stone');\n  const sideWin = [-8, -4.5, -1, 2.5].map(z => tall(z, F0 + 1.8, F0 + 5.2, 1.1));\n  wall(false, -hw, -hw + t, -hd + t, hd - t, 0, Hc, sideWin, 'stone');\n  wall(false, hw - t, hw, -hd + t, hd - t, 0, Hc, sideWin.concat([tall(6.2, F1 + 0.4, F1 + 3.2, 1.1)]), 'stone');\n\n  // choir loft over the entrance, stair up the left wall\n  L(sx0, F1 - 0.25, zl0, hw - t, F1, hd - t, 'wood', { floor: 1 });\n  for (let i = 1; i <= n; i++) L(sx0, F0, zS + (i - 1) * run, sx1, F0 + i * rise, zS + i * run, 'wood', { stair: 1 });\n  L(sx1, F1, zl0, hw - t, F1 + 1.0, zl0 + 0.08, 'wood');\n  L(-hw - 0.5, Hc, -hd - 0.5, hw + 0.5, Hc + 0.25, hd + 0.5, 'wood', { noCollide: true });\n  const wc = B.Tf(0, 0), swap = rot % 2 === 1;\n  pyramidRoof(wc[0], wc[1], Hc + 0.25, (swap ? d : w) + 2, (swap ? w : d) + 2, 5.5);\n\n  // chancel steps, altar, benches\n  L(-hw + t, F0, -hd + t, hw - t, F0 + 0.18, -hd + 5.0, 'stone');\n  L(-3.5, F0 + 0.18, -hd + t, 3.5, F0 + 0.36, -hd + 3.6, 'stone');\n  L(-1.4, F0 + 0.36, -hd + 1.0, 1.4, F0 + 1.35, -hd + 2.0, 'stone');\n  const cross = B.Tf(0, -hd + t + 0.05);\n  L(-0.09, F0 + 2.2, -hd + t, 0.09, F0 + 5.8, -hd + t + 0.12, 'wood', { noCollide: true });\n  L(-0.8, F0 + 3.0, -hd + t, 0.8, F0 + 3.18, -hd + t + 0.12, 'wood', { noCollide: true });\n  const rowsZ = [-3.2, -1.4, 0.4, 2.2];\n  rowsZ.forEach((z, i) => {\n    [[-4.7, -1.5], [1.5, 4.7]].forEach((xs, k) => {\n      if (k === 0 && z > zS - 0.8) return;\n      L(xs[0], F0, z, xs[1], F0 + 0.56, z + 0.5, 'wood');\n      L(xs[0], F0 + 0.56, z + 0.5, xs[1], F0 + 1.1, z + 0.6, 'wood');\n    });\n  });\n  noop(B.Tf(3.1, -2.95), F0 + 0.56, F0, NOTE[7]);\n  // choir loft furniture\n  L(-hw + t + 1.9, F1, hd - t - 0.9, hw - t, F1 + 1.5, hd - t, 'wood');\n\n  B.scrawl('HE WAS NEVER\\nTHE ONE THAT FELL', hw - t, F0 + 2.2, -4.2, -1, 0, 2.6, 1.3);\n  B.scrawl('FIVE FLAMES\\nFIVE', 0.0, F1 + 1.4, hd - t, 0, -1, 2.4, 1.1);\n  const alt = B.Tf(0, -hd + 1.5);\n  noop(alt[0], F0 + 1.35, alt[1], 'Vale');\n  B.scrawl('CHURCH OF THE OATH', 0, F0 + 4.4, hd, 0, 1, 3.2, 0.7, '#d6d1bd');\n  return B;\n}\n\n  // group collected stair risers into ramps {minX,maxX,minZ,maxZ,axis,from,to,base,height}\n  function takeRamps() {\n    const out = [], list = stairRisers.splice(0);\n    const used = new Array(list.length).fill(false);\n    for (let i = 0; i < list.length; i++) {\n      if (used[i]) continue;\n      const a = list[i]; used[i] = true;\n      const grp = [a];\n      let grew = true;\n      while (grew) {\n        grew = false;\n        for (let k = 0; k < list.length; k++) {\n          if (used[k]) continue;\n          const b = list[k];\n          if (Math.abs(b.x0 - a.x0) < 1e-3 && Math.abs(b.x1 - a.x1) < 1e-3 && grp.some(g => Math.abs(g.z1 - b.z0) < 1e-3 || Math.abs(g.z0 - b.z1) < 1e-3)) { grp.push(b); used[k] = true; grew = true; }\n          else if (Math.abs(b.z0 - a.z0) < 1e-3 && Math.abs(b.z1 - a.z1) < 1e-3 && grp.some(g => Math.abs(g.x1 - b.x0) < 1e-3 || Math.abs(g.x0 - b.x1) < 1e-3)) { grp.push(b); used[k] = true; grew = true; }\n        }\n      }\n      const alongZ = grp.every(g => Math.abs(g.x0 - a.x0) < 1e-3 && Math.abs(g.x1 - a.x1) < 1e-3);\n      const lo = grp.reduce((m, g) => g.y1 < m.y1 ? g : m, grp[0]), hi = grp.reduce((m, g) => g.y1 > m.y1 ? g : m, grp[0]);\n      const minX = Math.min(...grp.map(g => g.x0)), maxX = Math.max(...grp.map(g => g.x1)), minZ = Math.min(...grp.map(g => g.z0)), maxZ = Math.max(...grp.map(g => g.z1));\n      const stepH = lo.y1 - lo.y0; const base = lo.y0;\n      if (alongZ) {\n        const rising = (hi.z0 + hi.z1) / 2 - (lo.z0 + lo.z1) / 2 > 0;\n        const from = rising ? lo.z0 : lo.z1, to = rising ? hi.z1 : hi.z0;\n        out.push({ minX, maxX, minZ, maxZ, axis: 'z', from, to, base, height: hi.y1 - base });\n      } else {\n        const rising = (hi.x0 + hi.x1) / 2 - (lo.x0 + lo.x1) / 2 > 0;\n        const from = rising ? lo.x0 : lo.x1, to = rising ? hi.x1 : hi.x0;\n        out.push({ minX, maxX, minZ, maxZ, axis: 'x', from, to, base, height: hi.y1 - base });\n      }\n    }\n    return out;\n  }\n\n  /* ---------- props ---------- */\nfunction deadTree(x, z) {\n  const h = rnd(3.2, 6.5);\n  const tr = new T.CylinderGeometry(0.1, 0.24, h, 6);\n  place(tr, x, h / 2, z, 0, 0, 0); addGeo(tr, 'bark');\n  const nb = 3 + Math.floor(R() * 4);\n  for (let i = 0; i < nb; i++) {\n    const len = rnd(1.2, 2.6), rz = (R() < .5 ? -1 : 1) * rnd(0.6, 1.2), ry = rnd(0, 6.28), y = h * rnd(0.45, 0.95);\n    const e = new T.Euler(0, ry, rz), v = new T.Vector3(0, len / 2, 0).applyEuler(e);\n    const g = new T.CylinderGeometry(0.02, 0.07, len, 4);\n    place(g, x + v.x, y + v.y, z + v.z, 0, ry, rz); addGeo(g, 'bark');\n    for (let k = 0; k < 2; k++) {\n      const tl = len * rnd(0.35, 0.6), tz = rz + (R() < 0.5 ? -1 : 1) * rnd(0.5, 0.9), ty = ry + rnd(-1, 1);\n   const pumpZ = def.z + outward.z*(distOut-0.7) - perp.z*1.6;\n    makePumpkin(pumpX, pumpZ, 1.15);\n  }\n\n  houseDefs.forEach(settleHouse);\n\n  // Mayor Callun's house has an upper floor with a bed\n  addLoft({\n    stairMinX:44.5, stairMaxX:46.0, stairMinZ:39.0, stairMaxZ:40.2, axis:\"x\", rampFrom:44.5, rampTo:46.0,\n    platMinX:46.0, platMaxX:49.5, platMinZ:37, platMaxZ:43,\n    height:2.8, wallColor:0x5c4d28\n  });\n\n  // ---------- stone paths ----------\n  function makeStoneTexture(){\n    const canvas = document.createElement(\"canvas\");\n    canvas.width = 128; canvas.height = 128;\n    const ctx = canvas.getContext(\"2d\");\n    ctx.fillStyle = \"#4a453d\";\n    ctx.fillRect(0,0,128,128);\n    for(let i=0;i<42;i++){\n      const w = 10+Math.random()*16, h = 10+Math.random()*16;\n      const x = Math.random()*128, y = Math.random()*128;\n      const shade = 58+Math.floor(Math.random()*34);\n      ctx.fillStyle = `rgb(${shade+18},${shade+13},${shade+9})`;\n      ctx.strokeStyle = \"rgba(20,17,14,0.55)\";\n      ctx.lineWidth = 2;\n      roundRectPath(ctx,x,y,w,h,3);\n      ctx.fill(); ctx.stroke();\n    }\n    const tex = new THREE.CanvasTexture(canvas);\n    tex.wrapS = THREE.RepeatWrapping;\n    tex.wrapT = THREE.RepeatWrapping;\n    return tex;\n  }\n  const stoneTexture = makeStoneTexture();\n\n  function makeStonePath(x1,z1,x2,z2,width){\n    const dx = x2-x1, dz = z2-z1;\n    const length = Math.sqrt(dx*dx+dz*dz);\n    const tex = stoneTexture.clone();\n    tex.needsUpdate = true;\n    tex.repeat.set(width/2, length/2);\n    const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.95 });\n    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, length), mat);\n    mesh.rotateX(-Math.PI/2);\n    mesh.rotateOnWorldAxis(new THREE.Vector3(0,1,0), Math.atan2(dx,dz));\n    mesh.position.set((x1+x2)/2, 0.025, (z1+z2)/2);\n    mesh.receiveShadow = true;\n    scene.add(mesh);\n    return length;\n  }\n\n  function lineLampposts(x1,z1,x2,z2,spacing){\n    const dx = x2-x1, dz = z2-z1;\n    const length = Math.sqrt(dx*dx+dz*dz);\n    const ux = dx/length, uz = dz/length;\n    const perp = { x:-uz, z:ux };\n    let side = 1;\n    for(let d=spacing; d<length; d+=spacing){\n      const px = x1+ux*d + perp.x*1.8*side;\n      const pz = z1+uz*d + perp.z*1.8*side;\n      makeLamppost(px,pz);\n      side *= -1;\n    }\n  }\n\n  // ---------- village landmarks ----------\n  // ---------- lofts: a staircase + upper room with a bed, attached beside a house ----------\n  function addLoft(cfg){\n    const upperH = cfg.height;\n    staircases.push({ minX:cfg.stairMinX, maxX:cfg.stairMaxX, minZ:cfg.stairMinZ, maxZ:cfg.stairMaxZ, axis:cfg.axis, from:cfg.rampFrom, to:cfg.rampTo, height:upperH });\n    upperFloors.push({ minX:cfg.platMinX, maxX:cfg.platMaxX, minZ:cfg.platMinZ, maxZ:cfg.platMaxZ, height:upperH });\n    houseFootprints.push({\n      minX: Math.min(cfg.stairMinX, cfg.platMinX)-0.3, maxX: Math.max(cfg.stairMaxX, cfg.platMaxX)+0.3,\n      minZ: Math.min(cfg.stairMinZ, cfg.platMinZ)-0.3, maxZ: Math.max(cfg.stairMaxZ, cfg.platMaxZ)+0.3\n    });\n\n    const stairLen = cfg.axis === \"x\" ? (cfg.stairMaxX-cfg.stairMinX) : (cfg.stairMaxZ-cfg.stairMinZ);\n    const stairWid = cfg.axis === \"x\" ? (cfg.stairMaxZ-cfg.stairMinZ) : (cfg.stairMaxX-cfg.stairMinX);\n    const ladderMat = new THREE.MeshStandardMaterial({color:0x3a2c1c, roughness:0.85});\n    const ladderGroup = new THREE.Group();\n    const railOffset = Math.max(0.15, stairWid/2 - 0.15);\n    const railGeo = new THREE.CylinderGeometry(0.05,0.05, stairLen, 6);\n    const railA = new THREE.Mesh(railGeo, ladderMat);\n    railA.rotation.z = Math.PI/2;\n    railA.position.set(0,0,-railOffset);\n    railA.castShadow = true;\n    const railB = railA.clone();\n    railB.position.z = railOffset;\n    ladderGroup.add(railA, railB);\n    const rungCount = Math.max(3, Math.round(stairLen/0.45));\n    for(let i=0; i<=rungCount; i++){\n      const rt = i/rungCount;\n      const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035, railOffset*2, 6), ladderMat);\n      rung.rotation.x = Math.PI/2;\n      rung.position.set(-stairLen/2 + rt*stairLen, 0, 0);\n      rung.castShadow = true;\n      ladderGroup.add(rung);\n    }\n    const midX = (cfg.stairMinX+cfg.stairMaxX)/2, midZ = (cfg.stairMinZ+cfg.stairMaxZ)/2;\n    ladderGroup.position.set(midX, upperH/2, midZ);\n    const tiltAngle = Math.atan2(upperH, stairLen);\n    const rising = cfg.rampTo > cfg.rampFrom;\n    if(cfg.axis === \"x\") ladderGroup.rotation.z = rising ? tiltAngle : -tiltAngle;\n    else ladderGroup.rotation.x = rising ? -tiltAngle : tiltAngle;\n    scene.add(ladderGroup);\n\n    const platW = cfg.platMaxX-cfg.platMinX, platD = cfg.platMaxZ-cfg.platMinZ;\n    const platCX = (cfg.platMinX+cfg.platMaxX)/2, platCZ = (cfg.platMinZ+cfg.platMaxZ)/2;\n\n    const floor = new THREE.Mesh(new THREE.BoxGeometry(platW,0.2,platD), new THREE.MeshStandardMaterial({color:0x8a6242,roughness:0.85}));\n    floor.position.set(platCX, upperH, platCZ);\n    floor.receiveShadow = true; floor.castShadow = true;\n    scene.add(floor);\n\n    const wallMat = new THREE.MeshStandardMaterial({color:cfg.wallColor||0x4a3b2a, roughness:0.85});\n    const wallH = 1.6, t = 0.2;\n    function railWall(cx,cz,sx,sz){\n      const m = new THREE.Mesh(new THREE.BoxGeometry(sx,wallH,sz), wallMat);\n      m.position.set(cx, upperH+wallH/2, cz);\n      m.castShadow = true; m.receiveShadow = true;\n      scene.add(m);\n      addRect(cx-sx/2, cx+sx/2, cz-sz/2, cz+sz/2);\n    }\n    // wall all four edges of the platform, but leave the staircase opening clear\n    const platEdges = {\n      south:{ fixedIsZ:true,  fixed:cfg.platMinZ, a:cfg.platMinX, b:cfg.platMaxX },\n      north:{ fixedIsZ:true,  fixed:cfg.platMaxZ, a:cfg.platMinX, b:cfg.platMaxX },\n      west: { fixedIsZ:false, fixed:cfg.platMinX, a:cfg.platMinZ, b:cfg.platMaxZ },\n      east: { fixedIsZ:false, fixed:cfg.platMaxX, a:cfg.platMinZ, b:cfg.platMaxZ }\n    };\n    let gapEdge = null, gapA = 0, gapB = 0;\n    if(cfg.axis === \"x\"){\n      if(Math.abs(cfg.rampTo-cfg.platMinX) < 0.05){ gapEdge=\"west\"; gapA=cfg.stairMinZ; gapB=cfg.stairMaxZ; }\n      else if(Math.abs(cfg.rampTo-cfg.platMaxX) < 0.05){ gapEdge=\"east\"; gapA=cfg.stairMinZ; gapB=cfg.stairMaxZ; }\n    } else {\n      if(Math.abs(cfg.rampTo-cfg.platMinZ) < 0.05){ gapEdge=\"south\"; gapA=cfg.stairMinX; gapB=cfg.stairMaxX; }\n      else if(Math.abs(cfg.rampTo-cfg.platMaxZ) < 0.05){ gapEdge=\"north\"; gapA=cfg.stairMinX; gapB=cfg.stairMaxX; }\n    }\n    Object.keys(platEdges).forEach(name=>{\n      const e = platEdges[name];\n      if(name === gapEdge){\n        if(gapA > e.a+0.05){\n          if(e.fixedIsZ) railWall((e.a+gapA)/2, e.fixed, gapA-e.a, t);\n          else railWall(e.fixed, (e.a+gapA)/2, t, gapA-e.a);\n        }\n        if(gapB < e.b-0.05){\n          if(e.fixedIsZ) railWall((gapB+e.b)/2, e.fixed, e.b-gapB, t);\n          else railWall(e.fixed, (gapB+e.b)/2, t, e.b-gapB);\n        }\n      } else {\n        if(e.fixedIsZ) railWall((e.a+e.b)/2, e.fixed, e.b-e.a, t);\n        else railWall(e.fixed, (e.a+e.b)/2, t, e.b-e.a);\n      }\n    });\n\n    const roof = new THREE.Mesh(new THREE.BoxGeometry(platW+0.4,0.2,platD+0.4), wallMat);\n    roof.position.set(platCX, upperH+wallH+0.1, platCZ);\n    roof.castShadow = true;\n    scene.add(roof);\n\n    const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.3,0.8), new THREE.MeshStandardMaterial({color:0x3a2c1c,roughness:0.9}));\n    bedFrame.position.set(platCX, upperH+0.15, platCZ);\n    bedFrame.castShadow = true;\n    const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.15,0.72), new THREE.MeshStandardMaterial({color:0xd8cbb0,roughness:0.9}));\n    mattress.position.set(platCX, upperH+0.38, platCZ);\n    mattress.castShadow = true;\n    const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.12,0.6), new THREE.MeshStandardMaterial({color:0xf2ece0,roughness:0.9}));\n    pillow.position.set(platCX, upperH+0.5, platCZ - 0.05);\n    pillow.castShadow = true;\n    scene.add(bedFrame, mattress, pillow);\n\n    beds.push({ x:platCX, z:platCZ, radius:1.7 });\n\n    const lampLight = new THREE.PointLight(0xffb35c, 0.7, 6, 2);\n    lampLight.position.set(platCX, upperH+1.2, platCZ+platD/2-0.3);\n    scene.add(lampLight);\n    flickerLights.push({ light:lampLight, base:0.7, phase:Math.random()*Math.PI*2 });\n  }\n\n  function makeWell(x,z){\n    const g = new THREE.Group();\n    const stoneMat = new THREE.MeshStandardMaterial({color:0x54504a,roughness:0.9});\n    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.1,0.9,16), stoneMat);\n    base.position.y = 0.45; base.castShadow = true; base.receiveShadow = true;\n    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.0,0.1,8,20), stoneMat);\n    rim.rotation.x = Math.PI/2; rim.position.y = 0.9;\n    const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.6,6), new THREE.MeshStandardMaterial({color:0x2e2115,roughness:1}));\n    postL.position.set(-0.8,1.5,0); postL.castShadow = true;\n    const postR = postL.clone(); postR.position.x = 0.8;\n    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.15,0.7,4), new THREE.MeshStandardMaterial({color:0x2b1f33,roughness:0.8}));\n    roof.rotation.y = Math.PI/4; roof.position.y = 2.55; roof.castShadow = true;\n    g.add(base, rim, postL, postR, roof);\n    g.position.set(x,0,z);\n    scene.add(g);\n    addCircle(x,z,1.3);\n\n    const light = new THREE.PointLight(0xffb35c, 0.8, 7, 2);\n    light.position.set(x, 2.2, z);\n    scene.add(light);\n    flickerLights.push({ light, base:0.8, phase:Math.random()*Math.PI*2 });\n  }\n\n  function makeRavenPost(x,z){\n    const g = new THREE.Group();\n    const woodMat = new THREE.MeshStandardMaterial({color:0x2e2115,roughness:1});\n    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,2.6,7), woodMat);\n    post.position.y = 1.3; post.castShadow = true;\n    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.3,6), woodMat);\n    arm.rotation.z = Math.PI/2; arm.position.y = 2.5;\n    const lampGlass = new THREE.MeshStandardMaterial({color:0xffb35c, emissive:0xffb35c, emissiveIntensity:1.1, roughness:0.4});\n    const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.18,0.28,8), lampGlass);\n    lamp.position.set(0.6,2.35,0); lamp.castShadow = true;\n    const birdMat = new THREE.MeshStandardMaterial({color:0x0e0c10,roughness:0.7});\n    const birdBody = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), birdMat);\n    birdBody.scale.set(1,1,1.3); birdBody.position.set(-0.5,2.68,0);\n    const birdHead = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8), birdMat);\n    birdHead.position.set(-0.5,2.8,0.16);\n    g.add(post, arm, lamp, birdBody, birdHead);\n    g.position.set(x,0,z);\n    scene.add(g);\n    addCircle(x,z,0.2);\n    idleBirds.push({ body:birdBody, head:birdHead, baseBodyY:birdBody.position.y, baseHeadY:birdHead.position.y, phase:Math.random()*Math.PI*2 });\n\n    const light = new THREE.PointLight(0xffb35c, 1.0, 8, 2);\n    light.position.set(x+0.6, 2.35, z);\n    scene.add(light);\n    flickerLights.push({ light, base:1.0, phase:Math.random()*Math.PI*2 });\n  }\n\n  function makeSignpost(x,z){\n    const woodMat = new THREE.MeshStandardMaterial({color:0x2e2115,roughness:1});\n    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,2.2,7), woodMat);\n    post.position.set(x,1.1,z); post.castShadow = true;\n    scene.add(post);\n\n    function plank(text, dirX, dirZ, yOff){\n      const canvas = document.createElement(\"canvas\");\n      canvas.width = 256; canvas.height = 72;\n      const ctx = canvas.getContext(\"2d\");\n      ctx.fillStyle = \"#3a2c1c\"; ctx.fillRect(0,0,256,72);\n      ctx.strokeStyle = \"#1c140c\"; ctx.lineWidth = 5; ctx.strokeRect(3,3,250,66);\n      ctx.fillStyle = \"#f2e3c6\";\n      ctx.font = \"bold 26px Georgia, serif\";\n      ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\";\n      ctx.fillText(text, 128, 38);\n      const tex = new THREE.CanvasTexture(canvas);\n      const mat = new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide, fog:false });\n      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.36), mat);\n      mesh.position.set(x+dirX*0.45, yOff, z+dirZ*0.45);\n      mesh.rotateOnWorldAxis(new THREE.Vector3(0,1,0), Math.atan2(dirX,dirZ));\n      scene.add(mesh);\n      swingingSigns.push({ mesh, baseRotZ:mesh.rotation.z, phase:Math.random()*Math.PI*2 });\n    }\n    plank(\"HOLLOW PINES\", 0, -1, 1.75);\n    plank(\"RAVENSCROFT\", 1, 0, 1.45);\n    plank(\"ASHWICK\", -1, 0, 1.15);\n    plank(\"THISTLEWOOD\", 0, 1, 0.85);\n  }\n\n  // ---------- Hollow Pines (south) ----------\n  const hollowPinesDefs = [\n    {\n      x:-22.5, z:-212.5, w:8, d:8, wallHeight:3.2,\n      wallColor:0x3f4a2e, roofColor:0x1e2417, doorSide:\"east\",\n      npc:{ name:\"Gareth the Trapper\", bodyColor:0x4a3d2e, hatColor:0x2b2b2b,\n        lines:[\n          \"Something's been moving through the pines after dark. Bigger than a wolf. I don't go out past sundown anymore.\",\n          \"Found tracks the other night, deep ones, like it was dragging something. Didn't stick around to look closer.\",\n          \"You'll want to keep to the path once the sun's down. Whatever's out there hasn't come this close yet. Hasn't, mind you.\"\n        ]}\n    },\n    {\n      x:22.5, z:-212.5, w:8, d:8, wallHeight:3.2,\n      wallColor:0x5a4a3a, roofColor:0x2b1f1a, doorSide:\"west\",\n      npc:{ name:\"Old Nettie\", bodyColor:0x6b4f7a, hatColor:0x3a2c4a,\n        lines:[\n          \"Charm of dried nightshade over the door. Keeps most things out, if you believe in that sort of thing.\",\n          \"I do believe in it, for what it's worth. Especially since the trapper started losing sleep.\",\n          \"Take one if you're heading further out. Won't hurt, and it might just help.\"\n        ]}\n    }\n  ];\n  hollowPinesDefs.forEach(settleHouse);\n  makePlazaDisc(0,-212.5,5.5);\n  makeWell(0,-212.5);\n\n  // ---------- Ravenscroft (east) ----------\n  const ravenscroftDefs = [\n    {\n      x:212.5, z:-22.5, w:8, d:8, wallHeight:3.2,\n      wallColor:0x33323e, roofColor:0x17161e, doorSide:\"north\",\n      npc:{ name:\"Silas the Crowkeeper\", bodyColor:0x232028, hatColor:0x0f0d12,\n        lines:[\n          \"The ravens won't settle tonight. They only get like this when something's circling the woods.\",\n          \"I've kept birds here thirty years. They know before any of us do.\",\n          \"Mind the road after dark. The birds go quiet right before whatever it is gets close.\"\n        ]}\n    },\n    {\n      x:212.5, z:22.5, w:8, d:8, wallHeight:3.2, floors:2,\n      wallColor:0x5c3a3a, roofColor:0x2b1717, doorSide:\"south\",\n      npc:{ name:\"Bramwell the Innkeeper\", bodyColor:0x7a4a35, hatColor:0x2b1f1a,\n        lines:[\n          \"Two travelers didn't make it back from the north road last week. First time that's happened in years.\",\n          \"I still keep their rooms ready. Force of habit, I suppose.\",\n          \"Stay the night if you need to. Safer indoors, whatever people say about it just being wolves.\"\n        ]}\n    }\n  ];\n  ravenscroftDefs.forEach(settleHouse);\n\n  // Bramwell's Inn has an upper floor with a bed\n  addLoft({\n    stairMinX:207.0, stairMaxX:208.5, stairMinZ:21.3, stairMaxZ:22.5, axis:\"x\", rampFrom:208.5, rampTo:207.0,\n    platMinX:203.5, platMaxX:207.0, platMinZ:19, platMaxZ:26,\n    height:2.8, wallColor:0x4a2e2e\n  });\n  beds[beds.length-1].inn = { name:\"Bramwell's Inn\", x:212.5, z:15.5, chapter:1 }; // Chapter 1's rest point\n  makeSpecialBed(205.25, 2.8, 22.5);\n  makePlazaDisc(212.5,0,5.5);\n  makeRavenPost(212.5,0);\n\n  // ---------- connect it all with stone paths ----------\n  makeStonePath(0,-7.5, 0,-207, 2.6);\n  makeStonePath(7.5,0, 207,0, 2.6);\n  lineLampposts(0,-7.5, 0,-207, 34);\n  lineLampposts(7.5,0, 207,0, 34);\n  makeSignpost(4.5,4.5);\n\n  // ---------- more houses, spread around all three villages ----------\n  const extraHouseDefs = [\n    { x:65, z:45, w:8, d:8, wallHeight:3.2, wallColor:0x2f5a52, roofColor:0x1a2e2a, doorSide:\"west\",\n      npc:{ name:\"Corwin the Fletcher\", bodyColor:0x4a5a3a, hatColor:0x2b2b2b,\n        lines:[\n          \"Best arrows in three counties, for what little good they'd do against that thing.\",\n          \"Keep your bowstring dry and your door bolted. That's my advice.\"\n        ]}},\n    { x:-65, z:45, w:8, d:8, wallHeight:3.2, wallColor:0x5a3a5a, roofColor:0x2a1a2a, doorSide:\"east\",\n      npc:{ name:\"Della the Weaver\", bodyColor:0x6b4a6b, hatColor:0x2e1f2e,\n        lines:[\n          \"I weave charms into the cloth. Can't promise they work, but it helps me sleep.\",\n          \"You look like you've seen the woods at night. Sit a while.\"\n        ]}},\n    { x:50, z:-65, w:8, d:8, wallHeight:3.2, wallColor:0x6b4a2e, roofColor:0x2e1f14, doorSide:\"north\",\n      npc:{ name:\"Pruitt the Miller\", bodyColor:0x8a6a4a, hatColor:0x3a2a1a,\n        lines:[\n          \"Grinding grain by lamplight isn't so bad, until the lamp starts flickering on its own.\",\n          \"The mill wheel creaks louder than usual lately. Or maybe that's just my nerves.\"\n        ]}},\n    { x:0, z:-238, w:8, d:8, wallHeight:3.2, wallColor:0x3a3f2a, roofColor:0x1a1f12, doorSide:\"north\",\n      npc:{ name:\"Agatha the Midwife\", bodyColor:0x5a5a4a, hatColor:0x2b2b22,\n        lines:[\n          \"Brought half this town into the world. Wish I could keep all of them safe in it.\",\n          \"Something's wrong with the nights here. Has been for a while.\"\n        ]}},\n    { x:48, z:-222, w:8, d:8, wallHeight:3.2, wallColor:0x4a2f3a, roofColor:0x211622, doorSide:\"west\",\n      npc:{ name:\"Tomlin the Cooper\", bodyColor:0x6b4a35, hatColor:0x2b1f18,\n        lines:[\n          \"Barrels, buckets, anything that holds water. Keep busy, keep sane.\",\n          \"Don't linger by the tree line after dark. That's not superstition, that's just sense.\"\n        ]}},\n    { x:212.5, z:48, w:8, d:8, wallHeight:3.2, wallColor:0x2e3a4a, roofColor:0x161c26, doorSide:\"south\",\n      npc:{ name:\"Wren the Fisher\", bodyColor:0x3a5a6b, hatColor:0x1c2b32,\n        lines:[\n          \"River's been quiet. Too quiet, if you ask me.\",\n          \"Caught something odd in my net last week. Threw it back before I could look twice.\"\n        ]}},\n    { x:238, z:-15, w:8, d:8, wallHeight:3.2, wallColor:0x4a3a2e, roofColor:0x231c16, doorSide:\"west\",\n      npc:{ name:\"Ezra the Tanner\", bodyColor:0x7a5a3a, hatColor:0x2e2114,\n        lines:[\n          \"Leather's tough work, but it's honest. Keeps my mind off things.\",\n          \"Ravenscroft used to feel safer. Don't know when that changed.\"\n        ]}}\n  ];\n  extraHouseDefs.forEach(settleHouse);\n\n  // ---------- Ashwick (west) ----------\n  const ashwickDefs = [\n    {\n      x:-212.5, z:-22.5, w:8, d:8, wallHeight:3.2,\n      wallColor:0x3a4a4a, roofColor:0x1a2424, doorSide:\"east\",\n      npc:{ name:\"Old Perrin the Herbalist\", bodyColor:0x5a6b4a, hatColor:0x2b3320,\n        lines:[\n          \"Everything that grows out past the tree line grows wrong lately. Bitter roots, black-veined leaves.\",\n          \"I still dry what I can. Some of it helps the nerves, if nothing else.\",\n          \"Don't pick anything after dark. Whatever's changing the plants might notice you back.\"\n        ]}\n    },\n    {\n      x:-212.5, z:22.5, w:8, d:8, wallHeight:3.2, floors:2,\n      wallColor:0x5a4a5c, roofColor:0x2a1f2e, doorSide:\"west\",\n      npc:{ name:\"Constance the Seamstress\", bodyColor:0x6b4a5c, hatColor:0x2e1f2a,\n        lines:[\n          \"I sew heavier curtains than I used to. Folks ask for them without saying why.\",\n          \"Ashwick used to be the quiet edge of the county. Now it's just the edge.\",\n          \"Take a scrap of red thread hereGeometry(2.6,12,8,0,Math.PI*2,0,Math.PI/2.4), dirtMat);\n    mound.position.set(cx, -0.5, cz);\n    mound.scale.set(1.3,0.7,1.1);\n    mound.castShadow = true;\n    const hatch = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.14,1.7), woodMat);\n    hatch.position.set(cx, 0.3, cz);\n    hatch.rotation.y = 0.3;\n    hatch.castShadow = true;\n    scene.add(mound, hatch);\n    addCircle(cx, cz, 2.2);\n    // treasure placed later, once the pickups system is initialized (see POI_PICKUP_SPOTS below)\n  })();\n\n  // ================= HOLLOWMERE DISTRICT (imported from the Hollowmere toolkit) =================\n  const HMD = { x:120, z:-52 };\n  let hmPOST = null, hmMon = null, hmMist = null, hmWatch = null, hmCreekMode = false;\n  const hmRectsOnly = [];\n  const hmLocal = { lx:0, lz:0 };\n  (function(){\n    HM.setSeed(1313);\n    const K = HM.create(scene, { onBox:(b)=>{\n      if(b.y1 < 0.35) return;\n      const r = { minX:b.x0, maxX:b.x1, minZ:b.z0, maxZ:b.z1 };\n      if(b.y0 >= 2.9) r.lv = 1;\n      else if(b.y0 >= 2.0){ if(b.y1 > 4) r.lv = 1; else return; }   // door/window headers: clear overhead on the ground floor\n      else if(b.y1 <= 4) r.lv = 0;\n      if(hmCreekMode) r.hmc = 1;\n      rectColliders.push(r);\n    }});\n    const ox = HMD.x, oz = HMD.z, X = x => ox + x, Z = z => oz + z;\n    const names = [\"PELL\",\"HENDRY\",\"MARSH\",\"ORME\",\"TOLLIVER\",\"DUNMORE\"];\n    // houses along a N-S lane; west row faces east, east row faces west\n    const spots = [[-12,-32,1],[12,-26,3],[-12,-18,1],[12,-12,3],[-12,-4,1],[12,2,3]];\n    spots.forEach((s,i)=>{\n      K.house(X(s[0]), Z(s[1]), s[2], { name:names[i] });\n      const hx = (s[2]===1||s[2]===3) ? 4.9 : 4.4, hz = (s[2]===1||s[2]===3) ? 4.4 : 4.9;\n      houseFootprints.push({ minX:X(s[0])-hx, maxX:X(s[0])+hx, minZ:Z(s[1])-hz, maxZ:Z(s[1])+hz });\n    });\n    K.church(X(0), Z(36), 2);\n    houseFootprints.push({ minX:X(-6.4), maxX:X(6.4), minZ:Z(24.5), maxZ:Z(47.5) });\n    // graveyard east of the e next name on the list, and I never said it.\",\n        \"She's been answering 'present' to a roll I never finished ever since. The thing in the dark is only the roll, going door to door for its last name. Go to the art room. Finish it for me.\"];\n      if(nF()>=4) return [\n        \"You've been reading things that weren't yours to read.\",\n        \"There was a fire. Eleven years ago. I'm told it was the science lab, and I'm told a great many things.\",\n        \"Ask yourself who benefits from the rest staying buried. Come back when you know what happened.\"];\n      return [\n        \"Millbrook Middle. Forty-one students on the roll. I've counted them every morning for eleven years.\",\n        \"Last week I counted thirty-eight. Then thirty-one. This morning I stopped. That should frighten you more than it frightens me.\",\n        \"Look around if you must. Touch nothing that isn't yours. And keep out of the halls after dark. That bell isn't ours anymore.\"];}});\n    person(X(-12),0,Z(4.6),{name:\"Ms. Okafor\",body:0x6b3f5a,hat:0x3a2030,lines:()=> nF()>=6 ? [\n      \"You've been busy. So have the names in my roll book.\",\n      \"Room 203 isn't on any plan, but the doors go 202, 204. Someone bricked it over, and I'd swear the bricks were still warm.\",\n      \"Every clue you've found is a name somebody stopped saying. Keep going.\"] : [\n      \"The roll book. Yes. I keep writing names in it, and by morning they're in different handwriting.\",\n      \"There's one name at the bottom I never wrote: 'Wren Yarrow — present.' Every day. Even the days she isn't here.\",\n      \"Read the things people left behind. Lockers, desks, ledgers. Somebody has been taking attendance in this building far longer than I have.\"]});\n    person(X(-7),H,Z(-4),{name:\"Custodian Reyes\",shop:SHOP_DATA[\"Custodian Reyes\"],body:0x4a5a3a,hat:0x2b3320,lines:[\n      \"Bucket and mop. Nobody cleans the second floor anymore except me.\",\n      \"Something walks up here after axX+6) ? mp.z : SCHOOL.maxZ+3.2; }\n        const dx=tx-mp.x, dz=tz-mp.z, d=Math.hypot(dx,dz)||1; out.x+=dx/d*step; out.z+=dz/d*step; nav.lv=0; return out;\n      }\n      // where is he hunting? the player if they're inside; otherwise the way out\n      let tl=pp.lv, [ti,tj]=pp.inside?cellOf(pp.x,pp.z):cellOf(DOOR.x,DOOR.z);\n      if(!pp.inside) tl=0;\n      const spot=nearestOk(tl,ti,tj); if(!spot) return out; ti=spot[0]; tj=spot[1];\n      const key=tl+\",\"+ti+\",\"+tj, now=performance.now();\n      if(key!==navKey || now-navAt>600){ navKey=key; navAt=now; bfs(tl,ti,tj); }\n      let l=nav.lv, ok=l?ok1:ok0, here=dist[l*NN+mj*NX+mi];\n      if(here<0){ const sp=nearestOk(l,mi,mj); if(sp){ here=dist[l*NN+sp[1]*NX+sp[0]]; } }\n      if(here<0){ // not on the graph (e.g. just spawned in a wall): drift toward the door\n        const dx=DOOR.x-mp.x, dz=DOOR.z-mp.z, d=Math.hypot(dx,dz)||1; out.x+=dx/d*step; out.z+=dz/d*step; return out;\n      }\n      let tx, tz, nextL=l;\n      if(here===0){ tx=pp.inside?pp.x:gx(ti); tz=pp.inside?pp.z:gz(tj); }\n      else { let best=here, bi=-1, bj=-1, bl=l; eachNbr(l,mi,mj,(nl,ni,nj)=>{ const dd=dist[nl*NN+nj*NX+ni]; if(dd>=0&&dd<best){ best=dd; bl=nl; bi=ni; bj=nj; } });\n        if(bi<0){ tx=pp.x; tz=pp.z; } else { tx=gx(bi); tz=gz(bj); nextL=bl; } }\n      const dx=tx-mp.x, dz=tz-mp.z, d=Math.hypot(dx,dz)||1, mv=Math.min(step,d);\n      out.x+=dx/d*mv; out.z+=dz/d*mv;\n      if(nextL!==l && d<0.7) nav.lv=nextL;\n      // his height: along the stair ramp, otherwise whichever floor he's on\n      if(nav.lv===0 && inStair(out.x,out.z)){ const t=Math.max(0,Math.min(1,(out.x-schoolStair.from)/(schoolStair.to-schoolStair.from))); out.y=H*t; } else out.y=nav.lv*H;\n      return out;\n    };\n    schoolNavReset=function(){ nav.lv=0; navKey=\"\"; };\n  })();\n\n  // ---------- roadside merchants ----------\n  function roadMerchant(x,z,cfg,tx,tz,tw,td){\n    const g=new THREE.Group(), M=c=>new THREE.MeshStandardMaterial({color:c,roughnes sc.connect(gain); gain.connect(audioCtx.destination);\n      osc.start(t); osc.stop(t+0.32);\n    } catch(e){}\n  }\n\n  // ---------- chapter cutscenes (a DLC-style title sequence) + the chapter select ----------\n  const CHAPTER_CS = {\n    1:{ kicker:\"M I L L B R O O K\", label:\"CHAPTER ONE\", title:\"The Town\", accent:\"#c0553a\",\n        lines:[\"A foggy little town. Four villages, one road in, and something red waiting at the end of it.\",\n               \"Find out who has gone missing. Find out what the town remembers.\",\n               \"And be indoors before dark.\"] },\n    2:{ kicker:\"M I L L B R O O K   ·   A  N E W  C H A P T E R\", label:\"CHAPTER TWO\", title:\"The Last Name on the Roll\", accent:\"#d9a45c\",\n        lines:[\"Millbrook Middle. Forty-one students on the roll. Forty-one doors that never opened again.\",\n               \"Somebody is still taking attendance.\",\n               \"Whatever you do, don't answer to your name.\"] }\n  };\n  function playChapterCutscene(ch){\n    const d = CHAPTER_CS[ch]; if(!d || chapterCutsceneActive) return;\n    chapterCutsceneActive = true; frozen = true;\n    const timers = [], at = (ms, fn)=>timers.push(setTimeout(fn, ms));\n    const ov = document.createElement(\"div\");\n    ov.style.cssText = \"position:fixed;inset:0;z-index:70;background:#000;opacity:0;transition:opacity 0.9s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;font-family:Georgia,serif;color:#f3e9d8;cursor:default\";\n    const mk = (css, txt)=>{ const e=document.createElement(\"div\"); e.style.cssText = \"opacity:0;transition:opacity 1.4s ease;\" + css; e.textContent = txt; ov.appendChild(e); return e; };\n    const k = mk(\"font-size:15px;letter-spacing:0.1em;color:#9a9186;margin-bottom:26px;transition:opacity 1.4s ease,letter-spacing 6s ease;\", d.kicker);\n    const lab = mk(\"font-size:17px;letter-spacing:0.5em;color:\"+d.accent+\";margin-bottom:14px;\", d.label); g.fillRect(x + 2, y + 2, 124, 60);\n    }\n  }\n  speck(g, w, h, 3000, .14, true); speck(g, w, h, 1200, .07, false);\n});\nconst tRoof = ctex(256, 256, (g, w, h) => {\n  g.fillStyle = '#23272a'; g.fillRect(0, 0, w, h);\n  for (let y = 0; y < h; y += 24) {\n    for (let x = ((y / 24) % 2) * 16; x < w; x += 32) {\n      const v = (R() - .5) * 18;\n      g.fillStyle = 'rgb(' + (36 + v) + ',' + (40 + v) + ',' + (43 + v) + ')';\n      g.fillRect(x + 1, y + 1, 30, 22);\n    }\n  }\n  speck(g, w, h, 1500, .15, true);\n});\nconst tBark = ctex(128, 128, (g, w, h) => {\n  g.fillStyle = '#1d1815'; g.fillRect(0, 0, w, h);\n  for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(0,0,0,' + R() * .5 + ')'; g.fillRect(R() * w, 0, 1 + R() * 3, h); }\n  speck(g, w, h, 400, .1, false);\n});\nconst tGround = ctex(256, 256, (g, w, h) => {\n  g.fillStyle = '#161d14'; g.fillRect(0, 0, w, h);\n  speck(g, w, h, 6000, .22, true, 2); speck(g, w, h, 3000, .12, false, 2);\n  for (let i = 0; i < 700; i++) {\n    g.strokeStyle = 'rgba(' + (30 + R() * 30 | 0) + ',' + (45 + R() * 30 | 0) + ',20,.35)';\n    const x = R() * w, y = R() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 4, y - 3 - R() * 5); g.stroke();\n  }\n});\nconst tRoad = ctex(256, 256, (g, w, h) => {\n  g.fillStyle = '#2b261f'; g.fillRect(0, 0, w, h);\n  speck(g, w, h, 5000, .2, true, 3); speck(g, w, h, 2500, .12, false, 2);\n  for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(8,10,12,' + R() * .35 + ')'; g.beginPath(); g.ellipse(R() * w, R() * h, 4 + R() * 14, 2 + R() * 6, R() * 3, 0, 7); g.fill(); }\n});\ntGround.repeat.set(110, 110);\n\nconst mk = (map, col, rough) => new T.MeshStandardMaterial({ map: map || null, color: col === undefined ? 0xffffff : col, roughness: rough === undefined ? 1 : rough, metalness: 0 });\nconst M = {\n  plaster: mk(tPlaster), wood: mk(tWood), stone: mk(tStone), roof: mk(tRoof), bark: mk(tBark),\n  iron: mk(null, 0x16181b, .6), cloth: mk(null, 0x3b2a2a), bone: mk(null, 0x9d998c), moss: mk(null, 0x1d2a1b)\n};\n[['plaster', tPlaster, 2.2], ['wood', tWood, 2.0], ['stone', tStone, 3.2], ['roof', tRoof, 2.5], ['bark', tBark, 2.0]].forEach(a => { M[a[0]].bumpMap = a[1]; M[a[0]].bumpScale = a[2]; });\n\n\n  function radialTex(inner, outer) {\n    const c = document.createElement('canvas'); c.width = c.height = 64;\n    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);\n    gr.addColorStop(0, inner); gr.addColorStop(1, outer);\n    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);\n    return new T.CanvasTexture(c);\n  }\n  M.hay = mk(null, 0x6e5d2c);\n  const tPath = tRoad.clone(); tPath.repeat.set(1, 1); tPath.needsUpdate = true;\n  const pathMat = new T.MeshStandardMaterial({ map: tPath, roughness: 1, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });\n  const waterMat = new T.MeshStandardMaterial({ color: 0x0a1418, roughness: 0.18, metalness: 0.35 });\n  shared = { ctex, speck, tPlaster, tWood, tStone, tRoof, tBark, tGround, tRoad, M, mk, radialTex, pathMat, waterMat,\n    haloTex: radialTex('rgba(255,170,70,.55)', 'rgba(255,120,30,0)'),\n    mistTex: radialTex('rgba(120,140,150,0.5)', 'rgba(120,140,150,0)'),\n    eyeTex: radialTex('rgba(255,60,40,1)', 'rgba(255,40,20,0)') };\n  return shared;\n}\n\n/* ---------- a building toolkit bound to one scene ---------- */\nfunction create(scene, cfg) {\n  cfg = cfg || {};\n  const SH = getShared(), M = SH.M;\n  const tRoad = SH.tRoad;\nconst batches = {};\nconst made = [];\nfunction boxGeo(sx, sy, sz, tile) {\n  const g = new T.BoxGeometry(sx, sy, sz);\n  const uv = g.attributes.uv;\n  const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];\n  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {\n    const i = f * 4 + v;\n    uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);\n  }\n  uv.needsUpdate = true;\n  return g;\n}\nfunction addGeo(g, key) { (batches[key] = batches[key] || []).push(g); }\nfunction mergeGeos(list) {\n  let vc = 0, ic = 0;\n  list.forEach(g => { vc += g.attributes.position.count; ic += g.index.count; });\n  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);\n  const idx = vc > 65535 ? new Uint32Array(ic) : new Uint16Array(ic);\n  let vo = 0, io = 0;\n  list.forEach(g => {\n    pos.set(g.attributes.position.array, vo * 3);\n    nor.set(g.attributes.normal.array, vo * 3);\n    uv.set(g.attributes.uv.array, vo * 2);\n    const ia = g.index.array;\n    for (let i = 0; i < ia.length; i++) idx[io + i] = ia[i] + vo;\n    vo += g.attributes.position.count; io += ia.length;\n    g.dispose();\n  });\n  const m = new T.BufferGeometry();\n  m.setAttribute('position', new T.BufferAttribute(pos, 3));\n  m.setAttribute('normal', new T.BufferAttribute(nor, 3));\n  m.setAttribute('uv', new T.BufferAttribute(uv, 2));\n  m.setIndex(new T.BufferAttribute(idx, 1));\n  m.computeBoundingSphere(); m.computeBoundingBox();\n  return m;\n}\nfunction finalizeBatches() {\n  for (const k in batches) {\n    const m = new T.Mesh(mergeGeos(batches[k]), M[k]);\n    m.castShadow = true; m.receiveShadow = true;\n    scene.add(m);\n    made.push(m);\n  }\n  for (const k in batches) delete batches[k];\n}\n  const boxes = [];            // every solid box made through this kit\n  const stairRisers = [];      // collected risers (grouped into ramps by takeRamps)\n  const floorSlabs = [];\n  function solid(x0, y0, z0, x1, y1, z1, key, o) {\n    o = o || {};\n    if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4 || z1 - z0 < 1e-4) return null;\n    if (!o.noMesh) {\n      const g = boxGeo(x1 - x0, y1 - y0, z1 - z0, o.tile || 2);\n      g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);\n      addGeo(g, key);\n    }\n    const b = { x0, y0, z0, x1, y1, z1 };\n    if (o.stair) { stairRisers.push(b); return null; }\n    if (o.floor) { floorSlabs.push(b); return null; }\n    if (o.noCollide) return null;\n    boxes.push(b);\n    if (cfg.onBox) cfg.onBox(b, o);\n    return b;\n  }\n  const _m4 = new T.Matrix4(), _q = new T.Quaternion(), _e = new T.Euler(), _p = new T.Vector3(), _s = new T.Vector3(1, 1, 1);\nfunction place(g, x, y, z, rx, ry, rz, sx, sy, sz) {\n  _e.set(rx || 0, ry || 0, rz || 0); _q.setFromEuler(_e);\n  _p.set(x, y, z); _s.set(sx || 1, sy || 1, sz || 1);\n  g.applyMatrix4(_m4.compose(_p, _q, _s));\n  return g;\n}\nfunction scrawlMesh(txt, wd, ht, col) {\n  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * ht / wd);\n  const g = c.getContext('2d');\n  g.clearRect(0, 0, c.width, c.height);\n  g.fillStyle = col || '#8a1812'; g.textAlign = 'center'; g.textBaseline = 'middle';\n  const lines = txt.split('\\n'); const fs = Math.min(70, c.height / (lines.length + .6));\n  g.font = 'bold ' + fs + 'px \"Special Elite\",\"Courier New\",monospace';\n  lines.forEach((ln, i) => g.fillText(ln, c.width / 2, c.height * (i + 1) / (lines.length + 1)));\n  for (let i = 0; !col && i < 14; i++) {\n    const x = 20 + R() * (c.width - 40), y = c.height * (.3 + R() * .5);\n    const gr = g.createLinearGradient(0, y, 0, y + 20 + R() * 60);\n    gr.addColorStop(0, 'rgba(138,24,18,.8)'); gr.addColorStop(1, 'rgba(138,24,18,0)');\n    g.fillStyle = gr; g.fillRect(x, y, 2 + R() * 2, 20 + R() * 60);\n  }\n  const t = new T.CanvasTexture(c);\n  const mat = new T.MeshStandardMaterial({ map: t, transparent: true, roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });\n  return new T.Mesh(new T.PlaneGeometry(wd, ht), mat);\n}\n\n\nfunction builder(cx, cz, rot) {\n  const Tf = (x, z) => {\n    switch (rot) {\n      case 0: return [cx + x, cz + z];\n      case 1: return [cx + z, cz - x];\n      case 2: return [cx - x, cz - z];\n      default: return [cx - z, cz + x];\n    }\n  };\n  const L = (x0, y0, z0, x1, y1, z1, key, op) => {\n    const a = Tf(x0, z0), b = Tf(x1, z1);\n    return solid(Math.min(a[0], b[0]), y0, Math.min(a[1], b[1]), Math.max(a[0], b[0]), y1, Math.max(a[1], b[1]), key, op);\n  };\n  // wall run with carved openings: alongX walls extend along local x between lo..hi in z\n  const wall = (alongX, lo, hi, a, b, y0, y1, openings, key) => {\n    const pts = new Set([a, b]);\n    openings.forEach(o => { pts.add(o.a); pts.add(o.b); });\n    const xs = Array.from(pts).sort((p, q) => p - q);\n    const seg = (s, e, ya, yb) => { if (alongX) L(s, ya, lo, e, yb, hi, key); else L(lo, ya, s, hi, yb, e, key); };\n    for (let i = 0; i < xs.length - 1; i++) {\n      const s = xs[i], e = xs[i + 1];\n      if (e - s < 0.001 || s < a - 1e-6 || e > b + 1e-6) continue;\n      const mid = (s + e) / 2;\n      const holes = openings.filter(o => o.a <= mid && mid <= o.b).map(o => [o.y0, o.y1]).sort((p, q) => p[0] - q[0]);\n      let cur = y0;\n      for (const h of holes) { if (h[0] > cur) seg(s, e, cur, h[0]); cur = Math.max(cur, h[1]); }\n      if (cur < y1) seg(s, e, cur, y1);\n    }\n    openings.forEach(o => {\n      const p = 0.08, th = 0.06, tall = o.y1 - o.y0 > 2.0;\n      [1, -1].forEach(face => {\n        const tb = (xa, xb, ya, yb, dp) => {\n          if (alongX) L(xa, ya, face > 0 ? hi : lo - dp, xb, yb, face > 0 ? hi + dp : lo, 'wood', { noCollide: true });\n          else L(face > 0 ? hi : lo - dp, ya, xa, face > 0 ? hi + dp : lo, yb, xb, 'wood', { noCollide: true });\n        };\n        tb(o.a - p, o.b + p, o.y1, o.y1 + p * 1.3, th);\n        tb(o.a - p, o.a, o.y0, o.y1, th);\n        tb(o.b, o.b + p, o.y0, o.y1, th);\n        if (!tall) tb(o.a - p - 0.03, o.b + p + 0.03, o.y0 - 0.07, o.y0, th + 0.05);\n      });\n    });\n  };\n  const world = (x, z) => Tf(x, z);\n  const scrawl = (txt, lx, y, lz, nx, nz, wd, ht, col) => {\n    const p = Tf(lx, lz), o = Tf(0, 0), n = Tf(nx, nz);\n    const wnx = n[0] - o[0], wnz = n[1] - o[1];\n    const m = scrawlMesh(txt, wd, ht, col);\n    m.position.set(p[0] + wnx * 0.02, y, p[1] + wnz * 0.02);\n    m.rotation.y = Math.atan2(wnx, wnz);\n    scene.add(m);\n  };\n  return { Tf: world, L, wall, scrawl, rot, cx, cz };\n}\n\nfunction pyramidRoof(cx, cz, y, rw, rd, h) {\n  const g = new T.ConeGeometry(0.7071, 1, 4, 1, false);\n  g.rotateY(Math.PI / 4);\n  const uv = g.attributes.uv;\n  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rw / 2, uv.getY(i) * h / 1.5);\n  g.scale(rw, h, rd);\n  g.translate(cx, y + h / 2, cz);\n  addGeo(g, 'roof');\n}\n\n\n/* A two-storey house: foundation, carved door and windows, real staircase, floor with a stairwell, rails. */\nfunction house(cx, cz, rot, o) {\n  o = o || {};\n  const w = o.w || 8, d = o.d || 9, t = 0.3;\n  const F0 = FL0, F1 = F0 + STOREY, Ht = F1 + 3.0, n = NST, run = RUN, rise = (F1 - F0) / n;\n  const hw = w / 2, hd = d / 2;\n  const B = builder(cx, cz, rot), L = B.L, wall = B.wall;\n  const dxD = o.doorX === undefined ? 1.2 : o.doorX;\n  const sx0 = -hw + t, sx1 = sx0 + STAIR_W, zS = hd - t - 1.0, zh0 = zS - (n - 1) * run;\n\n  L(-hw - 0.25, 0, -hd - 0.25, hw + 0.25, F0 - 0.04, hd + 0.25, 'stone');\n  L(-hw + t, F0 - 0.04, -hd + t, hw - t, F0, hd - t, 'wood');\n  L(dxD - 1.3, 0, hd + 0.25, dxD + 1.3, 0.16, hd + 1.1, 'stone');\n\n  const win = (c, y, wd) => ({ a: c - wd / 2, b: c + wd / 2, y0: y + 0.95, y1: y + 2.05 });\n  const door = { a: dxD - 0.65, b: dxD + 0.65, y0: F0, y1: F0 + 2.3 };\n  wall(true, hd - t, hd, -hw, hw, 0, Ht, [door, win(-0.9, F0, 1.0), win(hw - 1.1, F0, 1.0), win(-1.2, F1, 1.0), win(2.4, F1, 1.0)], 'plaster');\n  wall(true, -hd, -hd + t, -hw, hw, 0, Ht, [win(-1.5, F0, 1.0), win(1.8, F0, 1.0), win(-1.5, F1, 1.0), win(1.8, F1, 1.0)], 'plaster');\n  const side = [win(-1.8, F0, 1.0), win(1.5, F0, 1.0), win(-2.0, F1, 1.0), win(1.8, F1, 1.0)];\n  wall(false, -hw, -hw + t, -hd + t, hd - t, 0, Ht, side, 'plaster');\n  wall(false, hw - t, hw, -hd + t, hd - t, 0, Ht, side, 'plaster');\n\n  if (o.boarded) {\n    [-0.9, hw - 1.1].forEach(c => {\n      L(c - 0.6, F0 + 1.15, hd, c + 0.6, F0 + 1.32, hd + 0.06, 'wood');\n      L(c - 0.6, F0 + 1.6, hd, c + 0.6, F0 + 1.77, hd + 0.06, 'wood');\n    });\n  }\n\n  // upper floor with stairwell\n  const sl0 = F1 - 0.2;\n  L(sx1, sl0, -hd + t, hw - t, F1, hd - t, 'wood', { floor: 1 });\n  L(sx0, sl0, -hd + t, sx1, F1, zh0, 'wood', { floor: 1 });\n  L(sx0, sl0, zS, sx1, F1, hd - t, 'wood', { floor: 1 });\n  // staircase: solid risers from the floor up\n  for (let i = 1; i <= n; i++) L(sx0, F0, zS - i * run, sx1, F0 + i * rise, zS - (i - 1) * run, 'wood', { stair: 1 });\n  // rails around the open stairwell\n  L(sx1, F1, zh0, sx1 + 0.08, F1 + 1.0, zS + 0.08, 'wood');\n  L(sx0, F1, zS, sx1, F1 + 1.0, zS + 0.08, 'wood');\n  // roof\n  L(-hw - 0.35, Ht, -hd - 0.35, hw + 0.35, Ht + 0.2, hd + 0.35, 'wood', { noCollide: true });\n  const wc = B.Tf(0, 0), swap = rot % 2 === 1;\n  pyramidRoof(wc[0], wc[1], Ht + 0.2, (swap ? d : w) + 1.5, (swap ? w : d) + 1.5, 2.6);\n\n  // partitions with doorways\n  const pz = -1.0;\n  wall(true, pz - 0.1, pz + 0.1, sx1, hw - t, F0, sl0, [{ a: 0.5, b: 1.6, y0: F0, y1: F0 + 2.2 }], 'plaster');\n  wall(true, pz - 0.1, pz + 0.1, sx1, hw - t, F1, Ht, [{ a: 0.5, b: 1.6, y0: F1, y1: F1 + 2.2 }], 'plaster');\n\n  // furniture\n  const blk = (x0, z0, x1, z1, F, h, key) => L(x0, F, z0, x1, F + h, z1, key || 'wood');\n  const table = (x, z, F, ww, dd) => L(x - ww / 2, F + 0.7, z - dd / 2, x + ww / 2, F + 0.78, z + dd / 2, 'wood');\n  const chair = (x, z, F, fz) => {\n    L(x - 0.22, F, z - 0.22, x + 0.22, F + 0.56, z + 0.22, 'wood');\n    L(x - 0.22, F + 0.56, z + (fz > 0 ? -0.22 : 0.17), x + 0.22, F + 1.05, z + (fz > 0 ? -0.17 : 0.22), 'wood');\n  };\n  table(0.4, 1.7, F0, 1.6, 0.9); chair(0.4, 0.8, F0, 1); chair(0.4, 2.6, F0, -1);\n  blk(hw - t - 0.5, 2.5, hw - t, 3.9, F0, 1.9);\n  blk(sx1 + 0.1, -4.1 + 0.0, sx1 + 1.0, -3.4, F0, 1.0, 'stone');\n  blk(hw - t - 1.0, -hd + t, hw - t, -hd + t + 0.7, F0, 1.0, 'stone');\n  blk(0.6, -hd + t, 1.5, -hd + t + 0.6, F0, 0.7);\n  chair(0.0, -2.4, F0, -1);\n  // upstairs rear bedroom\n  blk(hw - t - 1.2, -hd + t, hw - t, -2.0, . This is only one way through.<\/p>\n    <ol>\n      <li>Five flames still burn in the houses of the Oath: Pell, Hendry, Marsh, Orme, Tolliver. Read the nameplates over the doors.<\/li>\n      <li>Carry each flame out. Candles on the upper floors burn higher than the ones below.<\/li>\n      <li>The gate opens when all five are in your hands. Go back south.<\/li>\n    <\/ol>\n    <p class=\"qnote\">Side pursuits: find all the pages, learn the rules of the Count, find the places the village hides. There may be another way out.<\/p>\n    <button id=\"questTrack\" type=\"button\">Stop tracking<\/button>\n  <\/div>\n  <p id=\"goal\">Find the five candles. The gate stays shut until all of them are in your hands.<\/p>\n  <p id=\"near\"><\/p>\n  <div id=\"compass\" hidden><span id=\"cpL\">&#8249;<\/span><div id=\"cpBar\"><i id=\"cpMark\"><\/i><\/div><span id=\"cpR\">&#8250;<\/span><b id=\"cpV\"><\/b><\/div>\n<\/div>\n<div id=\"prompt\" hidden><\/div>\n<div id=\"stam\" hidden><i><\/i><\/div>\n<div id=\"act\" hidden><\/div>\n<div id=\"noteCard\" hidden><h3 id=\"noteTitle\"><\/h3><p id=\"noteText\"><\/p><small>E to put it down. Saved to your journal (J).<\/small><\/div>\n\n<div id=\"touch\" hidden>\n  <div id=\"stickBase\"><div id=\"stickKnob\"><\/div><\/div>\n  <button class=\"tbtn\" id=\"tJournal\" type=\"button\">LOG<\/button>\n  <button class=\"tbtn\" id=\"tAct\" type=\"button\">USE<\/button>\n  <button class=\"tbtn\" id=\"tLight\" type=\"button\">LIGHT<\/button>\n  <button class=\"tbtn\" id=\"tRun\" type=\"button\">RUN<\/button>\n  <button class=\"tbtn\" id=\"tJump\" type=\"button\">JUMP<\/button>\n  <button class=\"tbtn\" id=\"tCrouch\" type=\"button\">DUCK<\/button>\n<\/div>\n\n<section class=\"screen\" id=\"title\">\n  <div id=\"tFog1\"><\/div><div id=\"tFog2\"><\/div>\n  <svg id=\"tRoad\" viewBox=\"0 0 400 300\" preserveAspectRatio=\"xMidYMax slice\" aria-hidden=\"true\">\n    <defs><linearGradient id=\"rg\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2a2d29\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#14160f\" stop-opacity=\".95\"/><\/linearGradient><\/defs>\n    <path d=\"M196 150 L204 150 L330 300 L70 300 Z\" fill=\"url(#rg)\"/>\n    <g fill=\"#050605\"><path d=\"M40 300 V205 l8 -40 4 40 V300z M90 300 V190 l7-50 5 50 V300z M320 300 V200 l8-45 4 45 V300z M365 300 V185 l7-55 5 55 V300z\"/>\n    <rect x=\"130\" y=\"128\" width=\"34\" height=\"24\"/><path d=\"M126 128 L147 108 L168 128z\"/><rect x=\"238\" y=\"122\" width=\"40\" height=\"30\"/><path d=\"M234 122 L258 98 L282 122z\"/><\/g>\n    <g fill=\"#efb54f\"><rect x=\"141\" y=\"136\" width=\"4\" height=\"5\" opacity=\".9\"/><rect x=\"262\" y=\"132\" width=\"4\" height=\"5\" opacity=\".7\"/><\/g>\n  <\/svg>\n  <div id=\"tFigure\"><i><\/i><i><\/i><\/div>\n  <div class=\"card tcard\">\n    <p class=\"tkick\">Night Three<\/p>\n    <h1 data-t=\"The Beyond Files V: Randy\">The Beyond Files V: Randy<\/h1>\n    <p class=\"tag\">Five candles. One gate. Randy, R-2, the Weeper, and the thing that only moves when you look away.<\/p>\n    <p class=\"lede tl\">You arrived after dusk, Luca, and the gate closed behind you. You were Lyra's friend before she slipped into the fourth dimension, and you wanted to be a detective like her parent, Echo. Now you are in Hollowmere, running from Randy. That makes you <em>uncounted<\/em>, and the uncounted are what the Count takes.<\/p>\n    <button class=\"go\" id=\"start\" type=\"button\">Enter the village<\/button>\n    <button id=\"titleQuest\" type=\"button\">Recommended quest: on<\/button>\n    <details class=\"tdet\"><summary>What you should know<\/summary>\n      <p class=\"lede\">Five flames still burn in the houses of the Oath. Carry them back to the gate. Something walks the lanes. It only moves when you are not looking at it, and walls do not stop it. Stare too long and it comes for you. Randy hunts you because you carry Echo's case files. There are cupboards. There may be other ways out.<\/p>\n      <div class=\"keys\" id=\"keys\">\n        <b>W A S D<\/b><span>walk<\/span>\n        <b>Mouse<\/b><span>look<\/span>\n        <b>Shift<\/b><span>run (tires you)<\/span>\n        <b>Space<\/b><span>jump onto ledges, over fences<\/span>\n        <b>C<\/b><span>crouch (slow, low)<\/span>\n        <b>F<\/b><span>flashlight<\/span>\n        <b>E<\/b><span>read notes, hide in cupboards<\/span>\n        <b>J<\/b><span>journal<\/span>\n        <b>H<\/b><span>hint<\/span>\n        <b>Q<\/b><span>recommended quest panel (optional)<\/span>\n        <b>T<\/b><span>track / stop tracking the quest<\/span>\n        <b>G<\/b><span>graphics high / low<\/span>\n      <\/div>\n    <\/details>\n    <p class=\"fine\">Sound on. Headphones help. The stairs are real: climb them.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"screen\" id=\"paused\" hidden>\n  <div class=\"card\">\n    <h2>Paused<\/h2>\n    <button class=\"go\" id=\"resume\" type=\"button\">Keep walking<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"screen dead\" id=\"dead\" hidden>\n  <div class=\"card\">\n    <h2>It found you.<\/h2>\n    <p class=\"lede\" id=\"deadMsg\">You looked away for one breath too long.<\/p>\n    <p class=\"fine\" id=\"deadStats\"><\/p>\n    <p class=\"lede\" id=\"deadTip\"><\/p>\n    <button class=\"go\" id=\"again\" type=\"button\">Try again<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"screen\" id=\"won\" hidden>\n  <div class=\"card\">\n    <h2 id=\"wonTitle\">The gate opens.<\/h2>\n    <p class=\"lede\" id=\"wonLede\">Five flames, carried out into the dark. Behind you the lanes of Hollowmere go quiet. Something is still standing at the top of the road, watching you leave.<\/p>\n    <p class=\"lede\" id=\"wonStory\"><\/p>\n    <p class=\"fine\" id=\"wonTime\"><\/p>\n    <button class=\"go\" id=\"again2\" type=\"button\">Go back in<\/button>\n  <\/div>\n<\/section>\n\n<section class=\"screen\" id=\"journal\" hidden>\n  <div class=\"jwrap\">\n    <h2>Journal<\/h2>\n    <div class=\"jgrid\">\n      <div class=\"jcol\">\n        <h3>The five flames<\/h3>\n        <ul id=\"jFlames\"><\/ul>\n        <h3>What you have learned<\/h3>\n        <ul id=\"jRules\"><\/ul>\n        <button class=\"go\" id=\"jHint\" type=\"button\">Need a nudge?<\/button>\n        <p class=\"lede\" id=\"jHintText\"><\/p>\n      <\/div>\n      <div class=\"jcol\">\n        <h3>Pages <small id=\"jCount\" class=\"fine\"><\/small><\/h3>\n        <div id=\"jPages\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"jbar\"><button class=\"go\" id=\"jClose\" type=\"button\">Back to the village<\/button><\/div>\n  <\/div>\n<\/section>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js\"><\/script>\n<script>\n(function () {\n  var t = document.getElementById('title'), f = document.getElementById('tFigure'); if (!t || !f) return;\n  var step = 0, last = Date.now();\n  function set(k, v) { f.style.setProperty(k, v); }\n  function look() { last = Date.now(); set('--eye', 0); }\n  ['mousemove', 'keydown', 'touchstart'].forEach(function (ev) { t.addEventListener(ev, look, { passive: true }); });\n  setInterval(function () {\n    if (t.hidden) { step = 0; set('--fs', 1); set('--eye', 0); return; }\n    var idle = Date.now() - last > 3500;\n    if (idle) { step = Math.min(step + 1, 9); set le = a[2]; });\n\n/* ---------- lights ---------- */\nconst hemi = new T.HemisphereLight(0x2a3a4c, 0x0a0a09, 0.42);\nscene.add(hemi);\nconst moon = new T.DirectionalLight(0x6f89aa, 0.2);\nmoon.position.set(-30, 60, 20);\nscene.add(moon);\nconst flash = new T.SpotLight(0xfff0cc, 2.0, 46, 0.5, 0.5, 1.2);\nflash.position.set(0.12, -0.1, 0.1);\nflash.target.position.set(0, 0, -6);\ncamera.add(flash); camera.add(flash.target);\nflash.castShadow = true;\nflash.shadow.mapSize.set(1024, 1024);\nflash.shadow.camera.near = 0.15;\nflash.shadow.camera.far = 40;\nflash.shadow.bias = -0.0004;\nflash.shadow.normalBias = 0.03;\nflash.shadow.radius = 3;\n\n/* ---------- geometry batching ---------- */\nconst batches = {};\nconst losMeshes = [];\nfunction boxGeo(sx, sy, sz, tile) {\n  const g = new T.BoxGeometry(sx, sy, sz);\n  const uv = g.attributes.uv;\n  const dims = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];\n  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {\n    const i = f * 4 + v;\n    uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);\n  }\n  uv.needsUpdate = true;\n  return g;\n}\nfunction addGeo(g, key) { (batches[key] = batches[key] || []).push(g); }\nfunction mergeGeos(list) {\n  let vc = 0, ic = 0;\n  list.forEach(g => { vc += g.attributes.position.count; ic += g.index.count; });\n  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);\n  const idx = vc > 65535 ? new Uint32Array(ic) : new Uint16Array(ic);\n  let vo = 0, io = 0;\n  list.forEach(g => {\n    pos.set(g.attributes.position.array, vo * 3);\n    nor.set(g.attributes.normal.array, vo * 3);\n    uv.set(g.attributes.uv.array, vo * 2);\n    const ia = g.index.array;\n    for (let i = 0; i < ia.length; i++) idx[io + i] = ia[i] + vo;\n    vo += g.attributes.position.count; io += ia.length;\n    g.dispose();\n  });\n  const m = new T.BufferGeometry();\n  m.setAttribute('position', new T.BufferAttribute(pos, 3));\n  m.setAttribute('normal', new T.BufferAttribute(nor, 3));\n  m.setAttribute('uv', new T.BufferAttribute(uv, 2));\n  m.setIndex(new T.BufferAttribute(idx, 1));\n  m.computeBoundingSphere(); m.computeBoundingBox();\n  return m;\n}\nfunction finalizeBatches() {\n  for (const k in batches) {\n    const m = new T.Mesh(mergeGeos(batches[k]), M[k]);\n    m.castShadow = true; m.receiveShadow = true;\n    scene.add(m);\n    losMeshes.push(m);\n  }\n}\n\n/* ---------- colliders: axis-aligned boxes in a coarse grid ---------- */\nconst CELL = 8, OFF = 64;\nconst grid = new Map();\nconst gk = (ix, iz) => (ix + OFF) * 256 + (iz + OFF);\nfunction addCollider(b) {\n  const ix0 = Math.floor(b.x0 / CELL), ix1 = Math.floor(b.x1 / CELL);\n  const iz0 = Math.floor(b.z0 / CELL), iz1 = Math.floor(b.z1 / CELL);\n  for (let ix = ix0; ix <= ix1; ix++) for (let iz = iz0; iz <= iz1; iz++) {\n    const k = gk(ix, iz); let a = grid.get(k);\n    if (!a) { a = []; grid.set(k, a); }\n    a.push(b);\n  }\n  return b;\n}\nfunction solid(x0, y0, z0, x1, y1, z1, key, o) {\n  o = o || {};\n  if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4 || z1 - z0 < 1e-4) return null;\n  if (!o.noMesh) {\n    const g = boxGeo(x1 - x0, y1 - y0, z1 - z0, o.tile || 2);\n    g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);\n    addGeo(g, key);\n  }\n  return o.noCollide ? null : addCollider({ x0, y0, z0, x1, y1, z1 });\n}\n\nconst PR = 0.34, PH = 1.75, STEP = 0.46;\nfunction blocked(x, z, feet, r) {\n  const ix0 = Math.floor((x - r) / CELL), ix1 = Math.floor((x + r) / CELL);\n  const iz0 = Math.floor((z - r) / CELL), iz1 = Math.floor((z + r) / CELL);\n  for (let ix = ix0; ix <= ix1; ix++) for (let iz = iz0; iz <= iz1; iz++) {\n    const a = grid.get(gk(ix, iz)); if (!a) continue;\n    for (let i = 0; i < a.length; i++) {\n      const b = a[i];\n      if (x + r > b.x0 && x - r < b.x1 && z + r > b.z0 && z - r < b.z1 && b.y1 > feet + STEP && b.y0 < feet + PH) return true;\n    }\n  }\n  return false;\n}\nfunction groundAt(x, z,
