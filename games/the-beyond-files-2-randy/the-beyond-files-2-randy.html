  const gr = g.createLinearGradient(0, y, 0, y + 20 + R() * 60);\n    gr.addColorStop(0, 'rgba(138,24,18,.8)'); gr.addColorStop(1, 'rgba(138,24,18,0)');\n    g.fillStyle = gr; g.fillRect(x, y, 2 + R() * 2, 20 + R() * 60);\n  }\n  const t = new T.CanvasTexture(c);\n  const mat = new T.MeshStandardMaterial({ map: t, transparent: true, roughness: 1, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });\n  return new T.Mesh(new T.PlaneGeometry(wd, ht), mat);\n}\n\n/* ---------- interaction spots: cupboards to hide in, notes to read ---------- */\nconst hideSpots = [], noteSpots = [];\nfunction addHide(c, e, y, dir) { hideSpots.push({ x: c[0], z: c[1], ex: e[0], ez: e[1], y: y, yaw: Math.atan2(-dir[0], -dir[1]) }); }\nfunction addNote(w, sy, fy, n) {\n  let m = null;\n  if (!n.noMesh) {\n    m = new T.Mesh(new T.PlaneGeometry(0.26, 0.34), new T.MeshStandardMaterial({ color: 0xd2c9a6, emissive: 0x3a3320, roughness: 1 }));\n    m.rotation.x = -Math.PI / 2; m.rotation.z = (R() - 0.5) * 0.8;\n    m.position.set(w[0], sy + 0.012, w[1]); scene.add(m);\n  }\n  noteSpots.push({ x: w[0], z: w[1], y: fy, sy: sy, title: n.title, text: n.text, order: n.order, reach: n.reach || 2.0, stop: n.stop || 0.15, read: false, mesh: m });\n}\n\n/* ---------- faces that watch from windows ---------- */\nconst faceSpots = [];\nconst faceTex = ctex(128, 192, (g, w, h) => {\n  g.clearRect(0, 0, w, h);\n  const gr = g.createRadialGradient(64, 90, 6, 64, 96, 80);\n  gr.addColorStop(0, 'rgba(206,202,184,1)'); gr.addColorStop(0.75, 'rgba(150,146,132,1)'); gr.addColorStop(1, 'rgba(60,58,52,0)');\n  g.fillStyle = gr; g.beginPath(); g.ellipse(64, 96, 44, 80, 0, 0, 7); g.fill();\n  g.fillStyle = '#050505';\n  g.beginPath(); g.ellipse(46, 78, 11, 19, 0.15, 0, 7); g.fill();\n  g.beginPath(); g.ellipse(82, 78, 11, 19, -0.15, 0, 7); g.fill();\n  g.beginPath(); g.ellipse(64, 138, 11, 26, 0, 0, 7); g.fill();\n  g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(62, 96, 4, 22);\n});\nfunction addFace(w, y, n) {\n  const l = Math.hypot(n[0], n[1]) || 1;\n  const sp = new T.Sprite(new T.SpriteMaterial({ map: faceTex, transparent: true, depthWrite: false }));\n  sp.scale.set(0.5, 0.75, 1); sp.position.set(w[0], y, w[1]); sp.visible = false; scene.add(sp);\n  faceSpots.push({ x: w[0], z: w[1], y: y, nx: n[0] / l, nz: n[1] / l, sp: sp, state: 0, away: 0 });\n}\n\n/* ---------- buildings ---------- */\nconst relics = [];\nconst FL0 = 0.3, STOREY = 3.2, STAIR_W = 1.5, NST = 12, RUN = 0.55;\n\nfunction builder(cx, cz, rot) {\n  const Tf = (x, z) => {\n    switch (rot) {\n      case 0: return [cx + x, cz + z];\n      case 1: return [cx + z, cz - x];\n      case 2: return [cx - x, cz - z];\n      default: return [cx - z, cz + x];\n    }\n  };\n  const L = (x0, y0, z0, x1, y1, z1, key, op) => {\n    const a = Tf(x0, z0), b = Tf(x1, z1);\n    return solid(Math.min(a[0], b[0]), y0, Math.min(a[1], b[1]), Math.max(a[0], b[0]), y1, Math.max(a[1], b[1]), key, op);\n  };\n  // wall run with carved openings: alongX walls extend along local x between lo..hi in z\n  const wall = (alongX, lo, hi, a, b, y0, y1, openings, key) => {\n    const pts = new Set([a, b]);\n    openings.forEach(o => { pts.add(o.a); pts.add(o.b); });\n    const xs = Array.from(pts).sort((p, q) => p - q);\n    const seg = (s, e, ya, yb) => { if (alongX) L(s, ya, lo, e, yb, hi, key); else L(lo, ya, s, hi, yb, e, key); };\n    for (let i = 0; i < xs.length - 1; i++) {\n      const s = xs[i], e = xs[i + 1];\n      if (e - s < 0.001 || s < a - 1e-6 || e > b + 1e-6) continue;\n      const mid = (s + e) / 2;\n      const holes = openings.filter(o => o.a <= mid && mid <= o.b).map(o => [o.y0, o.y1]).sort((p, q) => p[0] - q[0]);\n      let cur = y0;\n      for (const h of holes) { if (h[0] > cur) seg(s, e, cur, h[0]); cur = Math.max(cur, h[1]); }\n      if (cur < y1) seg(s, e, cur, y1);\n    }\n    openings.forEach(o => {\n      const p = 0.08, th = 0.06, tall = o.y1 - o.y0 > 2.0;\n      [1, -1].forEach(face => {\n        const tb = (xa, xb, ya, yb, dp) => {\n          if (alongX) L(xa, ya, face > 0 ? hi : lo - dp, xb, yb, face > 0 ? hi + dp : lo, 'wood', { noCollide: true });\n          else L(face > 0 ? hi : lo - dp, ya, xa, face > 0 ? hi + dp : lo, yb, xb, 'wood', { noCollide: true });\n        };\n        tb(o.a - p, o.b + p, o.y1, o.y1 + p * 1.3, th);\n        tb(o.a - p, o.a, o.y0, o.y1, th);\n        tb(o.b, o.b + p, o.y0, o.y1, th);\n        if (!tall) tb(o.a - p - 0.03, o.b + p + 0.03, o.y0 - 0.07, o.y0, th + 0.05);\n      });\n    });\n  };\n  const world = (x, z) => Tf(x, z);\n  const scrawl = (txt, lx, y, lz, nx, nz, wd, ht, col) => {\n    const p = Tf(lx, lz), o = Tf(0, 0), n = Tf(nx, nz);\n    const wnx = n[0] - o[0], wnz = n[1] - o[1];\n    const m = scrawlMesh(txt, wd, ht, col);\n    m.position.set(p[0] + wnx * 0.02, y, p[1] + wnz * 0.02);\n    m.rotation.y = Math.atan2(wnx, wnz);\n    scene.add(m);\n  };\n  return { Tf: world, L, wall, scrawl, rot, cx, cz };\n}\n\nfunction pyramidRoof(cx, cz, y, rw, rd, h) {\n  const g = new T.ConeGeometry(0.7071, 1, 4, 1, false);\n  g.rotateY(Math.PI / 4);\n  const uv = g.attributes.uv;\n  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rw / 2, uv.getY(i) * h / 1.5);\n  g.scale(rw, h, rd);\n  g.translate(cx, y + h / 2, cz);\n  addGeo(g, 'roof');\n}\n\nfunction addRelicAt(B, lx, lz, F, name) {\n  const w = B.Tf(lx, lz);\n  B.L(lx - 0.28, F, lz - 0.28, lx + 0.28, F + 0.75, lz + 0.28, 'wood');\n  addRelic(w[0], F + 0.75, w[1], name);\n}\n\n/* A two-storey house: foundation, carved door and windows, real staircase, floor with a stairwell, rails. */\nfunction house(cx, cz, rot, o) {\n  o = o || {};\n  const w = o.w || 8, d = o.d || 9, t = 0.3;\n  const F0 = FL0, F1 = F0 + STOREY, Ht = F1 + 3.0, n = NST, run = RUN, rise = (F1 - F0) / n;\n  const hw = w / 2, hd = d / 2;\n  const B = builder(cx, cz, rot), L = B.L, wall = B.wall;\n  const dxD = o.doorX === undefined ? 1.2 : o.doorX;\n  const sx0 = -hw + t, sx1 = sx0 + STAIR_W, zS = hd - t - 1.0, zh0 = zS - (n - 1) * run;\n\n  L(-hw - 0.25, 0, -hd - 0.25, hw + 0.25, F0 - 0.04, hd + 0.25, 'stone');\n  L(-hw + t, F0 - 0.04, -hd + t, hw - t, F0, hd - t, 'wood');\n  L(dxD - 1.3, 0, hd + 0.25, dxD + 1.3, 0.16, hd + 1.1, 'stone');\n\n  const win = (c, y, wd) => ({ a: c - wd / 2, b: c + wd / 2, y0: y + 0.95, y1: y + 2.05 });\n  const door = { a: dxD - 0.65, b: dxD + 0.65, y0: F0, y1: F0 + 2.3 };\n  wall(true, hd - t, hd, -hw, hw, 0, Ht, [door, win(-0.9, F0, 1.0), win(hw - 1.1, F0, 1.0), win(-1.2, F1, 1.0), win(2.4, F1, 1.0)], 'plaster');\n  wall(true, -hd, -hd + t, -hw, hw, 0, Ht, [win(-1.5, F0, 1.0), win(1.8, F0, 1.0), win(-1.5, F1, 1.0), win(1.8, F1, 1.0)], 'plaster');\n  const side = [win(-1.8, F0, 1.0), win(1.5, F0, 1.0), win(-2.0, F1, 1.0), win(1.8, F1, 1.0)];\n  wall(false, -hw, -hw + t, -hd + t, hd - t, 0, Ht, side, 'plaster');\n  wall(false, hw - t, hw, -hd + t, hd - t, 0, Ht, side, 'plaster');\n\n  if (o.boarded) {\n    [-0.9, hw - 1.1].forEach(c => {\n      L(c - 0.6, F0 + 1.15, hd, c + 0.6, F0 + 1.32, hd + 0.06, 'wood');\n      L(c - 0.6, F0 + 1.6, hd, c + 0.6, F0 + 1.77, hd + 0.06, 'wood');\n    });\n  }\n\n  // upper floor with stairwell\n  const sl0 = F1 - 0.2;\n  L(sx1, sl0, -hd + t, hw - t, F1, hd - t, 'wood');\n  L(sx0, sl0, -hd + t, sx1, F1, zh0, 'wood');\n  L(sx0, sl0, zS, sx1, F1, hd - t, 'wood');\n  // staircase: solid risers from the floor up\n  for (let i = 1; i <= n; i++) L(sx0, F0, zS - i * run, sx1, F0 + i * rise, zS - (i - 1) * run, 'wood');\n  // rails around the open stairwell\n  L(sx1, F1, zh0, sx1 + 0.08, F1 + 1.0, zS + 0.08, 'wood');\n  L(sx0, F1, zS, sx1, F1 + 1.0, zS + 0.08, 'wood');\n  // roof\n  L(-hw - 0.35, Ht, -hd - 0.35, hw + 0.35, Ht + 0.2, hd + 0.35, 'wood', { noCollide: true });\n  const wc = B.Tf(0, 0), swap = rot % 2 === 1;\n  pyramidRoof(wc[0], wc[1], Ht + 0.2, (swap ? d : w) + 1.5, (swap ? w : d) + 1.5, 2.6);\n\n  // partitions with doorways\n  const pz = -1.0;\n  wall(true, pz - 0.1, pz + 0.1, sx1, hw - t, F0, sl0, [{ a: 0.5, b: 1.6, y0: F0, y1: F0 + 2.2 }], 'plaster');\n  wall(true, pz - 0.1, pz + 0.1, sx1, hw - t, F1, Ht, [{ a: 0.5, b: 1.6, y0: F1, y1: F1 + 2.2 }], 'plaster');\n\n  // furniture\n  const blk = (x0, z0, x1, z1, F, h, key) => L(x0, F, z0, x1, F + h, z1, key || 'wood');\n  const table = (x, z, F, ww, dd) => L(x - ww / 2, F + 0.7, z - dd / 2, x + ww / 2, F + 0.78, z + dd / 2, 'wood');\n  const chair = (x, z, F, fz) => {\n    L(x - 0.22, F, z - 0.22, x + 0.22, F + 0.56, z + 0.22, 'wood');\n    L(x - 0.22, F + 0.56, z + (fz > 0 ? -0.22 : 0.17), x + 0.22, F + 1.05, z + (fz > 0 ? -0.17 : 0.22), 'wood');\n  };\n  table(0.4, 1.7, F0, 1.6, 0.9); chair(0.4, 0.8, F0, 1); chair(0.4, 2.6, F0, -1);\n  blk(hw - t - 0.5, 2.5, hw - t, 3.9, F0, 1.9);\n  blk(sx1 + 0.1, -4.1 + 0.0, sx1 + 1.0, -3.4, F0, 1.0, 'stone');\n  blk(hw - t - 1.0, -hd + t, hw - t, -hd + t + 0.7, F0, 1.0, 'stone');\n  blk(0.6, -hd + t, 1.5, -hd + t + 0.6, F0, 0.7);\n  chair(0.0, -2.4, F0, -1);\n  // upstairs rear bedroom\n  blk(hw - t - 1.2, -hd + t, hw - t, -2.0, F1, 0.6, 'cloth');\n  blk(hw - t - 1.2, -hd + t, hw - t, -hd + t + 0.12, F1, 1.2);\n  blk(-0.6, -hd + t, 0.4, -hd + t + 0.7, F1, 2.0);\n  // upstairs front hall\n  blk(hw - t - 0.45, 0.4, hw - t, 2.6, F1, 1.8);\n  table(0.8, 2.8, F1, 1.0, 0.7);\n  chair(-0.3, 2.8, F1, 1);\n\n  { const d0 = B.Tf(0, 0), d1 = B.Tf(-1, 0), dir = [d1[0] - d0[0], d1[1] - d0[1]];\n    addHide(B.Tf(hw - t - 0.25, 3.2), B.Tf(hw - t - 1.3, 3.2), F0, dir);\n    addHide(B.Tf(hw - t - 0.225, 1.5), B.Tf(hw - t - 1.3, 1.5), F1, dir);\n    if (o.note) { const up = !!o.note.up; addNote(B.Tf(up ? 0.8 : 0.4, up ? 2.8 : 1.7), (up ? F1 : F0) + 0.78, up ? F1 : F0, o.note); } }\n  if (o.face) { const n0 = B.Tf(0, 0), n1 = B.Tf(0, 1); addFace(B.Tf(-0.9, hd - 0.25), F0 + 1.5, [n1[0] - n0[0], n1[1] - n0[1]]); }\n  if (o.name) B.scrawl(o.name, dxD, F0 + 2.75, hd, 0, 1, 1.7, 0.42, '#d6d1bd');\n  // writing on the walls\n  const sc = o.scrawl || [];\n  if (sc[0]) B.scrawl(sc[0], hw - t, F0 + 1.7, -3.2, -1, 0, 1.5, 0.9);\n  if (sc[1]) B.scrawl(sc[1], 0.6, F1 + 1.6, hd - t, 0, -1, 1.9, 1.0);\n\n  if (o.relic) {\n    if (o.relic.up) addRelicAt(B, o.relic.x, o.relic.z, F1, o.relic.name);\n    else addRelicAt(B, o.relic.x, o.relic.z, F0, o.relic.name);\n  }\n  return B;\n}\n\n/* A church with a nave, benches, chancel steps and a choir loft reached by a real stair. */\nfunction church(cx, cz, rot) {\n  const w = 12, d = 22, t = 0.35, F0 = FL0, F1 = F0 + STOREY, Hc = 8.0;\n  const hw = w / 2, hd = d / 2, n = NST, run = RUN, rise = (F1 - F0) / n;\n  const B = builder(cx, cz, rot), L = B.L, wall = B.wall;\n  const sx0 = -hw + t, sx1 = sx0 + STAIR_W;\n  const zl0 = hd - 4.0, zS = zl0 - (n - 1) * run;\n\n  L(-hw - 0.3, 0, -hd - 0.3, hw + 0.3, F0 - 0.04, hd + 0.3, 'stone');\n  L(-hw + t, F0 - 0.04, -hd + t, hw - t, F0, hd - t, 'wood');\n  L(-2.2, 0, hd + 0.3, 2.2, 0.16, hd + 1.4, 'stone');\n  L(-2.6, 0, hd + 1.4, 2.6, 0.08, hd + 2.2, 'stone', { noCollide: false });\n\n  const tall = (c, y0, y1, wd) => ({ a: c - wd / 2, b: c + wd / 2, y0: y0, y1: y1 });\n  wall(true, hd - t, hd, -hw, hw, 0, Hc, [{ a: -1.1, b: 1.1, y0: F0, y1: F0 + 2.8 }, tall(-3.8, F1 + 0.4, F1 + 3.2, 1.2), tall(3.8, F1 + 0.4, F1 + 3.2, 1.2)], 'stone');\n  wall(true, -hd, -hd + t, -hw, hw, 0, Hc, [tall(-3.5, F0 + 2.2, F0 + 5.6, 1.2), tall(3.5, F0 + 2.2, F0 + 5.6, 1.2)], 'stone');\n  const sideWin = [-8, -4.5, -1, 2.5].map(z => tall(z, F0 + 1.8, F0 + 5.2, 1.1));\n  wall(false, -hw, -hw + t, -hd + t, hd - t, 0, Hc, sideWin, 'stone');\n  wall(false, hw - t, hw, -hd + t, hd - t, 0, Hc, sideWin.concat([tall(6.2, F1 + 0.4, F1 + 3.2, 1.1)]), 'stone');\n\n  // choir loft over the entrance, stair up the left wall\n  L(sx0, F1 - 0.25, zl0, hw - t, F1, hd - t, 'wood');\n  for (let i = 1; i <= n; i++) L(sx0, F0, zS + (i - 1) * run, sx1, F0 + i * rise, zS + i * run, 'wood');\n  L(sx1, F1, zl0, hw - t, F1 + 1.0, zl0 + 0.08, 'wood');\n  L(-hw - 0.5, Hc, -hd - 0.5, hw + 0.5, Hc + 0.25, hd + 0.5, 'wood', { noCollide: true });\n  const wc = B.Tf(0, 0), swap = rot % 2 === 1;\n  pyramidRoof(wc[0], wc[1], Hc + 0.25, (swap ? d : w) + 2, (swap ? w : d) + 2, 5.5);\n\n  // chancel steps, altar, benches\n  L(-hw + t, F0, -hd + t, hw - t, F0 + 0.18, -hd + 5.0, 'stone');\n  L(-3.5, F0 + 0.18, -hd + t, 3.5, F0 + 0.36, -hd + 3.6, 'stone');\n  L(-1.4, F0 + 0.36, -hd + 1.0, 1.4, F0 + 1.35, -hd + 2.0, 'stone');\n  const cross = B.Tf(0, -hd + t + 0.05);\n  L(-0.09, F0 + 2.2, -hd + t, 0.09, F0 + 5.8, -hd + t + 0.12, 'wood', { noCollide: true });\n  L(-0.8, F0 + 3.0, -hd + t, 0.8, F0 + 3.18, -hd + t + 0.12, 'wood', { noCollide: true });\n  const rowsZ = [-3.2, -1.4, 0.4, 2.2];\n  rowsZ.forEach((z, i) => {\n    [[-4.7, -1.5], [1.5, 4.7]].forEach((xs, k) => {\n      if (k === 0 && z > zS - 0.8) return;\n      L(xs[0], F0, z, xs[1], F0 + 0.56, z + 0.5, 'wood');\n      L(xs[0], F0 + 0.56, z + 0.5, xs[1], F0 + 1.1, z + 0.6, 'wood');\n    });\n  });\n  addNote(B.Tf(3.1, -2.95), F0 + 0.56, F0, NOTE[7]);\n  // choir loft furniture\n  L(-hw + t + 1.9, F1, hd - t - 0.9, hw - t, F1 + 1.5, hd - t, 'wood');\n\n  B.scrawl('HE WAS NEVER\\nTHE ONE THAT FELL', hw - t, F0 + 2.2, -4.2, -1, 0, 2.6, 1.3);\n  B.scrawl('FIVE FLAMES\\nFIVE', 0.0, F1 + 1.4, hd - t, 0, -1, 2.4, 1.1);\n  const alt = B.Tf(0, -hd + 1.5);\n  addRelic(alt[0], F0 + 1.35, alt[1], 'Vale');\n  B.scrawl('CHURCH OF THE OATH', 0, F0 + 4.4, hd, 0, 1, 3.2, 0.7, '#d6d1bd');\n  return B;\n}\n\n/* ---------- candles (the five relics) ---------- */\nfunction radialTex(inner, outer) {\n  const c = document.createElement('canvas'); c.width = c.height = 64;\n  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);\n  gr.addColorStop(0, inner); gr.addColorStop(1, outer);\n  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);\n  return new T.CanvasTexture(c);\n}\nconst flameTex = radialTex('rgba(255,236,170,1)', 'rgba(255,140,40,0)');\nconst haloTex = radialTex('rgba(255,170,70,.55)', 'rgba(255,120,30,0)');\n\nfunction addRelic(x, y, z, name) {\n  const grp = new T.Group();\n  grp.position.set(x, y, z);\n  const wax = new T.Mesh(new T.CylinderGeometry(0.05, 0.065, 0.24, 8), new T.MeshStandardMaterial({ color: 0xc9bfa2, roughness: 1 }));\n  wax.position.y = 0.12; grp.add(wax);\n  const dish = new T.Mesh(new T.CylinderGeometry(0.12, 0.12, 0.02, 10), M.iron);\n  dish.position.y = 0.01; grp.add(dish);\n  const flame = new T.Sprite(new T.SpriteMaterial({ map: flameTex, blending: T.AdditiveBlending, transparent: true, depthWrite: false, fog: false }));\n  flame.scale.set(0.34, 0.5, 1); flame.position.y = 0.36; grp.add(flame);\n  const halo = new T.Sprite(new T.SpriteMaterial({ map: haloTex, blending: T.AdditiveBlending, transparent: true, depthWrite: false, fog: false, opacity: 0.8 }));\n  halo.scale.set(3.4, 3.4, 1); halo.position.y = 0.4; grp.add(halo);\n  const light = new T.PointLight(0xffa24a, 1.3, 10, 2);\n  light.position.y = 0.45; grp.add(light);\n  scene.add(grp);\n  relics.push({ grp, flame, halo, light, x, y, z, name: name, taken: false, ph: R() * 10 });\n}\n\n/* ---------- world layout ---------- */\nconst WORLD = { x0: -72, x1: 72, z0: -80, z1: 66 };\nconst blobs = []; // keep-clear circles for trees\nfunction note(x, z, r) { blobs.push([x, z, r]); }\n\nconst NOTE = [\n  { order: 4, title: 'Nov. 3, 1911', text: 'Pastor Vale told us the Oath was a sin and that he would end it. At dusk he rang the bell, and we put out our flames to starve the thing in the lane. Joseph boarded every window. It did not help. Boards are not walls to it.' },\n  { order: 6, up: true, title: 'Martha', text: 'Martha went out to the well at dusk, without a flame. I watched her from this window. She stood there until dark, and then she was not standing there. I counted to twelve, the way her mother taught us, and it was in the room.' },\n  { order: 3, title: 'How the Count works', text: 'Every dusk it walks the lane and counts the houses by their light. A lit window is a counted house, and it cannot take what it has counted. Anyone who arrives after dark is uncounted, and the gate shuts behind them. That rule is older than the village.' },\n  { order: 8, up: true, title: 'Do not stare', text: 'It moves when you are not looking, and only then. Look away, move, look back: it is always nearer. But stare too long and it comes for you. The ones who stared are in the churchyard now, standing very straight. The figures on the road are echoes. They vanish when you look. The real one never does.' },\n  { order: 9, title: 'Upstairs', text: 'We went up the stairs because we thought it could not follow. It does not need stairs. It does not need doors. The cupboards bought us minutes. It searched every one, and it is patient, so do not stay hidden long.' },\n  { order: 7, title: 'The Rectory ledger', text: 'Twelve families, twelve flames, and the Count in Vale\\'s own hand. After the bell the page went blank. His last line: the Oath is kept in the church. Five flames, one for each house of the Oath, will close the Count and open the road. The money that kept the Oath alive was the same money that later built Randy Industries and the Meridian Institute.' },\n  { order: 12, title: 'Watch log', text: '11:00 pm, something at the top of the road. 11:40, the graveyard gate. 12:10, in the lane. 12:30, at my window, and I am on the third floor. 12:40, the bell. I did not ring it. Nobody is left to ring it.' },\n  { order: 14, title: 'Left on a pew', text: 'If you are reading this, the Count has you. Carry the five flames to the gate and it will let you go. But whoever it counts, it remembers. It will know your number for the rest of your life. Go now. It is patient. J. V.' },\n  { order: 11, title: 'In the hay', text: 'The Marsh boy hid in this loft and lived. He said it was not looking for people. It was looking for light. A flame it has not counted is a flame it has to put out, so the more of them you carry, the harder it hunts.' },\n  { order: 10, title: 'Tag on the coat', text: 'Property of the Tolliver farm. Do not take down. They keep watch over the field so we do not have to. If you counted five of them, count again. There were six families.' },\n  { order: 1, title: 'The Oath of the Count', text: 'Sworn at this well in the winter of 1874 by the Five Families: Vale, Hendry, Marsh, Orme, Tolliver. Light a flame at dusk in every house. What is counted is kept. What is kept is not taken.' },\n  { order: 2, title: 'Ada Hendry, 1869 to 1911', text: 'She lit her flame every night for thirty-seven years. The night the bell rang, she was the first it did not count.' },\n  { order: 5, title: 'Josiah Vale, 1858 to 1911', text: 'He was right that it was a sin. He was wrong that it could be ended. The Count did not stop. It stopped counting, and began to take.' },\n  { order: 13, title: 'Martha Hendry, aged 9', text: 'She counted to twelve. Someone should have counted to thirteen.' }\n];\nhouse(-14, 42, 1, { name: 'PELL', note: NOTE[0], boarded: true, scrawl: ['SHE STILL COUNTS\\nTHE STEPS', \"DON'T LOOK AWAY\"] });\nhouse(14, 32, 3, { name: 'HENDRY', face: true, note: NOTE[1], relic: { name: 'Hendry', up: true, x: 1.7, z: -3.8 }, scrawl: ['THE LANTERN\\nIS FOR HER', 'COUNT TO TWELVE'] });\nhouse(-14, 14, 1, { name: 'MARSH', face: true, note: NOTE[2], relic: { name: 'Marsh', up: false, x: -0.3, z: -3.6 }, scrawl: ['IT WALKS\\nTHROUGH WALLS'] });\nhouse(14, 0, 3, { name: 'ORME', note: NOTE[3], relic: { name: 'Orme', up: true, x: 1.8, z: 2.2 }, boarded: true, scrawl: ['', 'THE LIGHT IS\\nHIS LEASH'] });\nhouse(-14, -20, 1, { name: 'TOLLIVER', note: NOTE[4], relic: { name: 'Tolliver', up: true, x: 1.7, z: -3.8 }, boarded: true, scrawl: ['WE WENT UP\\nWE DID NOT COME DOWN', 'FIVE'] });\nhouse(14, -34, 3, { name: 'DUNMORE', scrawl: ['STAY IN THE LIGHT'] });\nhouse(-36, -2, 1, { name: 'THE RECTORY', face: true, note: NOTE[5], w: 9, d: 10, scrawl: ['HE WAITS WHEN\\nYOU WATCH'] });\nhouse(36, 16, 3, { name: 'BRAY', face: true, w: 8, d: 9.5, do
