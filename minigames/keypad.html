<html lang="en"><head><meta charset="utf-8">

<title>Keypad</title>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c2125;--ink:#e6e9eb;--plate:#4d555b;--plate2:#363c41;--key:#c9ced2;--mute:#9aa4ab;--line:#3a4147;--edge:#22272b}}
:root[data-theme=dark]{--bg:#1c2125;--ink:#e6e9eb;--plate:#4d555b;--plate2:#363c41;--key:#c9ced2;--mute:#9aa4ab;--line:#3a4147;--edge:#22272b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px}
main{display:grid;gap:26px;justify-items:center;padding:26px 16px 56px}
.dev{box-sizing:border-box;min-width:0;width:min(366px,100%);background:linear-gradient(160deg,var(--plate),var(--plate2));border-radius:14px;padding:18px;box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 14px 30px rgba(0,0,0,.35)}
.lcd{background:var(--lcd);border-radius:6px;padding:8px 14px 6px;color:var(--amber);font-family:VT323,"Courier New",monospace;box-shadow:inset 0 0 12px #000}
#code{font-size:48px;letter-spacing:6px;min-height:52px;overflow:hidden;white-space:nowrap}
#code:empty::before{content:"_";opacity:.5}
#msg{font-size:21px;min-height:66px;line-height:1.05;white-space:pre-line;opacity:.9}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.pad button{font:700 30px "Barlow Condensed",sans-serif;height:62px;border:0;border-radius:8px;background:var(--key);color:var(--keyink);box-shadow:0 4px 0 var(--edge);cursor:pointer;touch-action:manipulation}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.pad .go{background:var(--amber)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.how{max-width:330px;margin:0;color:var(--mute);line-height:1.3;text-align:center}
.log{min-width:0;width:min(660px,100%)}
h2{font-size:26px;margin:0 0 4px}
#cnt{color:var(--mute);margin:0 0 12px}
#log{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
#log li{border:1px solid var(--line);border-radius:6px;padding:7px 10px;display:grid;gap:1px;color:var(--mute)}
#log li b{font:400 26px VT323,monospace;letter-spacing:3px}
#log li.on{border-color:var(--amber);color:var(--ink)}
#log li.on b{color:var(--ink)}
.reset{margin-top:14px;font:inherit;background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:5px 12px;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
#fx.siren{animation:sir .5s steps(1) infinite}
@keyframes sir{0%{background:rgba(255,0,40,.45)}50%{background:rgba(0,90,255,.45)}}
#fx.blackout{background:#000;animation:blk 4s forwards}
@keyframes blk{0%,10%{opacity:1}20%{opacity:.15}30%{opacity:1}45%{opacity:.3}60%,85%{opacity:1}100%{opacity:0}}
#fx.disco{background:linear-gradient(90deg,#ff2d95,#00e5ff,#ffe600,#7c4dff);animation:hue 1s linear infinite,pulse .5s ease-in-out infinite alternate}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes pulse{from{opacity:.15}to{opacity:.5}}
#fx.hot{background:linear-gradient(to top,rgba(255,40,0,.5),transparent 70%);animation:pulse 1s ease-in-out infinite alternate}
#fx.iris{overflow:hidden}
#fx .c{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;border-radius:50%;box-shadow:0 0 0 200vmax #000;transform:translate(-50%,-50%);animation:ir 3.4s forwards}
@keyframes ir{0%{transform:translate(-50%,-50%) scale(1);opacity:1}60%,85%{transform:translate(-50%,-50%) scale(.06);opacity:1}100%{transform:translate(-50%,-50%) scale(.06);opacity:0}}
#fx .ph{position:absolute;left:50%;top:38%;font-size:110px;transform:translateX(-50%);animation:rg .3s linear infinite}
@keyframes rg{0%,50%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-18deg)}75%{transform:translateX(-50%) rotate(18deg)}}
#fx.aqua{background:linear-gradient(to top,rgba(0,150,255,.4),transparent 80%)}
#fx.rose{background:radial-gradient(circle,transparent 30%,rgba(255,60,130,.4))}
#fx.storm{animation:st 3s steps(1) infinite}
@keyframes st{0%,40%,44%,70%,74%,100%{background:rgba(20,30,60,.45)}42%,72%{background:rgba(255,255,255,.6)}}
#fx.hole{background:radial-gradient(circle at 50% 50%,#000 0,#000 7%,rgba(90,0,160,.65) 25%,transparent 60%);animation:hl 1.2s ease-in-out infinite alternate}
@keyframes hl{from{transform:scale(.8)}to{transform:scale(1.15)}}
#fx.gold{background:radial-gradient(circle,rgba(255,210,80,.55),transparent 70%);animation:pulse .6s ease-in-out infinite alternate}
#arc article{border-left:3px solid var(--amber);padding:2px 12px;margin:10px 0}
.dev.flick{animation:fl .7s steps(1)}
@keyframes fl{0%,20%,40%,60%{opacity:.15}10%,30%,50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dev.flick{animation:none}}
#arc h3{font-size:21px;margin:0}
#arc p{margin:2px 0;color:var(--mute);line-height:1.35;max-width:62ch}
body.shake .dev{animation:sh .1s linear 8}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
body.glitch .dev{animation:gl .15s steps(2) infinite}
@keyframes gl{0%{transform:translate(-7px,2px) skewX(8deg);filter:hue-rotate(90deg)}50%{transform:translate(7px,-2px) skewX(-8deg);filter:invert(1)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){body.shake .dev,body.glitch .dev{animation:none}#fx.siren,#fx.disco{animation-duration:2s}}
</style></head>

<p id="cnt"></p>
<ul id="log"></ul>
<h2 style="margin-top:24px">Archive</h2>
<div id="arc"></div>
<button class="reset" id="sable">Ask Sable for a hint</button> <button class="reset" id="reset">Reset progress</button>
</section>
</main>
